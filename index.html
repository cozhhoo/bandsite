<style>
  :root{
    --bg:#F1F5EB; --card:#FBFAF3; --ink:#223328; --ink-soft:#5A6B5D; --line:#DDE3D2;
    --leaf:#4C7A5E; --leaf-light:#C4D6C6; --amber:#E2A33D; --rest:#D8D2C2; --danger:#B4553F;
    --m1:#4C7A5E; --m2:#7FA88F; --m3:#E2A33D; --m4:#B97A56; --m5:#6E85A6; --m6:#9B7BA6;
    --radius:14px;
    --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:40px; --sp-5:64px;
    --shadow-card:0 1px 3px rgba(34,51,40,0.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 1px 1px, rgba(76,122,94,0.08) 1px, transparent 0);background-size:22px 22px;color:var(--ink);font-family:'Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}
  header{margin-bottom:28px;position:relative;}
  .notif-bell{position:absolute;top:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .notif-bell:hover{border-color:var(--leaf);}
  .notif-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;border-radius:999px;min-width:16px;height:16px;font-size:9.5px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:'Space Grotesk',sans-serif;}
  .daily-quote{margin-top:12px;padding:12px 16px;background:var(--card);border:1px dashed var(--line);border-radius:10px;}
  .dq-label{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);font-weight:700;margin-bottom:4px;}
  .dq-text{font-family:'Noto Serif SC',serif;font-size:14.5px;color:var(--ink);line-height:1.6;}
  .birthday-banner{margin-top:10px;padding:10px 16px;background:#FDF0E0;border:1px solid #EBC896;border-radius:10px;font-size:13.5px;color:#8A5A1E;}
  .birthday-banner b{color:#6B3E0A;}
  .profile-subnav{display:flex;gap:8px;margin-bottom:18px;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .name-edit-row{display:flex;gap:8px;align-items:center;}
  .name-edit-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;background:#fff;color:var(--ink);}
  .name-edit-row .btn{width:auto;padding:7px 12px;font-size:12px;}
  .float-badge{background:var(--danger);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;}
  .eyebrow{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--leaf);font-weight:700;margin-bottom:6px;}
  h1{font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(28px,5vw,42px);margin:0 0 8px;line-height:1.2;}
  .sub{color:var(--ink-soft);font-size:14.5px;max-width:60ch;line-height:1.7;}
  .sub b{color:var(--ink);}
  .tabs{display:flex;gap:8px;margin:24px 0 16px;flex-wrap:wrap;align-items:center;}
  .tab-btn{font-family:'Space Grotesk',sans-serif;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:14px;transition:.15s;}
  .tab-btn.active{background:var(--leaf);border-color:var(--leaf);color:#fff;}
  .tab-btn:hover:not(.active){border-color:var(--leaf);color:var(--leaf);}
  .spacer{flex:1;}
  .icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);height:34px;border-radius:10px;cursor:pointer;font-size:13px;padding:0 14px;display:flex;align-items:center;gap:6px;font-family:'Noto Sans SC',sans-serif;}
  .icon-btn:hover{border-color:var(--leaf);color:var(--leaf);}
  .cal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 1px 0 rgba(34,51,40,0.03);}
  .cal-month{font-family:'Noto Serif SC',serif;font-weight:700;font-size:19px;margin:0 0 14px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:11.5px;color:var(--ink-soft);text-align:center;padding-bottom:4px;font-weight:500;}
  .cal-cell{position:relative;border-radius:10px;min-height:78px;padding:6px 6px 8px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.12s;}
  .cal-cell.pad{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell.weekend{background:repeating-linear-gradient(135deg, var(--rest), var(--rest) 6px, #ece7d9 6px, #ece7d9 12px);opacity:.65;cursor:default;border-color:var(--line);}
  .cal-cell.weekend .rest-tag{position:absolute;bottom:4px;right:6px;font-size:9.5px;color:#7a7261;font-weight:500;}
  .cal-cell:not(.weekend):not(.pad):hover{border-color:var(--leaf);transform:translateY(-1px);}
  .cal-cell.today{outline:2px solid var(--amber);outline-offset:-2px;}
  .cal-date{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:500;color:var(--ink-soft);}
  .cal-cell.weekend .cal-date{color:#7a7261;}
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px;}
  .badge{position:relative;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--leaf-light);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:transparent;font-family:'Space Grotesk',sans-serif;}
  .badge.proxy::after{content:'';position:absolute;top:-2px;right:-2px;width:6px;height:6px;border-radius:50%;background:var(--amber);border:1px solid #fff;}
  .leaf.filled.proxy{box-shadow:0 0 0 2px var(--amber);}
  .proxy-tag{display:inline-block;font-size:10px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:999px;margin-left:6px;font-weight:700;vertical-align:middle;}
  .badge.done{border-color:transparent;color:#fff;}
  .badge.proxied{box-shadow:0 0 0 2px var(--amber);}
  .leaf.filled.proxied{box-shadow:0 0 0 2px var(--amber);}
  .proxied-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--amber);background:#FDF0E0;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle;}
  .overlay{position:fixed;inset:0;background:rgba(34,51,40,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .overlay.show{display:flex;}
  .panel{background:var(--card);border-radius:18px;max-width:440px;width:100%;max-height:86vh;overflow-y:auto;padding:22px;border:1px solid var(--line);}
  .panel h2{font-family:'Noto Serif SC',serif;font-size:20px;margin:0 0 2px;}
  .panel .sub{margin-bottom:16px;}
  .member-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .member-row:first-of-type{border-top:none;}
  .check-circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--leaf-light);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;margin-top:2px;transition:.12s;}
  .check-circle.on{border-color:transparent;}
  .member-info{flex:1;}
  .member-name{font-weight:700;font-size:14.5px;}
  .member-inst{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .note-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink);}
  .note-input:focus{outline:none;border-color:var(--leaf);}
  .panel-actions{display:flex;gap:8px;margin-top:18px;}
  .btn{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid transparent;}
  .btn-primary{background:var(--leaf);color:#fff;flex:1;}
  .btn-primary:hover{background:#3c624b;}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
  .journal{margin-top:34px;}
  .journal-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .journal-head h2{font-family:'Noto Serif SC',serif;font-size:21px;margin:0;}
  .journal-note{color:var(--ink-soft);font-size:13px;margin-bottom:18px;}
  .vine-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);}
  .vine-row:first-of-type{border-top:none;}
  .vine-id{width:108px;flex:0 0 auto;}
  .vine-name{font-weight:700;font-size:14px;}
  .vine-inst{font-size:11.5px;color:var(--ink-soft);}
  .vine-stats{font-family:'Space Grotesk',sans-serif;font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .vine-stats b{color:var(--ink);font-size:13px;}
  .stem-wrap{flex:1;overflow-x:auto;padding:10px 4px 4px;}
  .stem{display:flex;align-items:center;position:relative;min-width:max-content;}
  .stem::before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);transform:translateY(-1px);z-index:0;}
  .leaf{position:relative;z-index:1;width:13px;height:13px;border-radius:0% 100% 0% 100%;transform:rotate(45deg);margin-right:6px;flex:0 0 auto;background:var(--leaf-light);transition:.12s;}
  .leaf.filled{box-shadow:0 0 0 1px rgba(0,0,0,0.02);}
  .leaf.frozen{background:#8FB8D9;box-shadow:0 0 0 1px rgba(255,255,255,0.4) inset;}
  .leaf.weekend-mark{width:6px;height:6px;border-radius:50%;transform:none;background:var(--rest);margin:0 6px;}
  .leaf.future{background:transparent;border:1.5px dashed var(--line);}
  .setup-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;max-width:600px;margin:40px auto;}
  .setup-card h1{font-size:24px;}
  .setup-card ol{padding-left:20px;line-height:2;font-size:14px;color:var(--ink);}
  .setup-card code{background:#EDEBDD;padding:2px 6px;border-radius:5px;font-size:12.5px;}
  .setup-card a{color:var(--leaf);}
  .cfg-field{margin-top:14px;}
  .cfg-field label{font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .cfg-field input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:'Space Grotesk',monospace;font-size:13px;background:#fff;color:var(--ink);}
  .cfg-field input:focus{outline:none;border-color:var(--leaf);}
  .loading{color:var(--ink-soft);font-size:14px;padding:60px 0;text-align:center;}
  footer{margin-top:36px;font-size:12px;color:var(--ink-soft);text-align:center;}
  .footer-link{background:none;border:none;color:var(--leaf);text-decoration:underline;cursor:pointer;font-size:12px;font-family:inherit;padding:0;}
  .id-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .id-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;transition:.12s;}
  .id-btn:hover{border-color:var(--mc,var(--leaf));transform:translateY(-1px);}
  .id-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;}
  .id-text{display:flex;flex-direction:column;line-height:1.4;}
  .id-text b{font-size:14px;}
  .id-text small{font-size:11.5px;color:var(--ink-soft);}
  .guest-grid-scroll{max-height:280px;overflow-y:auto;padding-right:4px;}
  .id-btn-founder{grid-column:1 / -1;background:#FDF6E8;border-color:#EBD8A6;}
  .quick-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;gap:16px;}
  .quick-card.rest{background:repeating-linear-gradient(135deg, var(--rest), var(--rest) 8px, #ece7d9 8px, #ece7d9 16px);border-color:var(--line);}
  .quick-info{flex:1;}
  .quick-label{font-size:12px;color:var(--ink-soft);margin-bottom:2px;}
  .quick-name{font-family:'Noto Serif SC',serif;font-weight:700;font-size:17px;}
  .quick-note-input{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink);}
  .quick-note-input:focus{outline:none;border-color:var(--leaf);}
  .quick-toggle{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:2px solid var(--leaf-light);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;transition:.12s;}
  .quick-toggle.on{border-color:transparent;}
  .overview-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .overview-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .overview-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;}
  .overview-count{font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--ink-soft);}
  .overview-count b{color:var(--leaf);font-size:15px;}
  .overview-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
  .ov-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;background:#fff;border:1px solid var(--line);}
  .ov-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--leaf-light);}
  .ov-dot.done{background:var(--leaf);}
  .ov-name{font-size:13px;font-weight:500;flex:1;}
  .ov-name small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px;}
  .banner{background:#FDF0E8;border:1px solid #EBC8A6;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#7A4A26;margin-bottom:16px;}
  /* ---- 首页看板 ---- */
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;}
  .dash-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s;}
  .dash-card:hover{border-color:var(--leaf);transform:translateY(-2px);}
  .dash-icon{font-size:26px;flex:0 0 auto;}
  .dash-body{min-width:0;flex:1;}
  .dash-label{font-size:11.5px;color:var(--ink-soft);}
  .dash-value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;line-height:1.2;color:var(--leaf);}
  .dash-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---- 分工分配 / 数据维护 ---- */
  .role-assign-list{display:flex;flex-direction:column;gap:10px;}
  .role-assign-row{display:flex;align-items:center;gap:12px;}
  .role-assign-label{flex:1;font-size:14px;font-weight:500;}
  .role-assign-select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);flex:0 0 auto;min-width:110px;}
  .maintenance-log{margin-top:12px;font-size:12.5px;color:var(--ink-soft);line-height:1.7;}

  /* ---- 首页功能概览：一个总开关，点开看全部功能介绍 ---- */
  .guide-wrap{margin:6px 0 24px;}
  .guide-main-toggle{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px;cursor:pointer;font-family:inherit;text-align:left;transition:.15s;}
  .guide-main-toggle:hover{border-color:var(--leaf);}
  .guide-main-icon{font-size:24px;flex:0 0 auto;}
  .guide-main-text{flex:1;min-width:0;}
  .guide-main-title{display:block;font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;color:var(--ink);}
  .guide-main-sub{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .guide-main-arrow{font-size:20px;color:var(--ink-soft);flex:0 0 auto;line-height:1;transition:transform .3s;}
  .guide-wrap.open .guide-main-arrow{transform:rotate(180deg);}
  .guide-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease;}
  .guide-wrap.open .guide-body{grid-template-rows:1fr;}
  .guide-body-inner{overflow:hidden;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;}
  .guide-wrap.open .guide-body-inner{padding-top:14px;}
  .guide-group{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .guide-group-title{display:flex;align-items:center;gap:8px;font-family:'Noto Serif SC',serif;font-weight:700;font-size:14.5px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .guide-item{display:flex;gap:11px;align-items:center;padding:10px 8px;border-radius:10px;cursor:pointer;transition:.15s;}
  .guide-item:hover{background:var(--leaf-light);}
  .guide-item-icon{font-size:19px;flex:0 0 auto;}
  .guide-item-body{min-width:0;flex:1;}
  .guide-item-name{font-weight:700;font-size:13.5px;}
  .guide-item-desc{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-top:2px;}
  .guide-item-go{font-size:18px;color:var(--ink-soft);flex:0 0 auto;}

  /* ---- 器材清单 ---- */
  .gear-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .gear-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .gear-ok{background:var(--leaf);}
  .gear-worn{background:var(--amber);}
  .gear-broken{background:var(--danger);}
  .gear-missing{background:#9B7BA6;}
  .gear-main{flex:1;min-width:0;}
  .gear-name{font-weight:700;font-size:15px;}
  .gear-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .gear-status-select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;font-family:inherit;background:#fff;color:var(--ink);flex:0 0 auto;}
  .gear-del{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;flex:0 0 auto;}

  /* ---- 曲库 ---- */
  .song-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .song-stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
  .song-stat-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:var(--leaf);}
  .song-stat-label{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .song-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .song-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .song-dot-stage{background:var(--leaf);}
  .song-dot-rehearsed{background:#7FA88F;}
  .song-dot-upcoming{background:var(--amber);}
  .song-dot-shelved{background:var(--line);}
  .song-main{flex:1;min-width:0;}
  .song-title{font-weight:700;font-size:15px;}
  .song-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .song-status-select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;font-family:inherit;background:#fff;color:var(--ink);flex:0 0 auto;}
  .song-del{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;flex:0 0 auto;}

  /* ---- 对外公开展示页 ---- */
  .pub-hero{text-align:center;padding:48px 0 32px;}
  .pub-eyebrow{font-family:'Space Grotesk',sans-serif;font-size:11.5px;letter-spacing:.22em;color:var(--leaf);font-weight:700;margin-bottom:12px;}
  .pub-title{font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(34px,7vw,54px);margin:0 0 14px;line-height:1.15;}
  .pub-tagline{color:var(--ink-soft);font-size:15px;line-height:1.8;margin:0 auto;max-width:34em;}
  .pub-banner{width:100%;max-height:320px;object-fit:cover;border-radius:18px;margin-top:28px;display:block;}
  .pub-section{margin:44px 0;}
  .pub-h2{font-family:'Noto Serif SC',serif;font-size:22px;margin:0 0 18px;text-align:center;}
  .pub-members{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  @media (max-width:640px){ .pub-members{grid-template-columns:repeat(3,1fr);} .song-stats{grid-template-columns:repeat(2,1fr);} }
  .pub-member{text-align:center;}
  .pub-member-avatar{width:70px;height:70px;border-radius:50%;margin:0 auto 8px;background:var(--card);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .pub-member-avatar img{width:100%;height:100%;object-fit:contain;}
  .pub-member-name{font-weight:700;font-size:13.5px;}
  .pub-member-role{font-size:11.5px;color:var(--ink-soft);}
  .pub-gig{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px;}
  .pub-gig-date{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--leaf);flex:0 0 auto;text-align:center;line-height:1.2;}
  .pub-gig-date span{font-size:11px;color:var(--ink-soft);font-weight:400;}
  .pub-gig-title{font-weight:700;font-size:15.5px;}
  .pub-gig-venue{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .pub-songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
  .pub-song{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .pub-song b{display:block;font-size:14.5px;}
  .pub-song span{font-size:12px;color:var(--ink-soft);}
  .pub-song-more{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:14px;}
  .pub-contact{text-align:center;}
  .pub-enter{text-align:center;margin:48px 0 20px;padding-top:32px;border-top:1px solid var(--line);}

  /* ---- 夸夸墙入口卡片（放在回忆动态顶部，做得显眼一点） ---- */
  .praise-entry{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FDF6E8,#F3F8EE);border:1px solid #E8D9A8;border-radius:16px;padding:16px 18px;margin-bottom:18px;cursor:pointer;transition:.15s;}
  .praise-entry:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(120,100,40,.12);}
  .praise-entry-icon{font-size:32px;flex:0 0 auto;}
  .praise-entry-main{flex:1;min-width:0;}
  .praise-entry-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:17px;}
  .praise-entry-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .praise-entry-arrow{font-size:26px;color:var(--ink-soft);flex:0 0 auto;}

  /* ---- 演出通告 ---- */
  .gig-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .gig-card.gig-cancelled,.gig-card.gig-done{opacity:.6;}
  .gig-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .gig-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;flex:1;min-width:0;}
  .gig-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;flex:0 0 auto;}
  .gig-status-pending{background:#FDF0E0;color:#8A5A1E;}
  .gig-status-confirmed{background:var(--leaf-light);color:#2F4A3D;}
  .gig-status-done{background:#E4E9E0;color:#5A6B5D;}
  .gig-status-cancelled{background:#F3DEDA;color:#8B2E1F;}
  .gig-del{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;}
  .gig-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);}
  .gig-note{font-size:13.5px;line-height:1.6;margin-top:8px;white-space:pre-wrap;}
  .gig-attend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .gig-attend-label{color:var(--ink-soft);}
  .gig-attend-yes{color:var(--leaf);font-weight:500;}
  .gig-attend-no{color:var(--danger);}
  .gig-rsvp{display:flex;gap:8px;margin-top:10px;}
  .gig-rsvp-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .gig-rsvp-btn:hover{border-color:var(--leaf);color:var(--leaf);}
  .gig-rsvp-btn.active{background:var(--leaf);border-color:var(--leaf);color:#fff;}
  .gig-status-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .gig-set-status{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:11.5px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .gig-set-status.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  /* ---- 夸夸墙 ---- */
  .praise-podium{display:flex;gap:10px;margin-bottom:16px;}
  .praise-podium-item{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;}
  .praise-podium-medal{font-size:24px;}
  .praise-podium-name{font-weight:700;font-size:13px;margin-top:4px;}
  .praise-podium-count{font-size:11px;color:var(--ink-soft);}
  .praise-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .praise-head{display:flex;align-items:center;gap:6px;font-size:12.5px;flex-wrap:wrap;margin-bottom:6px;}
  .praise-from{font-weight:700;color:var(--leaf);}
  .praise-arrow{color:var(--ink-soft);}
  .praise-to{font-weight:700;color:var(--amber);}
  .praise-time{margin-left:auto;color:var(--ink-soft);font-size:11px;font-family:'Space Grotesk',sans-serif;}
  .praise-text{font-size:15px;line-height:1.6;white-space:pre-wrap;}
  .praise-actions{display:flex;gap:12px;margin-top:8px;align-items:center;}
  .praise-like{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .praise-like:hover{border-color:var(--leaf);color:var(--leaf);}
  .praise-like.liked{background:var(--leaf-light);border-color:var(--leaf);color:var(--ink);}
  .praise-del{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;}

  /* ---- 乐队小账本 ---- */
  .ledger-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  @media (max-width:560px){ .ledger-summary{grid-template-columns:repeat(2,1fr);} }
  .ledger-stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
  .ledger-stat-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .ledger-stat-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}
  .ledger-stat-num.income{color:var(--leaf);}
  .ledger-stat-num.expense{color:var(--danger);}
  .ledger-form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media (max-width:560px){ .ledger-form{grid-template-columns:repeat(2,1fr);} }
  .ledger-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .ledger-row-main{flex:1;min-width:0;}
  .ledger-row-note{font-size:14px;font-weight:500;}
  .ledger-row-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .ledger-row-amount{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;flex:0 0 auto;}
  .ledger-row-amount.income{color:var(--leaf);}
  .ledger-row-amount.expense{color:var(--danger);}
  .ledger-del{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;flex:0 0 auto;}
  .np-reactions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .np-react{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .np-react:hover{border-color:var(--leaf);color:var(--leaf);}
  .np-react.active{background:var(--leaf);border-color:var(--leaf);color:#fff;}
  .home-entries{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0;}
  @media (max-width:520px){ .home-entries{grid-template-columns:repeat(2,1fr);} }
  .entry-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 14px;text-align:center;cursor:pointer;transition:.15s;}
  .entry-card:hover{border-color:var(--leaf);transform:translateY(-2px);}
  .entry-icon{font-size:32px;margin-bottom:8px;}
  .entry-label{font-family:'Noto Serif SC',serif;font-weight:700;font-size:15px;}
  .entry-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .instrument-deco{display:flex;justify-content:center;gap:22px;font-size:38px;opacity:.5;margin:50px 0 10px;filter:grayscale(.15);}

  /* ---- 娱乐吧 / 谁是卧底 ---- */
  .game-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
  .game-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 14px;text-align:center;cursor:pointer;transition:.15s;}
  .game-card:hover{border-color:var(--leaf);transform:translateY(-2px);}
  .game-icon{font-size:32px;margin-bottom:8px;}
  .game-name{font-family:'Noto Serif SC',serif;font-weight:700;font-size:15px;}
  .game-desc{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .uc-player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:6px;}
  .uc-player-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;}
  .uc-avatar{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
  .uc-word-card{background:var(--card);border:1px dashed var(--leaf);border-radius:10px;padding:14px 16px;font-size:15px;margin-top:10px;}
  .uc-word-card b{color:var(--leaf);font-size:18px;}
  .uc-vote-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .uc-vote-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .uc-vote-btn:hover{border-color:var(--leaf);color:var(--leaf);}
  .uc-vote-btn.active{background:var(--leaf);border-color:var(--leaf);color:#fff;}
  .uc-reveal-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .uc-reveal-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;}
  .uc-reveal-name{font-weight:700;font-size:13.5px;flex:0 0 auto;min-width:60px;}
  .uc-reveal-role{font-size:12px;color:var(--ink-soft);flex:0 0 auto;min-width:64px;}
  .uc-reveal-role.uc-role-spy{color:var(--danger);font-weight:700;}
  .uc-reveal-word{font-size:12.5px;color:var(--ink-soft);margin-left:auto;}

  /* ---- 中国鸟能飞 ---- */
  .bird-select-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:15px;margin-bottom:10px;}
  .bird-char-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;}
  .bird-char{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;cursor:pointer;font-family:inherit;transition:.15s;}
  .bird-char:hover{border-color:var(--leaf);transform:translateY(-2px);}
  .bird-char-img{width:52px;height:52px;border-radius:50%;margin:0 auto 6px;background:var(--leaf-light);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;color:#fff;}
  .bird-char-img img{width:100%;height:100%;object-fit:contain;}
  .bird-char-name{font-size:12.5px;font-weight:700;text-align:center;}
  .bird-rank{display:flex;flex-direction:column;gap:8px;}
  .bird-rank-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
  .bird-rank-row.me{border-color:var(--leaf);background:var(--leaf-light);}
  .bird-rank-no{width:28px;text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--ink-soft);flex:0 0 auto;}
  .bird-rank-no.top{font-size:19px;}
  .bird-rank-avatar{width:34px;height:34px;border-radius:50%;background:var(--leaf-light);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;color:#fff;font-size:13px;flex:0 0 auto;}
  .bird-rank-avatar img{width:100%;height:100%;object-fit:contain;}
  .bird-rank-name{flex:1;font-weight:700;font-size:14px;min-width:0;}
  .bird-rank-score{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:var(--leaf);flex:0 0 auto;}
  .bird-stage{position:relative;max-width:420px;margin:0 auto;border-radius:14px;overflow:hidden;border:1px solid var(--line);touch-action:none;}
  #birdCanvas{width:100%;height:auto;display:block;touch-action:none;}
  .bird-overlay{position:absolute;inset:0;background:rgba(34,51,40,.45);display:none;align-items:center;justify-content:center;cursor:pointer;}
  .bird-overlay.show{display:flex;}
  .bird-overlay-inner{background:var(--card);border-radius:14px;padding:22px 28px;text-align:center;}
  .bird-overlay-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:19px;}
  .bird-overlay-sub{font-size:13px;color:var(--ink-soft);margin-top:6px;}

  /* ---- 枪战对决 ---- */
  .sh-rotate-hint{display:none;align-items:center;justify-content:center;height:280px;font-size:18px;color:var(--ink-soft);text-align:center;background:var(--card);border-radius:14px;border:1px dashed var(--line);}
  .sh-stage{position:relative;width:100%;max-width:800px;margin:0 auto;aspect-ratio:800/450;background:#000;border-radius:12px;overflow:hidden;touch-action:none;}
  #shCanvas{width:100%;height:100%;display:block;}
  .sh-hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;}
  .sh-joystick{position:absolute;left:20px;bottom:20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);touch-action:none;}
  .sh-joystick-knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,255,255,.85);}
  .sh-topbtns{position:absolute;top:8px;right:10px;display:flex;gap:6px;}
  .sh-scoreboard{position:absolute;top:34px;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:4px;padding:0 8px;pointer-events:none;}
  .sh-sb-item{background:rgba(0,0,0,.45);border:1.5px solid #4C7A5E;border-radius:999px;padding:2px 8px;font-size:9.5px;color:#fff;font-family:'Space Grotesk',sans-serif;white-space:nowrap;}
  .sh-sb-item.sh-sb-dead{opacity:.4;}
  .sh-skillbtn{position:absolute;right:20px;bottom:16px;width:74px;height:74px;border-radius:50%;background:rgba(76,122,94,.8);border:3px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:30px;touch-action:none;user-select:none;cursor:pointer;}
  .sh-skill-cd{display:none;position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.55);align-items:center;justify-content:center;font-size:20px;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .sh-exit-btn{position:static;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:11px;cursor:pointer;}
  .sh-stage{overscroll-behavior:contain;}
  .sh-spectate-tag{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);color:#fff;padding:5px 12px;border-radius:999px;font-size:12px;}
  .sh-player-chip{cursor:default;}
  .back-link{background:none;border:none;color:var(--leaf);font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer;padding:0;margin-bottom:14px;display:inline-flex;align-items:center;gap:4px;}
  .sub-nav{display:flex;gap:8px;margin-bottom:18px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px;}
  .section-head h2{font-family:'Noto Serif SC',serif;font-size:18px;margin:0;}
  .empty-hint{color:var(--ink-soft);font-size:13.5px;padding:20px 0;text-align:center;}
  .meeting-card{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .meeting-date{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--leaf);flex:0 0 auto;min-width:56px;}
  .meeting-body{flex:1;}
  .meeting-title{font-weight:700;font-size:14px;}
  .meeting-summary{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .meeting-photo-count{font-size:11px;color:var(--leaf);margin-top:4px;font-weight:600;}
  .mem-thumb-wrap{position:relative;margin-top:6px;border-radius:6px;overflow:hidden;height:28px;}
  .mem-thumb{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.75);}
  .mem-thumb-count{position:absolute;bottom:2px;right:3px;font-size:9px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .trip-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px;}
  .trip-photo-item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;}
  .trip-photo-meta{font-size:10.5px;color:var(--ink-soft);margin-top:3px;line-height:1.3;}
  .trip-photo-meta button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:10.5px;padding:0;font-family:inherit;text-decoration:underline;}
  .trip-photo-add-row{margin-top:10px;}
  .meeting-del,.meeting-del-inline{flex:0 0 auto;}
  .composer{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:22px;}
  .composer textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:14px;resize:vertical;min-height:60px;background:#fff;color:var(--ink);}
  .composer textarea:focus{outline:none;border-color:var(--leaf);}
  .composer-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .composer-row select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);}
  .share-fields{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .share-fields input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);}
  .photo-preview{max-width:140px;max-height:140px;border-radius:10px;margin-top:8px;display:block;object-fit:cover;}
  .post-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .post-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .post-avatar{width:34px;height:34px;border-radius:50%;background:var(--leaf-light);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex:0 0 auto;overflow:hidden;}
  .post-avatar img{width:100%;height:100%;object-fit:cover;}
  .post-author{font-weight:700;font-size:14px;}
  .post-time{font-size:11.5px;color:var(--ink-soft);}
  .post-text{font-size:14px;line-height:1.6;white-space:pre-wrap;}
  .post-photo{max-width:100%;border-radius:10px;margin-top:10px;display:block;}
  .post-share{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;}
  .post-share a{color:var(--leaf);}
  .post-actions{display:flex;gap:14px;margin-top:10px;align-items:center;}
  .post-like{background:none;border:none;cursor:pointer;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;}
  .post-like.liked{color:var(--danger);}
  .post-liked-by{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .post-del{background:none;border:none;cursor:pointer;font-size:12px;color:var(--ink-soft);text-decoration:underline;}
  .comments{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
  .comment-row{font-size:13px;margin-bottom:6px;}
  .comment-row b{margin-right:4px;}
  .comment-tools{display:flex;gap:10px;margin:2px 0 6px;}
  .comment-tools button{background:none;border:none;color:var(--ink-soft);font-size:11px;cursor:pointer;padding:0;}
  .comment-tools button:hover{color:var(--leaf);text-decoration:underline;}
  .comment-input{display:flex;gap:6px;margin-top:6px;}
  .comment-input input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);}
  .profile-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;}
  .profile-top{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .avatar-big{width:76px;height:76px;border-radius:50%;background:var(--leaf-light);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;cursor:pointer;overflow:hidden;flex:0 0 auto;}
  .avatar-big img{width:100%;height:100%;object-fit:cover;}
  .profile-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-block label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .field-block input,.field-block select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);}
  .gender-btns{display:flex;gap:8px;}
  .theme-color-row{display:flex;flex-wrap:wrap;gap:8px;}
  .theme-color-dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .theme-color-dot.active{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset;}
  .badge-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:10px;}
  .badge-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;}
  .badge-chip.locked{opacity:.45;}
  .badge-icon{font-size:24px;margin-bottom:4px;}
  .badge-label{font-size:10.5px;color:var(--ink-soft);line-height:1.3;}
  .badge-chip.earned .badge-label{color:var(--ink);font-weight:700;}
  .gender-btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;font-size:12.5px;cursor:pointer;}
  .gender-btn.active{border-color:var(--leaf);background:var(--leaf-light);color:var(--ink);font-weight:700;}
  .profile-stat{margin-top:14px;font-size:13px;color:var(--ink-soft);}
  .profile-stat b{color:var(--leaf);font-size:16px;}
  .friend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:6px;}
  .friend-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.12s;}
  .friend-card:hover{border-color:var(--leaf);}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;}
  .role-btn{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 14px;text-align:center;cursor:pointer;transition:.15s;font-family:inherit;}
  .role-btn:hover{border-color:var(--leaf);transform:translateY(-2px);}
  .role-icon{font-size:34px;margin-bottom:8px;}
  .role-label{font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;}
  .role-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .main-tab-locked{cursor:default!important;}
  .main-tab-locked:hover{border-color:var(--line)!important;color:var(--ink-soft)!important;}
  .main-tab-locked.active:hover{color:#fff!important;border-color:var(--leaf)!important;}
  /* ---- 微信式聊天界面 ---- */
  .chat-page{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:380px;}
  .chat-header{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto;}
  .chat-back{background:none;border:none;font-size:28px;line-height:1;color:var(--leaf);cursor:pointer;padding:0 4px;flex:0 0 auto;}
  .chat-header-avatar{width:40px;height:40px;border-radius:10px;background:var(--leaf-light);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden;cursor:pointer;flex:0 0 auto;transition:.15s;}
  .chat-header-avatar:hover{transform:scale(1.05);}
  .chat-header-avatar img{width:100%;height:100%;object-fit:cover;}
  .chat-header-info{cursor:pointer;min-width:0;flex:1;}
  .chat-header-name{font-weight:700;font-size:15.5px;}
  .chat-header-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .chat-page .chat-thread{flex:1;max-height:none;overflow-y:auto;padding:16px 14px;background:var(--bg);}
  .chat-page .chat-input-row{padding:12px 14px;border-top:1px solid var(--line);margin-top:0;flex:0 0 auto;background:var(--card);}

  .chat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:20px;}
  .chat-thread{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px;}
  .chat-bubble-row{display:flex;}
  .chat-bubble-row.mine{justify-content:flex-end;}
  .chat-bubble-wrap{display:flex;flex-direction:column;max-width:75%;}
  .chat-bubble-row.mine .chat-bubble-wrap{align-items:flex-end;}
  .chat-bubble{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;line-height:1.5;word-break:break-word;}
  .chat-bubble-row.mine .chat-bubble{background:var(--leaf);color:#fff;border-color:var(--leaf);}
  .chat-meta{display:flex;gap:8px;align-items:center;font-size:10.5px;color:var(--ink-soft);margin-top:2px;padding:0 2px;}
  .chat-recall-btn{background:none;border:none;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:10.5px;padding:0;font-family:inherit;}
  .chat-recall-btn:hover{color:var(--leaf);}
  .chat-input-row{display:flex;gap:8px;margin-top:10px;}
  .chat-input-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);}

  /* ---- 首页乐队封面 ---- */
  .band-banner{position:relative;border-radius:16px;overflow:hidden;margin-bottom:18px;min-height:150px;background:linear-gradient(135deg,#4C7A5E,#2F4A3D);display:flex;align-items:center;justify-content:center;}
  .band-banner img{width:100%;height:220px;object-fit:cover;display:block;}
  .band-banner .banner-empty{color:rgba(255,255,255,.85);font-family:'Noto Serif SC',serif;font-size:14px;text-align:center;padding:34px 20px;}
  .banner-edit-btn{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;}
  .banner-edit-btn:hover{background:rgba(0,0,0,.6);}
  .announce-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;}
  .announce-body{font-size:13.5px;line-height:1.7;color:var(--ink);}

  /* ---- 个人展示墙（毛毡板）---- */
  .board-frame{position:relative;width:100%;aspect-ratio:4/3;max-height:480px;border-radius:10px;overflow:hidden;background-color:#6B4A32;
    background-image:radial-gradient(circle at 18% 28%, rgba(255,255,255,0.05) 0, transparent 40%),
      radial-gradient(circle at 72% 62%, rgba(255,255,255,0.04) 0, transparent 45%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 5px);
    border:9px solid #7a5a3a;box-shadow:inset 0 0 30px rgba(0,0,0,0.35);touch-action:none;}
  .board-frame.readonly{touch-action:auto;}
  .board-el{position:absolute;left:0;top:0;transform-origin:center center;cursor:grab;user-select:none;touch-action:none;}
  .board-frame.readonly .board-el{cursor:default;}
  .board-el.dragging{cursor:grabbing;}
  .board-el img{display:block;max-width:150px;max-height:150px;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.35);border:4px solid #fff;pointer-events:none;}
  .board-el .el-text{background:rgba(255,250,230,0.95);padding:6px 10px;border-radius:4px;box-shadow:0 3px 8px rgba(0,0,0,.3);font-family:'Noto Serif SC',serif;white-space:pre-wrap;max-width:200px;pointer-events:none;}

  .board-el.selected{outline:2px dashed var(--amber);outline-offset:5px;}
  .board-doodle-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  .el-toolbar{position:absolute;display:flex;gap:2px;background:#223328;border-radius:8px;padding:4px;box-shadow:0 4px 10px rgba(0,0,0,.3);z-index:999;}
  .el-toolbar button{background:none;border:none;color:#fff;cursor:pointer;font-size:14px;padding:4px 7px;border-radius:5px;}
  .el-toolbar button:hover{background:rgba(255,255,255,.18);}
  .board-toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .board-toolbar .btn{width:auto;padding:7px 14px;font-size:13px;}
  .sticker-palette{display:flex;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;}
  .sticker-palette button{font-size:24px;background:none;border:none;cursor:pointer;padding:3px 5px;border-radius:6px;}
  .sticker-palette button:hover{background:var(--leaf-light);}
  .text-add-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
  .color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .color-dot.active{border-color:var(--ink);}
  .doodle-canvas{position:absolute;inset:0;touch-action:none;}
  .doodle-toolbar{position:absolute;bottom:8px;left:8px;right:8px;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,0.45);padding:7px 9px;border-radius:10px;flex-wrap:wrap;}
  .doodle-toolbar .btn{width:auto;padding:5px 12px;font-size:12px;}

/* 把图片压缩成一个不太大的 base64，直接存进数据库，不依赖额外的图片存储服务 */
function fileToResizedDataURL(file, maxDim=760, quality=0.72){
  return new Promise((resolve,reject)=>{
    if(!file) return resolve(null);
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('读取图片失败'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('图片解析失败'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else{ w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- 图片存储：改存 Supabase Storage，不再塞进数据库 ----------------
   之前所有照片都是压缩成 base64 文本，跟打卡记录挤在同一份 JSON 里。
   照片一多，每个人每次打开网站都得把所有照片一起下载下来，越用越慢。
   现在改成：图片单独上传到 Supabase Storage，数据库里只存一个很短的网址。

   ⚠️ 需要在 Supabase 后台做一次设置（只要做一次）：
   1. 左侧菜单 Storage → New bucket，名字填 band-photos
   2. 勾选 Public bucket（公开），这样图片才能直接显示出来
   3. 建好之后就不用管了

   如果这个 bucket 没建好、或者上传失败，代码会自动退回到老办法
   （压缩成 base64 存数据库），保证功能不会因此坏掉。 */
const STORAGE_BUCKET = 'band-photos';

/* 把 canvas/dataURL 转成可上传的二进制块 */
function dataURLToBlob(dataUrl){
  const [head, body] = dataUrl.split(',');
  const mime = (head.match(/:(.*?);/)||[null,'image/jpeg'])[1];
  const bin = atob(body);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

/* 上传一张图片，返回可直接放进 <img src> 的网址；失败时返回 null 让调用方走兜底 */
async function uploadImage(dataUrl, folder){
  if(!dataUrl) return null;
  if(!dataUrl.startsWith('data:')) return dataUrl; // 已经是网址了，不用重复上传
  try{
    const blob = dataURLToBlob(dataUrl);
    const ext = blob.type.includes('png') ? 'png' : 'jpg';
    const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await supabaseClient.storage.from(STORAGE_BUCKET)
      .upload(path, blob, { contentType: blob.type, upsert:false });
    if(error) throw error;
    const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
    return (data && data.publicUrl) ? data.publicUrl : null;
  }catch(e){
    console.warn('图片上传到 Storage 失败，退回存数据库的老办法：', e.message);
    return null;
  }
}

/* 统一入口：压缩 → 上传 → 拿到网址；上传不成功就退回 base64，功能不会坏 */
async function prepareImage(file, folder, maxDim, quality){
  const dataUrl = await fileToResizedDataURL(file, maxDim, quality);
  if(!dataUrl) return null;
  const url = await uploadImage(dataUrl, folder);
  return url || dataUrl;
}

/* ---------------- 实时同步（Supabase Realtime）----------------
   之前的问题：想知道对方有没有新消息，只能靠手动点"刷新最新数据"，
   或者等待下一次操作。这里订阅这张表的变化，只要任何人保存了新数据，
   所有打开着网页的人都会在几乎同一瞬间收到推送，不用再手动刷新。
   注意：这需要在 Supabase 后台把 checkin 这张表的 Realtime 打开——
   Supabase 控制台 → Database → Replication，把 checkin 表的开关打开，
   不然下面这个订阅不会收到任何推送（代码本身不会报错，只是收不到）。 */
function applyRemoteData(data){
  if(!data) return;
  state.members = data.members || state.members;
  state.checkins = data.checkins || {};
  state.meetings = data.meetings || [];
  state.posts = data.posts || [];
  state.profiles = data.profiles || {};
  state.guests = data.guests || [];
  state.credentials = data.credentials || {};
  state.messages = data.messages || [];
  state.boards = data.boards || {};
  state.bandBanner = data.bandBanner || null;
  state.notifications = data.notifications || [];
  state.announcement = data.announcement || '';
  state.nameProposals = data.nameProposals || [];
  state.freezeTokens = data.freezeTokens || {};
  state.frozenDays = data.frozenDays || {};
  state.freezeAwardMark = data.freezeAwardMark || {};
  state.teambuilds = data.teambuilds || [];
  state.dayMemories = data.dayMemories || {};
  state.undercoverGame = data.undercoverGame || null;
  state.shooterGame = data.shooterGame || null;
  state.praises = data.praises || [];
  state.ledger = data.ledger || [];
  state.gigs = data.gigs || [];
  state.songs = data.songs || DEFAULT_SONGS;
  state.roles = data.roles || DEFAULT_ROLES;
  state.gear = data.gear || [];
  state.birdScores = data.birdScores || {};
}

function startRealtimeSync(){
  try{
    supabaseClient
      .channel('band-site-sync')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'checkin', filter: 'date=eq.main_data' }, (payload)=>{
        if(!payload.new || !payload.new.data) return;
        if(saveInFlight){
          // 本地正好有改动在排队保存（比如刚点了取消打卡/代打卡），这时候不能拿服务器的旧快照
          // 覆盖回来，不然会把还没保存成功的改动又悄悄改回原样——这正是"打卡取消不了"的真正原因。
          // 等本地这一轮保存跑完，我们自己的最新结果自然会广播出去，到时候再同步。
          return;
        }
        applyRemoteData(payload.new.data);
        renderNotifBell();
        // 只刷新当前正在看的那一小块界面，不做整页重绘，避免打断正在输入的内容
        if(document.getElementById('postList')) renderPostList();
        if(document.getElementById('chatThread') && state.viewingFriend !== null && state.viewingFriend !== undefined){
          renderChatThread(state.viewingFriend);
        }
      })
      .subscribe();
  }catch(e){
    console.error('实时同步订阅失败（不影响手动刷新）：', e);
  }
}

/* 给一个 promise 加超时保护：网络请求如果一直挂着不返回也不报错，
   等太久就自动判定失败，绝不会让保存队列永远卡在"进行中"出不来 */
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error((label||'操作')+'超时（超过'+(ms/1000)+'秒无响应），请检查网络后重试')), ms))
  ]);
}

async function saveAll(){
  try{
    await withTimeout(remoteSet({
      members: state.members,

const saveCheckins = queueSave; // 兼容旧函数名，且必须走排队保存，不能绕过

/* 保存排队器：每次都是整份数据整体上传，短时间内连续操作（比如连发几条消息）
   会触发好几个并发的网络请求，谁先谁后完全看网络状况，慢的那个后到达
   反而会把快的那个覆盖掉——这就是"发几条消息、内容会消失/要很久才出现"的
   根本原因。用这个队列把保存严格排成一个接一个，绝不并发，并且如果保存
   进行中又来了新的改动，只会在当前这次结束后再补发"最新状态"一次，
   不会无限堆积请求。 */
let saveInFlight = false, saveAgainNeeded = false;
async function queueSave(){
  saveAgainNeeded = true;
  if(saveInFlight) return;
  saveInFlight = true;
  while(saveAgainNeeded){
    saveAgainNeeded = false;
    await saveAll();
  }
  saveInFlight = false;
}

function pickDailyQuote(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  const idx = ((dayOfYear % DAILY_QUOTES.length) + DAILY_QUOTES.length) % DAILY_QUOTES.length;
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  return { text: DAILY_QUOTES[idx], date: dateStr };
}

function openNotifPanel(){

    html += mine.map(n=>{
      const from = getPersonById(n.fromId);
      let text;
      if(n.type==='like') text = `${escapeHtml(from.name)} 点赞了你的帖子`;
      else if(n.type==='comment') text = `${escapeHtml(from.name)} 评论了你的帖子${n.extra? '：'+escapeHtml(n.extra):''}`;
      else if(n.type==='reply') text = `${escapeHtml(from.name)} 回复了你的评论${n.extra? '：'+escapeHtml(n.extra):''}`;
      else if(n.type==='new_guest') text = `🙋 新游客注册：${escapeHtml(from.name)}`;
      else if(n.type==='praise') text = `🌟 ${escapeHtml(from.name)} 在夸夸墙夸了你${n.extra? '：'+escapeHtml(n.extra):''}`;
      else if(n.type==='new_gig') text = `🎤 杉菜发布了新的演出通告${n.extra? '：'+escapeHtml(n.extra):''}`;
      else text = `${escapeHtml(from.name)} 发布了一条新帖子`;
      return `<div class="member-row" style="align-items:center;">
        <div class="member-info">
          <div class="member-name" style="font-size:13.5px;">${text}</div>
          <div class="member-inst">${new Date(n.ts).toLocaleString()}</div>
        </div>
      </div>`;

/* 首页看板：把六个人各管一摊的关键信息汇总到一处，一进来就知道该干嘛 */
function renderDashboard(){
  const now = TODAY;
  const todayKey = dateKey(now.getFullYear(), now.getMonth(), now.getDate());
  const cards = [];

  // 今天还有谁没打卡（只在暑期打卡月份显示）
  if(isCheckinMonth(now.getMonth())){
    const entries = getEntries(todayKey);
    const missing = (state.members||[]).filter((m,i)=>!entries[i] || !entries[i].checked);
    cards.push({
      icon: missing.length? '⏰' : '🎉',
      label: '今日打卡',
      value: `${(state.members||[]).length - missing.length}/${(state.members||[]).length}`,
      sub: missing.length? `还差 ${missing.map(m=>m.name).join('、')}` : '全员完成，漂亮！',
      tab: 'schedule', sub2:'checkin'
    });
  }

  // 最近一场确认的演出
  const nextGig = (state.gigs||[])
    .filter(g=>g.status==='confirmed' && g.date>=todayKey)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0];
  if(nextGig){
    const days = Math.round((new Date(nextGig.date) - new Date(todayKey))/86400000);
    cards.push({
      icon:'🎤', label:'下一场演出',
      value: days===0? '就是今天' : `${days} 天后`,
      sub: nextGig.title, tab:'schedule', sub2:'gig'
    });
  }

  // 曲库进度
  const songs = state.songs||[];
  if(songs.length){
    const ready = songs.filter(s=>s.status==='stage'||s.status==='rehearsed').length;
    cards.push({
      icon:'🎵', label:'曲库',
      value:`${ready}/${songs.length}`,
      sub:`${songs.filter(s=>s.status==='upcoming').length} 首待练`,
      tab:'schedule', sub2:'song'
    });
  }

  // 账本结余
  const ledger = state.ledger||[];
  if(ledger.length){
    const inc = ledger.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0);
    const exp = ledger.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0);
    const bal = inc-exp;
    cards.push({
      icon:'💰', label:'账本结余',
      value:(Math.round(bal*100)/100).toLocaleString('zh-CN'),
      sub:`共 ${ledger.length} 笔记录`, tab:'schedule', sub2:'ledger'
    });
  }

  if(!cards.length) return '';
  return `<div class="dash-grid">${cards.map((c,i)=>`
    <div class="dash-card" data-tab="${c.tab}" data-sub="${c.sub2||''}">
      <div class="dash-icon">${c.icon}</div>
      <div class="dash-body">
        <div class="dash-label">${c.label}</div>
        <div class="dash-value">${escapeHtml(String(c.value))}</div>
        <div class="dash-sub">${escapeHtml(c.sub||'')}</div>
      </div>
    </div>`).join('')}</div>`;
}

function startUndercoverGame(game, undercoverCount){
  const players = [...game.players];
  // 洗牌
  for(let i=players.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [players[i],players[j]] = [players[j],players[i]];
  }
  const pair = UNDERCOVER_WORD_PAIRS[Math.floor(Math.random()*UNDERCOVER_WORD_PAIRS.length)];
  const roles = {};
  players.forEach((pid,idx)=>{ roles[pid] = idx < undercoverCount ? 'undercover' : 'civilian'; });
  game.status = 'playing';
  game.hostId = state.identity;
  game.undercoverCount = undercoverCount;
  game.roles = roles;
  game.words = { civilian: pair[0], undercover: pair[1] };
  game.alive = [...game.players];
  game.round = 1;
  game.votes = {};
  game.lastResult = null;
}

function renderUndercoverPlaying(target, game){
  const mine = state.identity;
  const iPlay = game.alive.some(p=>String(p)===String(mine)) || game.players.some(p=>String(p)===String(mine));
  const myRole = game.roles[mine];
  const myWord = myRole ? game.words[myRole] : null;
  const aliveList = game.alive;

  target.innerHTML = `
    <button class="back-link" id="backToGames">← 返回娱乐吧</button>

    ` : ''}

  `;
  document.getElementById('backToGames').onclick = ()=>{ state.funGame = null; renderFunTab(target); };

    if(!confirm('确定提前结束这一局吗？会直接公布所有人的身份。')) return;

    renderUndercoverGame(target);

    const p = getPersonById(pid);
    return `<div class="uc-player-chip"><div class="uc-avatar" style="background:${isGuestIdentity(pid)?'var(--amber)':getPersonColor(pid)}">${(p.name[0]||'')}</div><div>${escapeHtml(p.name)}</div></div>`;
  }).join('');

  if(aliveList.some(p=>String(p)===String(mine))){
    const voteRow = document.getElementById('ucVoteRow');
    const myVote = game.votes[mine];
    voteRow.innerHTML = aliveList.filter(p=>String(p)!==String(mine)).map(pid=>{
      const p = getPersonById(pid);
      return `<button type="button" class="uc-vote-btn ${String(myVote)===String(pid)?'active':''}" data-pid="${pid}">${escapeHtml(p.name)}</button>`;
    }).join('');
    voteRow.querySelectorAll('.uc-vote-btn').forEach(b=>{
      b.onclick = async ()=>{

        renderUndercoverGame(target);
      };
    });
  }
}

function maybeResolveUndercoverRound(game){
  if(Object.keys(game.votes).length < game.alive.length) return; // 还没投完
  const tally = {};
  Object.values(game.votes).forEach(pid=>{ tally[pid] = (tally[pid]||0) + 1; });
  let maxVotes = 0, top = [];
  Object.entries(tally).forEach(([pid,ct])=>{
    if(ct>maxVotes){ maxVotes = ct; top = [pid]; }
    else if(ct===maxVotes){ top.push(pid); }
  });
  if(top.length!==1){
    game.lastResult = `本轮平票，大家都安全，进入下一轮。`;
  }else{
    const outId = top[0];
    const outPerson = getPersonById(outId);
    const wasUndercover = game.roles[outId] === 'undercover';
    game.alive = game.alive.filter(p=>String(p)!==String(outId));
    game.lastResult = `${escapeHtml(outPerson.name)} 被投出局了，Ta是${wasUndercover? '卧底 🕵️' : '平民 🙂'}。`;
  }
  game.votes = {};
  game.round += 1;
  if(game.alive.length <= 1){
    game.status = 'ended';
  }
}

/* ---- 游戏本体 ---- */
function renderBirdPlay(target){
  const charName = (state.members[birdChar]||{}).name || '玩家';
  target.innerHTML = `
    <button class="back-link" id="birdBack">← 换个角色</button>
    <div class="bird-stage">
      <canvas id="birdCanvas" width="${BIRD_W}" height="${BIRD_H}"></canvas>
      <div class="bird-overlay" id="birdOverlay">
        <div class="bird-overlay-inner">
          <div class="bird-overlay-title" id="birdOverlayTitle">${escapeHtml(charName)}，准备好了吗？</div>
          <div class="bird-overlay-sub" id="birdOverlaySub">点一下屏幕开始</div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('birdBack').onclick = ()=>{ stopBirdLoop(); birdChar = null; renderBirdGame(target); };

  const canvas = document.getElementById('birdCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('birdOverlay');
  const avatarSrc = CHARACTER_AVATARS[birdChar];
  let avatarImg = null;
  if(avatarSrc){ avatarImg = new Image(); avatarImg.src = avatarSrc; }

  const GRAV = 0.42, FLAP = -7.4, PIPE_W = 62, GAP = 168, SPEED = 2.5;
  let bird, pipes, score, best, running, dead, started, frame;

  function reset(){
    bird = { x:110, y:BIRD_H/2, vy:0, r:22 };
    pipes = [];
    score = 0; frame = 0;
    running = false; dead = false; started = false;
    best = (state.birdScores && state.birdScores[state.identity] && state.birdScores[state.identity].score) || 0;
  }
  reset();

  function spawnPipe(){
    const margin = 70;
    const top = margin + Math.random()*(BIRD_H - GAP - margin*2 - 60);
    pipes.push({ x: BIRD_W, top, passed:false });
  }

  function flap(){
    if(dead){ // 死了之后再点 = 重开
      reset();
      overlay.classList.remove('show');
      running = true; started = true;
      return;
    }
    if(!started){
      started = true; running = true;
      overlay.classList.remove('show');
    }
    bird.vy = FLAP;
  }

  async function gameOver(){
    dead = true; running = false;
    const prev = (state.birdScores[state.identity] && state.birdScores[state.identity].score) || 0;
    const isNewBest = score > prev;
    if(isNewBest){
      state.birdScores[state.identity] = { score, charIdx: birdChar, ts: Date.now() };
      queueSave();
    }
    document.getElementById('birdOverlayTitle').textContent = isNewBest? `新纪录！${score} 分 🎉` : `${score} 分`;
    document.getElementById('birdOverlaySub').textContent = isNewBest? '点一下再来一局' : `你的最高分 ${Math.max(prev,score)} 分 · 点一下再来`;
    overlay.classList.add('show');
  }

  function loop(){
    birdRAF = requestAnimationFrame(loop);
    // 背景
    ctx.fillStyle = '#DCE9F5'; ctx.fillRect(0,0,BIRD_W,BIRD_H);
    ctx.fillStyle = '#C4D6C6'; ctx.fillRect(0,BIRD_H-52,BIRD_W,52);

    if(running){
      frame++;
      bird.vy += GRAV; bird.y += bird.vy;
      if(frame % 92 === 0) spawnPipe();
      pipes.forEach(p=>{ p.x -= SPEED; });
      pipes = pipes.filter(p=> p.x + PIPE_W > -10);
      // 计分
      pipes.forEach(p=>{
        if(!p.passed && p.x + PIPE_W < bird.x){ p.passed = true; score++; }
      });
      // 撞管子 / 落地 / 顶出界
      for(const p of pipes){
        const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
        const inGap = bird.y - bird.r > p.top && bird.y + bird.r < p.top + GAP;
        if(inX && !inGap){ gameOver(); break; }
      }
      if(bird.y + bird.r > BIRD_H-52 || bird.y - bird.r < 0){ gameOver(); }
    }

    // 管子
    pipes.forEach(p=>{
      ctx.fillStyle = '#5C8A6B';
      ctx.fillRect(p.x, 0, PIPE_W, p.top);
      ctx.fillRect(p.x, p.top+GAP, PIPE_W, BIRD_H-52-(p.top+GAP));
      ctx.fillStyle = '#4C7A5E';
      ctx.fillRect(p.x-4, p.top-18, PIPE_W+8, 18);
      ctx.fillRect(p.x-4, p.top+GAP, PIPE_W+8, 18);
    });

    // 角色
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(Math.max(-0.5, Math.min(1.1, bird.vy/14)));
    if(avatarImg && avatarImg.complete && avatarImg.naturalWidth){
      ctx.save();
      ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.clip();
      ctx.drawImage(avatarImg, -bird.r, -bird.r, bird.r*2, bird.r*2);
      ctx.restore();
    }else{
      ctx.fillStyle = getPersonColor(birdChar);
      ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle = '#223328'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.stroke();
    ctx.restore();

    // 分数
    ctx.fillStyle = '#223328';
    ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(String(score), BIRD_W/2, 66);
    if(best>0){
      ctx.font = '13px sans-serif'; ctx.fillStyle = 'rgba(34,51,40,.55)';
      ctx.fillText(`最高 ${best}`, BIRD_W/2, 90);
    }
  }

  overlay.classList.add('show');
  canvas.addEventListener('pointerdown', ev=>{ ev.preventDefault(); flap(); });
  overlay.addEventListener('pointerdown', ev=>{ ev.preventDefault(); flap(); });
  birdKeyHandler = (ev)=>{ if(ev.code==='Space' || ev.key===' '){ ev.preventDefault(); flap(); } };
  window.addEventListener('keydown', birdKeyHandler);
  loop();
}

function stopBirdLoop(){
  if(birdRAF){ cancelAnimationFrame(birdRAF); birdRAF = null; }
  if(birdKeyHandler){ window.removeEventListener('keydown', birdKeyHandler); birdKeyHandler = null; }
}

function startShooterGame(game){
  // 生成本局的障碍物，存进共享数据，保证所有人看到的地图一模一样
  const obstacles = [];
  for(let i=0;i<14;i++){

    obstacles.push({ x:x-size/2, y:y-size/2, w:size, h:size });
  }
  game.status = 'playing';
  game.hostId = state.identity;
  game.startedAt = Date.now();
  game.obstacles = obstacles;
  game.lastResult = null;
  game.boss = { name:'毛兽', hp:60, maxHp:60, x:SHOOTER_W/2, y:SHOOTER_H/2, alive:true, respawnAt:0 };
}

const SHOOTER_BOSS_RESPAWN_MS = 30000; // 毛兽被打死后，30秒再刷新一次
const SHOOTER_GATLING_DURATION = 30000; // 加特林奖励持续30秒
let shooterGatlingUntil = 0;
let shooterBackGuardActive = false;
let shooterAutoFireTimer = null;

/* ---- 简单可复现的伪随机（同一个 tick 大家算出来的结果一致，不用联网同步）---- */
function seededRandom(seed){
  const x = Math.sin(seed)*10000;
  return x - Math.floor(x);
}
function getActivePickups(game){
  const elapsed = Date.now() - (game.startedAt||Date.now());
  const cycle = 10000; // 刷新周期从15秒缩短到10秒，因为现在是自动连续开火，弹药消耗快很多
  const tick = Math.floor(elapsed/cycle);
  return SHOOTER_SPAWN_POINTS.map((pt, idx)=>{
    const seed = tick*7 + idx*13 + 1;
    const show = seededRandom(seed) < 0.85; // 出现概率也调高，弹药包更容易刷出来
    if(!show) return null;
    const type = seededRandom(seed+3) < 0.75 ? 'ammo' : 'health'; // 弹药包的比例明显调高
    return { x:pt.x, y:pt.y, type, key: idx+'_'+tick };
  }).filter(Boolean);
}
