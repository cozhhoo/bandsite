/* ---------------- 夸夸墙：给队友写一句具体的夸奖 ---------------- */
function renderPraiseWall(body){
  const mine = state.identity;
  const list = [...(state.praises||[])].sort((a,b)=>b.ts-a.ts);
  const others = allPeople().filter(p=>String(p.id)!==String(mine));
  // 统计每个人收到多少夸奖
  const counts = {};
  (state.praises||[]).forEach(p=>{ counts[p.toId] = (counts[p.toId]||0)+1; });
  const ranking = allPeople().map(p=>({...p, count: counts[p.id]||0}))
    .filter(p=>p.count>0).sort((a,b)=>b.count-a.count).slice(0,3);

  body.innerHTML = `
    <div class="banner">🌟 给队友写一句具体的夸奖吧——越具体越好，比如"今天那段solo炸了"比"你很棒"有力量得多。</div>
    ${ranking.length? `<div class="praise-podium">${ranking.map((p,i)=>`
      <div class="praise-podium-item">
        <div class="praise-podium-medal">${['🥇','🥈','🥉'][i]}</div>
        <div class="praise-podium-name">${escapeHtml(p.name)}</div>
        <div class="praise-podium-count">收到 ${p.count} 条</div>
      </div>`).join('')}</div>` : ''}
    <div class="composer">
      <div class="cfg-field"><label>想夸谁</label>
        <select id="praiseTo">
          ${others.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
        </select>
      </div>
      <textarea id="praiseText" placeholder="具体夸一句…（比如：今天排练你那段鼓点稳得离谱）" style="margin-top:10px;"></textarea>
      <div class="composer-row" style="justify-content:flex-end;">
        <button class="btn btn-primary" id="praiseSend" style="width:auto;padding:8px 20px;">送出夸奖</button>
      </div>
    </div>
    <div id="praiseList"></div>
  `;
  if(others.length===0){
    document.getElementById('praiseSend').disabled = true;
  }
  document.getElementById('praiseSend').onclick = async ()=>{
    const toId = document.getElementById('praiseTo').value;
    const text = document.getElementById('praiseText').value.trim();
    if(!text){ alert('写一句具体的夸奖吧'); return; }
    state.praises = state.praises || [];
    const realToId = isNaN(Number(toId)) ? toId : Number(toId);
    state.praises.unshift({ id:'pr_'+Date.now(), toId: realToId, fromId: mine, text, ts: Date.now(), likes:[] });
    addNotif(realToId, 'praise', mine, null, text.slice(0,30));
    await queueSave();
    renderPraiseWall(body);
    renderNotifBell();
  };

  const praiseList = document.getElementById('praiseList');
  if(list.length===0){ praiseList.innerHTML = `<div class="empty-hint">还没有人夸过队友，来当第一个吧</div>`; return; }
  praiseList.innerHTML = list.map(p=>{
    const from = getPersonById(p.fromId), to = getPersonById(p.toId);
    const liked = (p.likes||[]).some(x=>String(x)===String(mine));
    const canDel = String(p.fromId)===String(mine) || isAdmin();
    return `<div class="praise-card">
      <div class="praise-head">
        <span class="praise-from">${escapeHtml(from.name)}</span>
        <span class="praise-arrow">夸了</span>
        <span class="praise-to">${escapeHtml(to.name)}</span>
        <span class="praise-time">${fmtTime(p.ts)}</span>
      </div>
      <div class="praise-text">${escapeHtml(p.text)}</div>
      <div class="praise-actions">
        <button type="button" class="praise-like ${liked?'liked':''}" data-id="${p.id}">${liked?'👏':'👏'} ${(p.likes||[]).length||''} 附议</button>
        ${canDel? `<button type="button" class="praise-del" data-id="${p.id}">删除</button>`:''}
      </div>
    </div>`;
  }).join('');
  praiseList.querySelectorAll('.praise-like').forEach(b=>{
    b.onclick = async ()=>{
      const p = state.praises.find(x=>x.id===b.dataset.id);
      if(!p) return;
      p.likes = p.likes || [];
      const i = p.likes.findIndex(x=>String(x)===String(mine));
      if(i>=0) p.likes.splice(i,1); else p.likes.push(mine);
      await queueSave();
      renderPraiseWall(body);
    };
  });
  praiseList.querySelectorAll('.praise-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('删除这条夸奖吗？')) return;
      state.praises = state.praises.filter(x=>x.id!==b.dataset.id);
      await queueSave();
      renderPraiseWall(body);
    };
  });
}

/* ---------------- 演出通告：只有杉菜能添加/管理，其他人可以看+报到场情况 ---------------- */
const GIG_STATUS = { pending:'洽谈中', confirmed:'已确认', done:'已完成', cancelled:'已取消' };

function renderGigBoard(body){
  const canEdit = canManageGigs();
  const mine = state.identity;
  const list = [...(state.gigs||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const upcoming = list.filter(g=>g.status!=='done' && g.status!=='cancelled');
  const past = list.filter(g=>g.status==='done' || g.status==='cancelled');

  function gigCard(g){
    const att = g.attendance || {};
    const yes = state.members.filter((m,i)=>att[i]==='yes');
    const no = state.members.filter((m,i)=>att[i]==='no');
    const myAtt = att[mine];
    const canRSVP = !isGuestIdentity(mine) && g.status!=='done' && g.status!=='cancelled';
    return `<div class="gig-card gig-${g.status}">
      <div class="gig-head">
        <span class="gig-status gig-status-${g.status}">${GIG_STATUS[g.status]||g.status}</span>
        <span class="gig-title">${escapeHtml(g.title)}</span>
        ${canEdit? `<button type="button" class="gig-del" data-id="${g.id}">删除</button>`:''}
      </div>
      <div class="gig-meta">
        <span>📅 ${g.date}${g.time? ' '+g.time:''}</span>
        ${g.venue? `<span>📍 ${escapeHtml(g.venue)}</span>`:''}
        ${g.fee? `<span>💰 ${escapeHtml(String(g.fee))}</span>`:''}
        ${g.contact? `<span>☎️ ${escapeHtml(g.contact)}</span>`:''}
      </div>
      ${g.note? `<div class="gig-note">${escapeHtml(g.note)}</div>`:''}
      <div class="gig-attend">
        <span class="gig-attend-label">到场：</span>
        <span class="gig-attend-yes">✅ ${yes.length? yes.map(m=>escapeHtml(m.name)).join('、') : '暂无'}</span>
        ${no.length? `<span class="gig-attend-no">❌ ${no.map(m=>escapeHtml(m.name)).join('、')}</span>`:''}
      </div>
      ${canRSVP? `<div class="gig-rsvp">
        <button type="button" class="gig-rsvp-btn ${myAtt==='yes'?'active':''}" data-id="${g.id}" data-v="yes">我能到</button>
        <button type="button" class="gig-rsvp-btn ${myAtt==='no'?'active':''}" data-id="${g.id}" data-v="no">我去不了</button>
      </div>`:''}
      ${canEdit? `<div class="gig-status-row">
        ${Object.entries(GIG_STATUS).map(([k,v])=>`<button type="button" class="gig-set-status ${g.status===k?'active':''}" data-id="${g.id}" data-s="${k}">${v}</button>`).join('')}
      </div>`:''}
    </div>`;
  }

  body.innerHTML = `
    ${canEdit? `
      <div class="composer">
        <div class="ledger-form">
          <div class="cfg-field"><label>演出名称</label><input type="text" id="ggTitle" placeholder="比如：校庆晚会"></div>
          <div class="cfg-field"><label>日期</label><input type="date" id="ggDate"></div>
          <div class="cfg-field"><label>时间</label><input type="time" id="ggTime" value="19:00"></div>
          <div class="cfg-field"><label>报酬</label><input type="text" id="ggFee" placeholder="比如：2000元 / 无"></div>
        </div>
        <div class="ledger-form" style="margin-top:10px;">
          <div class="cfg-field" style="grid-column:span 2;"><label>地点</label><input type="text" id="ggVenue" placeholder="演出场地"></div>
          <div class="cfg-field" style="grid-column:span 2;"><label>对接人/联系方式</label><input type="text" id="ggContact" placeholder="主办方联系人"></div>
        </div>
        <div class="cfg-field" style="margin-top:10px;"><label>备注</label><input type="text" id="ggNote" placeholder="曲目要求、几点到场、需不需要自带设备…"></div>
        <div class="composer-row" style="justify-content:flex-end;">
          <button class="btn btn-primary" id="ggAdd" style="width:auto;padding:8px 20px;">添加通告</button>
        </div>
      </div>
    ` : `<div class="banner">🎤 演出通告由杉菜统一对接和管理，大家可以查看详情，并点"我能到 / 我去不了"报一下自己的情况。</div>`}
    <div class="section-head"><h2>即将到来</h2></div>
    <div id="gigUpcoming">${upcoming.length? upcoming.map(gigCard).join('') : '<div class="empty-hint">暂时没有待办的演出通告</div>'}</div>
    ${past.length? `<div class="section-head"><h2>已结束</h2></div><div id="gigPast">${past.map(gigCard).join('')}</div>` : ''}
  `;

  if(canEdit){
    const d = new Date();
    document.getElementById('ggDate').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    document.getElementById('ggAdd').onclick = async ()=>{
      const title = document.getElementById('ggTitle').value.trim();
      const date = document.getElementById('ggDate').value;
      if(!title || !date){ alert('演出名称和日期不能为空'); return; }
      state.gigs = state.gigs || [];
      state.gigs.push({
        id:'gg_'+Date.now(), title, date,
        time: document.getElementById('ggTime').value,
        venue: document.getElementById('ggVenue').value.trim(),
        fee: document.getElementById('ggFee').value.trim(),
        contact: document.getElementById('ggContact').value.trim(),
        note: document.getElementById('ggNote').value.trim(),
        status:'pending', attendance:{}, ts: Date.now()
      });
      allPeople().forEach(p=>{ addNotif(p.id, 'new_gig', mine, null, title.slice(0,20)); });
      await queueSave();
      renderGigBoard(body);
      renderNotifBell();
    };
  }
  body.querySelectorAll('.gig-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('删除这条演出通告吗？')) return;
      state.gigs = state.gigs.filter(x=>x.id!==b.dataset.id);
      await queueSave();
      renderGigBoard(body);
    };
  });
  body.querySelectorAll('.gig-rsvp-btn').forEach(b=>{
    b.onclick = async ()=>{
      const g = state.gigs.find(x=>x.id===b.dataset.id);
      if(!g) return;
      g.attendance = g.attendance || {};
      if(g.attendance[mine]===b.dataset.v) delete g.attendance[mine];
      else g.attendance[mine] = b.dataset.v;
      await queueSave();
      renderGigBoard(body);
    };
  });
  body.querySelectorAll('.gig-set-status').forEach(b=>{
    b.onclick = async ()=>{
      const g = state.gigs.find(x=>x.id===b.dataset.id);
      if(!g) return;
      g.status = b.dataset.s;
      await queueSave();
      renderGigBoard(body);
    };
  });
}

/* ---------------- 乐队小账本：只有坤坤能记账，其他人只能看 ---------------- */
const LEDGER_CATEGORIES = ['演出费','器材','交通','录音棚','宣传','餐饮','其他'];

function renderLedger(body){
  const canEdit = canManageLedger();
  const list = [...(state.ledger||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||'') || b.ts-a.ts);
  const income = list.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0);
  const expense = list.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0);
  const balance = income - expense;
  const perHead = state.members.length ? balance/state.members.length : 0;
  const fmtMoney = (n)=> (Math.round(n*100)/100).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});

  body.innerHTML = `
    <div class="ledger-summary">
      <div class="ledger-stat"><div class="ledger-stat-label">总收入</div><div class="ledger-stat-num income">+${fmtMoney(income)}</div></div>
      <div class="ledger-stat"><div class="ledger-stat-label">总支出</div><div class="ledger-stat-num expense">−${fmtMoney(expense)}</div></div>
      <div class="ledger-stat"><div class="ledger-stat-label">结余</div><div class="ledger-stat-num ${balance>=0?'income':'expense'}">${fmtMoney(balance)}</div></div>
      <div class="ledger-stat"><div class="ledger-stat-label">${state.members.length}人均分</div><div class="ledger-stat-num">${fmtMoney(perHead)}</div></div>
    </div>
    ${canEdit? `
      <div class="composer">
        <div class="ledger-form">
          <div class="cfg-field"><label>类型</label>
            <select id="lgType"><option value="income">收入</option><option value="expense">支出</option></select>
          </div>
          <div class="cfg-field"><label>金额</label><input type="number" id="lgAmount" placeholder="0.00" step="0.01" min="0"></div>
          <div class="cfg-field"><label>日期</label><input type="date" id="lgDate"></div>
          <div class="cfg-field"><label>分类</label>
            <select id="lgCategory">${LEDGER_CATEGORIES.map(x=>`<option value="${x}">${x}</option>`).join('')}</select>
          </div>
        </div>
        <div class="cfg-field" style="margin-top:10px;"><label>说明</label><input type="text" id="lgNote" placeholder="比如：校庆演出报酬 / 换了一套鼓皮"></div>
        <div class="composer-row" style="justify-content:flex-end;">
          <button class="btn btn-primary" id="lgAdd" style="width:auto;padding:8px 20px;">记一笔</button>
        </div>
      </div>
    ` : `<div class="banner">💰 账本由坤坤统一管理，其他人可以查看每一笔明细，但不能增删改。</div>`}
    <div id="ledgerList"></div>
  `;

  if(canEdit){
    const d = new Date();
    document.getElementById('lgDate').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    document.getElementById('lgAdd').onclick = async ()=>{
      const amount = Number(document.getElementById('lgAmount').value);
      const date = document.getElementById('lgDate').value;
      const note = document.getElementById('lgNote').value.trim();
      if(!amount || amount<=0){ alert('填一个大于0的金额'); return; }
      if(!date){ alert('选一下日期'); return; }
      state.ledger = state.ledger || [];
      state.ledger.unshift({
        id:'lg_'+Date.now(),
        type: document.getElementById('lgType').value,
        amount, date, note,
        category: document.getElementById('lgCategory').value,
        byId: state.identity, ts: Date.now()
      });
      await queueSave();
      renderLedger(body);
    };
  }

  const ledgerList = document.getElementById('ledgerList');
  if(list.length===0){ ledgerList.innerHTML = `<div class="empty-hint">还没有任何记录</div>`; return; }
  ledgerList.innerHTML = list.map(x=>`
    <div class="ledger-row">
      <div class="ledger-row-main">
        <div class="ledger-row-note">${escapeHtml(x.note||x.category||'（无说明）')}</div>
        <div class="ledger-row-meta">${x.date} · ${escapeHtml(x.category||'')}</div>
      </div>
      <div class="ledger-row-amount ${x.type==='income'?'income':'expense'}">${x.type==='income'?'+':'−'}${fmtMoney(Number(x.amount||0))}</div>
      ${canEdit? `<button type="button" class="ledger-del" data-id="${x.id}">删除</button>`:''}
    </div>
  `).join('');
  ledgerList.querySelectorAll('.ledger-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('删除这一笔记录吗？')) return;
      state.ledger = state.ledger.filter(x=>x.id!==b.dataset.id);
      await queueSave();
      renderLedger(body);
    };
  });
}

/* ---------------- 限时活动：征集团体名字 ---------------- */
function renderNameContest(body){
  const list = [...(state.nameProposals||[])].sort((a,b)=>{
    const scoreA = (a.reactions.like||[]).length - (a.reactions.meh||[]).length;
    const scoreB = (b.reactions.like||[]).length - (b.reactions.meh||[]).length;
    return scoreB - scoreA || b.ts - a.ts;
  });
  body.innerHTML = `
    <div class="banner" style="margin-bottom:16px;">🎤 限时活动：给我们的乐队征集一个新团体名字！随便提名字、说理由，大家可以点"喜欢／考虑一下／觉得一般"来投票。</div>
    <div class="composer">
      <input type="text" id="npName" placeholder="提议的名字" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);margin-bottom:8px;">
      <textarea id="npReason" placeholder="为什么想叫这个名字？" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);min-height:64px;"></textarea>
      <div class="composer-row" style="justify-content:flex-end;margin-top:8px;">
        <button class="btn btn-primary" id="npAdd" style="width:auto;padding:8px 20px;">提交提议</button>
      </div>
    </div>
    <div id="npList"></div>
  `;
  document.getElementById('npAdd').onclick = async ()=>{
    const name = document.getElementById('npName').value.trim();
    const reason = document.getElementById('npReason').value.trim();
    if(!name){ alert('至少写个名字吧'); return; }
    state.nameProposals = state.nameProposals || [];
    state.nameProposals.push({ id:'np_'+Date.now(), name, reason, authorIdx: state.identity, ts: Date.now(), reactions:{like:[],consider:[],meh:[]} });
    await queueSave();
    renderNameContest(body);
  };
  const npList = document.getElementById('npList');
  if(list.length===0){ npList.innerHTML = `<div class="empty-hint">还没有人提议名字，第一个来吧</div>`; return; }
  npList.innerHTML = list.map(np=>{
    const author = getPersonById(np.authorIdx);
    const myReaction = ['like','consider','meh'].find(k=> (np.reactions[k]||[]).includes(state.identity)) || null;
    return `<div class="post-card">
      <div class="post-head">
        <div class="post-avatar">${(author.name||'')[0]||''}</div>
        <div>
          <div class="post-author">${escapeHtml(author.name)}</div>
          <div class="post-time">${fmtTime(np.ts)}</div>
        </div>
      </div>
      <div class="post-author" style="font-size:18px;">${escapeHtml(np.name)}</div>
      ${np.reason? `<div class="post-text" style="margin-top:4px;">${escapeHtml(np.reason)}</div>` : ''}
      <div class="np-reactions">
        <button type="button" class="np-react ${myReaction==='like'?'active':''}" data-np="${np.id}" data-r="like">👍 喜欢 (${(np.reactions.like||[]).length})</button>
        <button type="button" class="np-react ${myReaction==='consider'?'active':''}" data-np="${np.id}" data-r="consider">🤔 考虑一下 (${(np.reactions.consider||[]).length})</button>
        <button type="button" class="np-react ${myReaction==='meh'?'active':''}" data-np="${np.id}" data-r="meh">😐 觉得一般 (${(np.reactions.meh||[]).length})</button>
      </div>
    </div>`;
  }).join('');
  npList.querySelectorAll('.np-react').forEach(btn=>{
    btn.onclick = async ()=>{
      const np = state.nameProposals.find(x=>x.id===btn.dataset.np);
      if(!np) return;
      const r = btn.dataset.r;
      ['like','consider','meh'].forEach(k=>{
        np.reactions[k] = (np.reactions[k]||[]).filter(id=>String(id)!==String(state.identity));
      });
      const already = btn.classList.contains('active');
      if(!already){ np.reactions[r] = np.reactions[r]||[]; np.reactions[r].push(state.identity); }
      await queueSave();
      renderNameContest(body);
    };
  });
}

function renderComposer(){
  const c = document.getElementById('composer');
  c.innerHTML = `
    <textarea id="postText" placeholder="分享点什么……今天排练怎么样？"></textarea>
    <div class="composer-row">
      <label class="btn btn-ghost" style="cursor:pointer;">选择照片<input type="file" accept="image/*" id="postPhoto" style="display:none;"></label>
      <span id="photoFileName" style="font-size:12px;color:var(--ink-soft);"></span>
    </div>
    <img id="photoPreview" class="photo-preview" style="display:none;">
    <div class="composer-row">
      <select id="shareType">
        <option value="">不分享电影/音乐</option>
        <option value="movie">分享一部电影</option>
        <option value="music">分享一首音乐</option>
      </select>
    </div>
    <div class="share-fields" id="shareFields" style="display:none;">
      <input type="text" id="shareName" placeholder="名称">
      <input type="text" id="shareLink" placeholder="链接（选填）">
    </div>
    <div class="composer-row" style="justify-content:flex-end;">
      <button class="btn btn-primary" id="postBtn" style="width:auto;padding:8px 20px;">发布</button>
    </div>
  `;
  let pendingPhoto = null;
  document.getElementById('postPhoto').addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    document.getElementById('photoFileName').textContent = file.name;
    try{
      pendingPhoto = await fileToResizedDataURL(file);
      const prev = document.getElementById('photoPreview');
      prev.src = pendingPhoto; prev.style.display = 'block';
    }catch(err){ alert('图片处理失败：' + err.message); }
  });
  document.getElementById('shareType').addEventListener('change', (ev)=>{
    document.getElementById('shareFields').style.display = ev.target.value? 'flex' : 'none';
  });
  document.getElementById('postBtn').onclick = async ()=>{
    const text = document.getElementById('postText').value.trim();
    const shareType = document.getElementById('shareType').value;
    const shareName = document.getElementById('shareName').value.trim();
    const shareLink = document.getElementById('shareLink').value.trim();
    if(!text && !pendingPhoto && !shareType){ alert('写点文字、传张照片，或分享一个电影/音乐再发布吧'); return; }
    if(shareType && !shareName){ alert('分享电影/音乐的话，名称不能为空'); return; }
    const post = {
      id: 'p_'+Date.now(),
      authorIdx: state.identity,
      text,
      photo: pendingPhoto,
      share: shareType? { type: shareType, name: shareName, link: shareLink } : null,
      likes: [],
      comments: [],
      ts: Date.now()
    };
    state.posts = state.posts || [];
    state.posts.unshift(post);
    // 给除了发帖人以外的所有人发一条"有新帖子"的提醒
    allPeople().forEach(p=>{ addNotif(p.id, 'new_post', state.identity, post.id); });
    await queueSave();
    renderComposer();
    renderPostList();
    renderNotifBell();
  };
}

function renderPostList(){
  const list = document.getElementById('postList');
  const posts = (state.posts||[]).slice().sort((a,b)=>b.ts-a.ts);
  if(posts.length===0){ list.innerHTML = `<div class="empty-hint">还没有人发帖，来发第一条吧</div>`; return; }
  list.innerHTML = posts.map(p=>renderPostCard(p)).join('');
  list.querySelectorAll('.post-like').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.id;
      const post = state.posts.find(x=>x.id===id);
      if(!post) return;
      post.likes = post.likes || [];
      const idx = post.likes.indexOf(state.identity);
      if(idx>=0){
        post.likes.splice(idx,1);
      }else{
        post.likes.push(state.identity);
        addNotif(post.authorIdx, 'like', state.identity, post.id);
      }
      await queueSave();
      renderPostList();
    };
  });
  list.querySelectorAll('.post-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('确定删除这条内容吗？')) return;
      state.posts = state.posts.filter(x=>x.id!==b.dataset.id);
      await queueSave();
      renderPostList();
    };
  });
  list.querySelectorAll('.comment-add').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.id;
      const input = list.querySelector(`.comment-input input[data-id="${id}"]`);
      const text = input.value.trim();
      if(!text) return;
      const post = state.posts.find(x=>x.id===id);
      post.comments = post.comments || [];
      post.comments.push({ id:'cm_'+Date.now()+Math.random().toString(36).slice(2,5), authorIdx: state.identity, text, ts: Date.now() });
      addNotif(post.authorIdx, 'comment', state.identity, post.id, text.slice(0,30));
      const replyTarget = input.dataset.replyTarget;
      if(replyTarget!==undefined && replyTarget!=='' && String(replyTarget)!==String(post.authorIdx)){
        addNotif(replyTarget, 'reply', state.identity, post.id, text.slice(0,30));
      }
      await queueSave();
      renderPostList();
    };
  });
  list.querySelectorAll('.comment-reply-btn').forEach(b=>{
    b.onclick = ()=>{
      const input = list.querySelector(`.comment-input input[data-id="${b.dataset.post}"]`);
      if(!input) return;
      input.value = `回复${b.dataset.name}：`;
      input.dataset.replyTarget = b.dataset.target;
      input.focus();
    };
  });
  list.querySelectorAll('.comment-del-btn').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('删除这条评论吗？')) return;
      const post = state.posts.find(x=>x.id===b.dataset.post);
      if(!post) return;
      post.comments.splice(+b.dataset.ci, 1);
      await queueSave();
      renderPostList();
    };
  });
}

    </div>

function getBoard(personId){
  state.boards = state.boards || {};
  if(!state.boards[personId]) state.boards[personId] = { elements: [] };
  return state.boards[personId];
}
function nextZ(board){
  return board.elements.reduce((mx,e)=>Math.max(mx, e.z||0), 0) + 1;
}

function renderBoardSection(container, personId, editable){
  const board = getBoard(personId);
  let selectedId = null;
  let doodleMode = false;
  let doodleColor = '#223328';
  let doodleSize = 5;

  function elHtml(el){
    const style = `left:${el.x}%;top:${el.y}%;transform:translate(-50%,-50%) rotate(${el.rot||0}deg) scale(${el.scale||1});z-index:${el.z||1};`;
    let inner;
    if(el.type==='text'){ inner = `<div class="el-text" style="color:${el.color||'#223328'};font-size:${el.fontSize||16}px;">${escapeHtml(el.text||'')}</div>`; }
    else if(el.type==='sticker'){ inner = `<div class="el-sticker" style="font-size:${el.fontSize||44}px;">${el.text||''}</div>`; }
    else{ inner = `<img src="${el.src}" draggable="false">`; }
    return `<div class="board-el ${selectedId===el.id?'selected':''}" data-id="${el.id}" style="${style}">${inner}</div>`;
  }

  function paint(){
    const sorted = [...board.elements].sort((a,b)=>(a.z||0)-(b.z||0));
    container.innerHTML = `
      <div class="board-frame ${editable?'':'readonly'}" id="boardFrame">${board.doodle? `<img class="board-doodle-layer" src="${board.doodle}">` : ''}${sorted.map(elHtml).join('')}</div>
      ${editable && !doodleMode ? `
        <div class="board-toolbar">
          <label class="btn btn-ghost" style="cursor:pointer;">+ 图片<input type="file" accept="image/*" id="boardImgInput" style="display:none;"></label>
          <button class="btn btn-ghost" type="button" id="boardStickerBtn">+ 贴纸</button>
          <button class="btn btn-ghost" type="button" id="boardTextBtn">+ 文字</button>
          <button class="btn btn-ghost" type="button" id="boardDoodleBtn">✏️ 涂鸦</button>
          <span style="font-size:11.5px;color:var(--ink-soft);margin-left:auto;">拖拽移动 · 点一下选中可旋转/缩放/删除</span>
        </div>` : ''}
    `;
    const frame = document.getElementById('boardFrame');
    if(!frame) return;

    if(editable && doodleMode){ setupDoodle(frame); return; }

    if(editable){
      const imgInput = document.getElementById('boardImgInput');
      if(imgInput) imgInput.addEventListener('change', async ev=>{
        const file = ev.target.files[0]; if(!file) return;
        try{
          const src = await fileToResizedDataURL(file, 480, 0.72);
          board.elements.push({ id:'el_'+Date.now(), type:'image', src, x:50, y:50, rot:0, scale:1, z: nextZ(board) });
          await queueSave();
          paint();
        }catch(err){ alert('图片处理失败：' + err.message); }
      });
      const stB = document.getElementById('boardStickerBtn'); if(stB) stB.onclick = openStickerPicker;
      const txB = document.getElementById('boardTextBtn'); if(txB) txB.onclick = openTextAdder;
      const doB = document.getElementById('boardDoodleBtn'); if(doB) doB.onclick = ()=>{ doodleMode = true; paint(); };
    }

    frame.querySelectorAll('.board-el').forEach(node=>{
      if(!editable) return;
      const id = node.dataset.id;
      const el = board.elements.find(e=>e.id===id);
      if(!el) return;
      let dragging=false, moved=false, startX=0, startY=0, rect=null;
      node.addEventListener('pointerdown', ev=>{
        ev.preventDefault();
        dragging = true; moved = false;
        startX = ev.clientX; startY = ev.clientY;
        rect = frame.getBoundingClientRect();
        try{ node.setPointerCapture(ev.pointerId); }catch(e){}
        node.classList.add('dragging');
      });
      node.addEventListener('pointermove', ev=>{
        if(!dragging) return;
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(Math.abs(dx)>3 || Math.abs(dy)>3) moved = true;
        if(moved){
          let nx = el.x + (dx/rect.width)*100;
          let ny = el.y + (dy/rect.height)*100;
          nx = Math.max(4, Math.min(96, nx));
          ny = Math.max(4, Math.min(96, ny));
          node.style.left = nx+'%'; node.style.top = ny+'%';
          node._pendingX = nx; node._pendingY = ny;
        }
      });
      node.addEventListener('pointerup', async ()=>{
        dragging = false;
        node.classList.remove('dragging');
        if(moved && node._pendingX!==undefined){
          el.x = node._pendingX; el.y = node._pendingY;
          await queueSave();
          paint();
        }else if(!moved){
          selectedId = (selectedId===id ? null : id);
          paint();
        }
      });
    });

    if(editable && selectedId){
      const el = board.elements.find(e=>e.id===selectedId);
      if(el){
        const tb = document.createElement('div');
        tb.className = 'el-toolbar';
        tb.style.left = el.x+'%';
        tb.style.top = `calc(${el.y}% - 10%)`;
        tb.style.transform = 'translate(-50%,-100%)';
        tb.innerHTML = `
          <button type="button" data-a="rl" title="逆时针旋转">↺</button>
          <button type="button" data-a="rr" title="顺时针旋转">↻</button>
          <button type="button" data-a="sd" title="缩小">－</button>
          <button type="button" data-a="su" title="放大">＋</button>
          <button type="button" data-a="del" title="删除">🗑</button>
        `;
        frame.appendChild(tb);
        tb.querySelector('[data-a="rl"]').onclick = async ()=>{ el.rot=(el.rot||0)-15; await queueSave(); paint(); };
        tb.querySelector('[data-a="rr"]').onclick = async ()=>{ el.rot=(el.rot||0)+15; await queueSave(); paint(); };
        tb.querySelector('[data-a="sd"]').onclick = async ()=>{ el.scale=Math.max(0.3,(el.scale||1)-0.1); await queueSave(); paint(); };
        tb.querySelector('[data-a="su"]').onclick = async ()=>{ el.scale=Math.min(2.5,(el.scale||1)+0.1); await queueSave(); paint(); };
        tb.querySelector('[data-a="del"]').onclick = async ()=>{ board.elements = board.elements.filter(e=>e.id!==selectedId); selectedId=null; await queueSave(); paint(); };
      }
    }
  }

  function openStickerPicker(){
    const overlay = document.getElementById('overlay');
    const panel = document.getElementById('panel');
    const stickers = ['🎸','🥁','🎤','🎹','🎻','🪕','🌿','🎵','❤️','⭐️','🌈','✨','☕️','📷','🎬','🐾'];
    panel.innerHTML = `<h2>选一个贴纸</h2><div class="sticker-palette">${stickers.map(s=>`<button type="button" data-s="${s}">${s}</button>`).join('')}</div><div class="panel-actions"><button class="btn btn-ghost" id="cancelBtn" style="flex:1;">取消</button></div>`;
    overlay.classList.add('show');
    document.getElementById('cancelBtn').onclick = closePanel;
    panel.querySelectorAll('.sticker-palette button').forEach(b=>{
      b.onclick = async ()=>{
        board.elements.push({ id:'el_'+Date.now(), type:'sticker', text:b.dataset.s, x:50, y:50, rot:0, scale:1, fontSize:44, z: nextZ(board) });
        await queueSave();
        closePanel();
        paint();
      };
    });
  }

  function openTextAdder(){
    const overlay = document.getElementById('overlay');
    const panel = document.getElementById('panel');
    const colors = ['#223328','#B4553F','#E2A33D','#6E85A6','#9B7BA6','#ffffff'];
    panel.innerHTML = `<h2>添加文字</h2>
      <div class="cfg-field"><input id="boardTextInput" placeholder="写点什么…" maxlength="40"></div>
      <div class="text-add-row">${colors.map((c,ix)=>`<button type="button" class="color-dot ${ix===0?'active':''}" data-c="${c}" style="background:${c};border:1px solid #ccc;"></button>`).join('')}</div>
      <div class="panel-actions"><button class="btn btn-ghost" id="cancelBtn">取消</button><button class="btn btn-primary" id="addTextBtn">添加</button></div>`;
    overlay.classList.add('show');
    let chosenColor = colors[0];
    panel.querySelectorAll('.color-dot').forEach(d=>{
      d.onclick = ()=>{ chosenColor = d.dataset.c; panel.querySelectorAll('.color-dot').forEach(x=>x.classList.toggle('active', x===d)); };
    });
    document.getElementById('cancelBtn').onclick = closePanel;
    document.getElementById('addTextBtn').onclick = async ()=>{
      const text = document.getElementById('boardTextInput').value.trim();
      if(!text) return;
      board.elements.push({ id:'el_'+Date.now(), type:'text', text, color: chosenColor, x:50, y:50, rot:0, scale:1, fontSize:16, z: nextZ(board) });
      await queueSave();
      closePanel();
      paint();
    };
  }

  function setupDoodle(frame){
    const canvas = document.createElement('canvas');
    canvas.className = 'doodle-canvas';
    const rect = frame.getBoundingClientRect();
    canvas.width = rect.width; canvas.height = rect.height;
    frame.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    // 先把板子上已有的涂鸦画上去，这样是接着画，不是从空白开始
    if(board.doodle){
      const img = new Image();
      img.onload = ()=>{ ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
      img.src = board.doodle;
    }
    let drawing = false, lastX = 0, lastY = 0;
    canvas.addEventListener('pointerdown', ev=>{
      drawing = true;
      const r = canvas.getBoundingClientRect();
      lastX = ev.clientX - r.left; lastY = ev.clientY - r.top;
      try{ canvas.setPointerCapture(ev.pointerId); }catch(e){}
    });
    canvas.addEventListener('pointermove', ev=>{
      if(!drawing) return;
      const r = canvas.getBoundingClientRect();
      const x = ev.clientX - r.left, y = ev.clientY - r.top;
      ctx.strokeStyle = doodleColor; ctx.lineWidth = doodleSize; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
      lastX = x; lastY = y;
    });
    canvas.addEventListener('pointerup', ()=>{ drawing = false; });

    const toolbar = document.createElement('div');
    toolbar.className = 'doodle-toolbar';
    const palette = ['#223328','#B4553F','#E2A33D','#6E85A6','#ffffff'];
    toolbar.innerHTML = `
      ${palette.map(c=>`<button type="button" class="color-dot ${c===doodleColor?'active':''}" data-c="${c}" style="background:${c};"></button>`).join('')}
      <span style="color:#fff;font-size:11px;">粗细</span>
      <input type="range" min="2" max="18" value="${doodleSize}" id="doodleSizeInput" style="width:70px;">
      <button class="btn btn-ghost" type="button" id="doodleClearBtn">清空</button>
      <button class="btn btn-ghost" type="button" id="doodleCancelBtn">取消</button>
      <button class="btn btn-primary" type="button" id="doodleDoneBtn">完成</button>
    `;
    frame.appendChild(toolbar);
    toolbar.querySelectorAll('.color-dot').forEach(d=>{
      d.onclick = ()=>{ doodleColor = d.dataset.c; toolbar.querySelectorAll('.color-dot').forEach(x=>x.classList.toggle('active', x===d)); };
    });
    toolbar.querySelector('#doodleSizeInput').addEventListener('input', ev=>{ doodleSize = +ev.target.value; });
    toolbar.querySelector('#doodleClearBtn').onclick = ()=> ctx.clearRect(0,0,canvas.width,canvas.height);
    toolbar.querySelector('#doodleCancelBtn').onclick = ()=>{ doodleMode = false; paint(); };
    toolbar.querySelector('#doodleDoneBtn').onclick = async ()=>{
      // 直接存成板子自己的涂鸦图层，不是一个可以拖拽的贴图元素
      board.doodle = canvas.toDataURL('image/png');
      doodleMode = false;
      await queueSave();
      paint();
    };
  }

  paint();
}

  `;
  document.getElementById('changePwdBtn').onclick = async ()=>{
    const cur = document.getElementById('curPwd').value;
    const np = document.getElementById('newPwd').value;
    const np2 = document.getElementById('newPwd2').value;
    if(cur !== currentPassword(i)){ alert('当前密码不对'); return; }
    if(np.length<4){ alert('新密码至少4位'); return; }
    if(np!==np2){ alert('两次新密码不一致'); return; }
    state.credentials = state.credentials || {};
    state.credentials[i] = np;
    await queueSave();
    alert('密码已修改，记得记住新密码');
    document.getElementById('curPwd').value = '';
    document.getElementById('newPwd').value = '';
    document.getElementById('newPwd2').value = '';
  };
  document.getElementById('saveNameBtn').onclick = async ()=>{
    const newName = document.getElementById('pfName').value.trim();
    if(!newName){ alert('名字不能为空'); return; }
    if(newName === mem.name){ return; }
    if(nameTaken(newName, i)){ alert('这个名字已经被用过了，换一个吧'); return; }
    if(guestSelf){ await renameGuest(mem.name, newName); }
    else{ await renameMusician(i, newName); }
    renderProfileTab(target);
  };
  if(isAdmin() && !guestSelf){
    document.getElementById('editOwnTitleBtn').onclick = ()=> openTitleEditor(i);
  }
  let selectedGender = prof.gender || '';
  body.querySelectorAll('.gender-btn').forEach(b=>{
    b.onclick = ()=>{
      selectedGender = b.dataset.g;
      body.querySelectorAll('.gender-btn').forEach(x=>x.classList.toggle('active', x===b));
    };
  });
  let selectedThemeColor = prof.themeColor || MEMBER_COLORS[i];
  body.querySelectorAll('.theme-color-dot').forEach(b=>{
    b.onclick = ()=>{
      selectedThemeColor = b.dataset.c;
      body.querySelectorAll('.theme-color-dot').forEach(x=>x.classList.toggle('active', x===b));
    };
  });
  let pendingAvatar = null;
  document.getElementById('avatarBtn').onclick = ()=> document.getElementById('avatarInput').click();
  document.getElementById('avatarInput').addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    try{
      pendingAvatar = await fileToResizedDataURL(file, 300, 0.8);
      document.getElementById('avatarBtn').innerHTML = `<img src="${pendingAvatar}">`;
    }catch(err){ alert('头像处理失败：' + err.message); }
  });
  document.getElementById('saveProfileBtn').onclick = async ()=>{
    state.profiles[i] = {
      birthday: document.getElementById('pfBirthday').value,
      bloodType: document.getElementById('pfBlood').value,
      gender: selectedGender,
      school: document.getElementById('pfSchool').value.trim(),
      mbti: document.getElementById('pfMbti').value,
      interests: document.getElementById('pfInterests').value.trim(),
      bio: document.getElementById('pfBio').value.trim(),
      themeColor: guestSelf ? null : selectedThemeColor,
      avatar: pendingAvatar || prof.avatar || null
    };
    await queueSave();
    alert('已保存');
    renderProfileTab(target);
  };
  renderBoardSection(document.getElementById('boardContainer'), i, true);
}

function openTitleEditor(idx){
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const mem = state.members[idx];
  panel.innerHTML = `<h2>编辑 ${escapeHtml(mem.name)} 的称号</h2>
    <div class="cfg-field"><input id="titleInput" value="${escapeHtml(mem.instrument||'')}" placeholder="比如：主唱、节奏担当、精神股东"></div>
    <div class="panel-actions">
      <button class="btn btn-ghost" id="clearTitleBtn">清除称号</button>
      <button class="btn btn-primary" id="saveTitleBtn">保存</button>
    </div>`;
  overlay.classList.add('show');
  document.getElementById('clearTitleBtn').onclick = async ()=>{
    mem.instrument = '';
    await queueSave();
    closePanel();
    renderActiveTab();
  };
  document.getElementById('saveTitleBtn').onclick = async ()=>{
    mem.instrument = document.getElementById('titleInput').value.trim();
    await queueSave();
    closePanel();
    renderActiveTab();
  };
}

function renderFriendProfile(target, idx){
  const mem = getPersonById(idx);
  const prof = state.profiles[idx] || {};
  const isGuestFriend = isGuestIdentity(idx);
  const total = isGuestFriend ? null : totalCheckinCount(idx);
  target.innerHTML = `
    <button class="back-link" id="backToMe">← 返回我的资料</button>
    <div class="profile-card">
      <div class="profile-top">
        <div class="avatar-big">${prof.avatar? `<img src="${prof.avatar}">` : (mem.name[0]||'')}</div>
        <div>
          <div style="font-family:'Noto Serif SC',serif;font-weight:700;font-size:18px;">${mem.name}</div>
          <div class="sub" style="margin:0;display:flex;align-items:center;gap:8px;">${isGuestFriend? '游客' : escapeHtml(mem.instrument)}${(isAdmin() && !isGuestFriend)? `<button class="footer-link" id="editTitleBtn" type="button">编辑称号</button>` : ''}</div>
        </div>
      </div>
      <div class="profile-fields">
        <div class="field-block"><label>生日</label><div>${prof.birthday || '未填写'}</div></div>
        <div class="field-block"><label>血型</label><div>${prof.bloodType? prof.bloodType+'型' : '未填写'}</div></div>
        <div class="field-block"><label>学校</label><div>${escapeHtml(prof.school || '未填写')}</div></div>
        <div class="field-block"><label>MBTI</label><div>${prof.mbti || '未填写'}</div></div>
        <div class="field-block" style="grid-column:1/-1;"><label>兴趣爱好</label><div>${escapeHtml(prof.interests || '未填写')}</div></div>
        <div class="field-block" style="grid-column:1/-1;"><label>个性签名</label><div>${escapeHtml(prof.bio || '未填写')}</div></div>
        <div class="field-block" style="grid-column:1/-1;"><label>性别</label><div>${prof.gender || '未填写'}</div></div>
        ${(isAdmin() && isGuestFriend) ? `<div class="field-block" style="grid-column:1/-1;"><label>账号创建时间</label><div>${(()=>{ const g = getGuest(guestNameOf(idx)); return g && g.joinedAt ? fmtTime(g.joinedAt) : '未知'; })()}</div></div>` : ''}
      </div>
      ${isGuestFriend? '' : `<div class="profile-stat">累计打卡 <b>${total}</b> 次</div>`}
    </div>
    ${isGuestFriend? '' : `<div class="profile-card">
      <div class="section-head"><h2>打卡徽章</h2></div>
      ${renderBadgeWall(idx)}
    </div>`}
    <div class="profile-card">
      <div class="section-head"><h2>${escapeHtml(mem.name)} 的展示墙</h2></div>
      <div id="boardContainer"></div>
    </div>
    <div class="chat-card">
      <div class="section-head"><h2>和 ${escapeHtml(mem.name)} 聊天</h2></div>
      <div class="chat-thread" id="chatThread"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="说点什么…">
        <button class="btn btn-primary" id="chatSend" style="width:auto;padding:8px 16px;">发送</button>
      </div>
    </div>
  `;
  document.getElementById('backToMe').onclick = ()=>{ state.viewingFriend = null; renderActiveTab(); };
  if(isAdmin() && !isGuestFriend){
    document.getElementById('editTitleBtn').onclick = ()=> openTitleEditor(idx);
  }
  markMessagesRead(idx);
  renderChatThread(idx);
  renderBoardSection(document.getElementById('boardContainer'), idx, false);
  const sendMsg = ()=>{
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;
    state.messages = state.messages || [];
    state.messages.push({ id:'msg_'+Date.now(), from: state.identity, to: idx, text, ts: Date.now(), read:false });
    input.value = '';
    renderChatThread(idx); // 先立刻显示，不等网络
    queueSave(); // 保存放到后台排队执行，不阻塞输入下一条
  };
  document.getElementById('chatSend').onclick = sendMsg;
  document.getElementById('chatInput').addEventListener('keydown', ev=>{ if(ev.key==='Enter') sendMsg(); });
}

async function markMessagesRead(otherId){
  let changed = false;
  (state.messages||[]).forEach(m=>{
    if(String(m.to)===String(state.identity) && String(m.from)===String(otherId) && !m.read){ m.read = true; changed = true; }
  });
  if(changed) await queueSave();
}

function renderChatThread(otherId){
  const box = document.getElementById('chatThread');
  if(!box) return;
  const key = convKey(state.identity, otherId);
  const msgs = (state.messages||[]).filter(m=> convKey(m.from,m.to)===key).sort((a,b)=>a.ts-b.ts);
  if(msgs.length===0){
    box.innerHTML = `<div class="empty-hint">还没有聊天记录，打个招呼吧</div>`;
  }else{
    box.innerHTML = msgs.map(m=>{
      const mine = String(m.from)===String(state.identity);
      const bubbleContent = m.recalled
        ? `<i style="opacity:.65;">${mine? '你' : '对方'}撤回了一条消息</i>`
        : escapeHtml(m.text);
      const recallBtn = (mine && !m.recalled) ? `<button type="button" class="chat-recall-btn" data-id="${m.id}">撤回</button>` : '';
      return `<div class="chat-bubble-row ${mine?'mine':''}">
        <div class="chat-bubble-wrap">
          <div class="chat-bubble">${bubbleContent}</div>
          <div class="chat-meta"><span>${fmtTime(m.ts)}</span>${recallBtn}</div>
        </div>
      </div>`;
    }).join('');
    box.querySelectorAll('.chat-recall-btn').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('确定撤回这条消息吗？')) return;
        const msg = (state.messages||[]).find(x=>x.id===b.dataset.id);
        if(!msg) return;
        msg.recalled = true;
        await queueSave();
        renderChatThread(otherId);
      };
    });
  }
  box.scrollTop = box.scrollHeight;
}


window.addEventListener('error', (ev)=>{
  const app = document.getElementById('app');
  if(app && app.innerHTML.includes('正在打开练习本')){
    renderErrorScreen((ev.message||'未知错误').toString());
  }
});
loadAll().catch(err=> renderErrorScreen((err&&err.message)||String(err)));
</script>
