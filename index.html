<style>
  :root{
    --bg:#F1F5EB; --card:#FBFAF3; --ink:#223328; --ink-soft:#5A6B5D; --line:#DDE3D2;
    --leaf:#4C7A5E; --leaf-light:#C4D6C6; --amber:#E2A33D; --rest:#D8D2C2; --danger:#B4553F;
    --m1:#4C7A5E; --m2:#7FA88F; --m3:#E2A33D; --m4:#B97A56; --m5:#6E85A6; --m6:#9B7BA6;
    --radius:14px;
    --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:40px; --sp-5:64px;
    --shadow-card:0 1px 3px rgba(34,51,40,0.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 1px 1px, rgba(76,122,94,0.08) 1px, transparent 0);background-size:22px 22px;color:var(--ink);font-family:'Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}
  header{margin-bottom:28px;position:relative;}
  .notif-bell{position:absolute;top:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .notif-bell:hover{border-color:var(--leaf);}
  .notif-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;border-radius:999px;min-width:16px;height:16px;font-size:9.5px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:'Space Grotesk',sans-serif;}
  .daily-quote{margin-top:12px;padding:12px 16px;background:var(--card);border:1px dashed var(--line);border-radius:10px;}
  .dq-label{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);font-weight:700;margin-bottom:4px;}
  .dq-text{font-family:'Noto Serif SC',serif;font-size:14.5px;color:var(--ink);line-height:1.6;}
  .birthday-banner{margin-top:10px;padding:10px 16px;background:#FDF0E0;border:1px solid #EBC896;border-radius:10px;font-size:13.5px;color:#8A5A1E;}
  .birthday-banner b{color:#6B3E0A;}
  .profile-subnav{display:flex;gap:8px;margin-bottom:18px;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .name-edit-row{display:flex;gap:8px;align-items:center;}
  .name-edit-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;background:#fff;color:var(--ink);}
  .name-edit-row .btn{width:auto;padding:7px 12px;font-size:12px;}
  .float-badge{background:var(--danger);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;}
  .eyebrow{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--leaf);font-weight:700;margin-bottom:6px;}
  h1{font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(28px,5vw,42px);margin:0 0 8px;line-height:1.2;}
  .sub{color:var(--ink-soft);font-size:14.5px;max-width:60ch;line-height:1.7;}
  .sub b{color:var(--ink);}
  .tabs{display:flex;gap:8px;margin:24px 0 16px;flex-wrap:wrap;align-items:center;}
  .tab-btn{font-family:'Space Grotesk',sans-serif;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:14px;transition:.15s;}
  .tab-btn.active{background:var(--leaf);border-color:var(--leaf);color:#fff;}
  .tab-btn:hover:not(.active){border-color:var(--leaf);color:var(--leaf);}
  .spacer{flex:1;}
  .icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);height:34px;border-radius:10px;cursor:pointer;font-size:13px;padding:0 14px;display:flex;align-items:center;gap:6px;font-family:'Noto Sans SC',sans-serif;}
  .icon-btn:hover{border-color:var(--leaf);color:var(--leaf);}
  .cal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 1px 0 rgba(34,51,40,0.03);}
  .cal-month{font-family:'Noto Serif SC',serif;font-weight:700;font-size:19px;margin:0 0 14px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:11.5px;color:var(--ink-soft);text-align:center;padding-bottom:4px;font-weight:500;}
  .cal-cell{position:relative;border-radius:10px;min-height:78px;padding:6px 6px 8px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.12s;}
  .cal-cell.pad{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell.weekend{background:repeating-linear-gradient(135deg, var(--rest), var(--rest) 6px, #ece7d9 6px, #ece7d9 12px);opacity:.65;cursor:default;border-color:var(--line);}
  .cal-cell.weekend .rest-tag{position:absolute;bottom:4px;right:6px;font-size:9.5px;color:#7a7261;font-weight:500;}
  .cal-cell:not(.weekend):not(.pad):hover{border-color:var(--leaf);transform:translateY(-1px);}
  .cal-cell.today{outline:2px solid var(--amber);outline-offset:-2px;}
  .cal-date{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:500;color:var(--ink-soft);}
  .cal-cell.weekend .cal-date{color:#7a7261;}
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px;}
  .badge{position:relative;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--leaf-light);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:transparent;font-family:'Space Grotesk',sans-serif;}
  .badge.proxy::after{content:'';position:absolute;top:-2px;right:-2px;width:6px;height:6px;border-radius:50%;background:var(--amber);border:1px solid #fff;}
  .leaf.filled.proxy{box-shadow:0 0 0 2px var(--amber);}
  .proxy-tag{display:inline-block;font-size:10px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:999px;margin-left:6px;font-weight:700;vertical-align:middle;}
  .badge.done{border-color:transparent;color:#fff;}
  .badge.proxied{box-shadow:0 0 0 2px var(--amber);}
  .leaf.filled.proxied{box-shadow:0 0 0 2px var(--amber);}
  .proxied-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--amber);background:#FDF0E0;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle;}
  .overlay{position:fixed;inset:0;background:rgba(34,51,40,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .overlay.show{display:flex;}
  .panel{background:var(--card);border-radius:18px;max-width:440px;width:100%;max-height:86vh;overflow-y:auto;padding:22px;border:1px solid var(--line);}
  .panel h2{font-family:'Noto Serif SC',serif;font-size:20px;margin:0 0 2px;}
  .panel .sub{margin-bottom:16px;}
  .member-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .member-row:first-of-type{border-top:none;}
  .check-circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--leaf-light);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;margin-top:2px;transition:.12s;}
  .check-circle.on{border-color:transparent;}
  .member-info{flex:1;}
  .member-name{font-weight:700;font-size:14.5px;}
  .member-inst{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .note-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink);}
  .note-input:focus{outline:none;border-color:var(--leaf);}
  .panel-actions{display:flex;gap:8px;margin-top:18px;}
  .btn{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid transparent;}
  .btn-primary{background:var(--leaf);color:#fff;flex:1;}
  .btn-primary:hover{background:#3c624b;}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
  .journal{margin-top:34px;}
  .journal-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .journal-head h2{font-family:'Noto Serif SC',serif;font-size:21px;margin:0;}
  .journal-note{color:var(--ink-soft);font-size:13px;margin-bottom:18px;}
  .vine-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);}
  .vine-row:first-of-type{border-top:none;}
  .vine-id{width:108px;flex:0 0 auto;}
  .vine-name{font-weight:700;font-size:14px;}
  .vine-inst{font-size:11.5px;color:var(--ink-soft);}
  .vine-stats{font-family:'Space Grotesk',sans-serif;font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .vine-stats b{color:var(--ink);font-size:13px;}
  .stem-wrap{flex:1;overflow-x:auto;padding:10px 4px 4px;}
  .stem{display:flex;align-items:center;position:relative;min-width:max-content;}
  .stem::before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);transform:translateY(-1px);z-index:0;}
  .leaf{position:relative;z-index:1;width:13px;height:13px;border-radius:0% 100% 0% 100%;transform:rotate(45deg);margin-right:6px;flex:0 0 auto;background:var(--leaf-light);transition:.12s;}
  .leaf.filled{box-shadow:0 0 0 1px rgba(0,0,0,0.02);}
  .leaf.frozen{background:#8FB8D9;box-shadow:0 0 0 1px rgba(255,255,255,0.4) inset;}
  .leaf.weekend-mark{width:6px;height:6px;border-radius:50%;transform:none;background:var(--rest);margin:0 6px;}
  .leaf.future{background:transparent;border:1.5px dashed var(--line);}
  .setup-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;max-width:600px;margin:40px auto;}
  .setup-card h1{font-size:24px;}
  .setup-card ol{padding-left:20px;line-height:2;font-size:14px;color:var(--ink);}
  .setup-card code{background:#EDEBDD;padding:2px 6px;border-radius:5px;font-size:12.5px;}
  .setup-card a{color:var(--leaf);}
  .cfg-field{margin-top:14px;}
  .cfg-field label{font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .cfg-field input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:'Space Grotesk',monospace;font-size:13px;background:#fff;color:var(--ink);}
  .cfg-field input:focus{outline:none;border-color:var(--leaf);}
  .loading{color:var(--ink-soft);font-size:14px;padding:60px 0;text-align:center;}
  footer{margin-top:36px;font-size:12px;color:var(--ink-soft);text-align:center;}
  .footer-link{background:none;border:none;color:var(--leaf);text-decoration:underline;cursor:pointer;font-size:12px;font-family:inherit;padding:0;}
  .id-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .id-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;transition:.12s;}
  .id-btn:hover{border-color:var(--mc,var(--leaf));transform:translateY(-1px);}
  .id-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;}
  .id-text{display:flex;flex-direction:column;line-height:1.4;}
  .id-text b{font-size:14px;}
  .id-text small{font-size:11.5px;color:var(--ink-soft);}
  .id-btn-founder{grid-column:1 / -1;background:#FDF6E8;border-color:#EBD8A6;}
  .quick-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;gap:16px;}
  .quick-card.rest{background:repeating-linear-gradient(135deg, var(--rest), var(--rest) 8px, #ece7d9 8px, #ece7d9 16px);border-color:var(--line);}
  .quick-info{flex:1;}
  .quick-label{font-size:12px;color:var(--ink-soft);margin-bottom:2px;}
  .quick-name{font-family:'Noto Serif SC',serif;font-weight:700;font-size:17px;}
  .quick-note-input{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink);}
  .quick-note-input:focus{outline:none;border-color:var(--leaf);}
  .quick-toggle{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:2px solid var(--leaf-light);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;transition:.12s;}
  .quick-toggle.on{border-color:transparent;}
  .overview-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .overview-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .overview-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;}
  .overview-count{font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--ink-soft);}
  .overview-count b{color:var(--leaf);font-size:15px;}
  .overview-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
  .ov-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;background:#fff;border:1px solid var(--line);}
  .ov-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--leaf-light);}
  .ov-dot.done{background:var(--leaf);}
  .ov-name{font-size:13px;font-weight:500;flex:1;}
  .ov-name small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px;}
  .banner{background:#FDF0E8;border:1px solid #EBC8A6;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#7A4A26;margin-bottom:16px;}
  /* ---- 夸夸墙入口卡片（放在回忆动态顶部，做得显眼一点） ---- */
  .praise-entry{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FDF6E8,#F3F8EE);border:1px solid #E8D9A8;border-radius:16px;padding:16px 18px;margin-bottom:18px;cursor:pointer;transition:.15s;}
  .praise-entry:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(120,100,40,.12);}
  .praise-entry-icon{font-size:32px;flex:0 0 auto;}
  .praise-entry-main{flex:1;min-width:0;}
  .praise-entry-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:17px;}
  .praise-entry-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .praise-entry-arrow{font-size:26px;color:var(--ink-soft);flex:0 0 auto;}

  /* ---- 演出通告 ---- */
  .gig-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .gig-card.gig-cancelled,.gig-card.gig-done{opacity:.6;}
  .gig-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .gig-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;flex:1;min-width:0;}
  .gig-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;flex:0 0 auto;}
  .gig-status-pending{background:#FDF0E0;color:#8A5A1E;}
  .gig-status-confirmed{background:var(--leaf-light);color:#2F4A3D;}
  .gig-status-done{background:#E4E9E0;color:#5A6B5D;}
  .gig-status-cancelled{background:#F3DEDA;color:#8B2E1F;}
  .gig-del{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;}
  .gig-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);}
  .gig-note{font-size:13.5px;line-height:1.6;margin-top:8px;white-space:pre-wrap;}
  .gig-attend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .gig-attend-label{color:var(--ink-soft);}
  .gig-attend-yes{color:var(--leaf);font-weight:500;}
  .gig-attend-no{color:var(--danger);}
  .gig-rsvp{display:flex;gap:8px;margin-top:10px;}
  .gig-rsvp-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .gig-rsvp-btn:hover{border-color:var(--leaf);color:var(--leaf);}
  .gig-rsvp-btn.active{background:var(--leaf);border-color:var(--leaf);color:#fff;}
  .gig-status-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .gig-set-status{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:11.5px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .gig-set-status.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  /* ---- 夸夸墙 ---- */
  .praise-podium{display:flex;gap:10px;margin-bottom:16px;}
  .praise-podium-item{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;}
  .praise-podium-medal{font-size:24px;}
  .praise-podium-name{font-weight:700;font-size:13px;margin-top:4px;}
  .praise-podium-count{font-size:11px;color:var(--ink-soft);}
  .praise-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .praise-head{display:flex;align-items:center;gap:6px;font-size:12.5px;flex-wrap:wrap;margin-bottom:6px;}
  .praise-from{font-weight:700;color:var(--leaf);}
  .praise-arrow{color:var(--ink-soft);}
  .praise-to{font-weight:700;color:var(--amber);}
  .praise-time{margin-left:auto;color:var(--ink-soft);font-size:11px;font-family:'Space Grotesk',sans-serif;}
  .praise-text{font-size:15px;line-height:1.6;white-space:pre-wrap;}
  .praise-actions{display:flex;gap:12px;margin-top:8px;align-items:center;}
  .praise-like{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .praise-like:hover{border-color:var(--leaf);color:var(--leaf);}
  .praise-like.liked{background:var(--leaf-light);border-color:var(--leaf);color:var(--ink);}
  .praise-del{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;}

  /* ---- 乐队小账本 ---- */
  .ledger-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  @media (max-width:560px){ .ledger-summary{grid-template-columns:repeat(2,1fr);} }
  .ledger-stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
  .ledger-stat-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .ledger-stat-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}
  .ledger-stat-num.income{color:var(--leaf);}
  .ledger-stat-num.expense{color:var(--danger);}
  .ledger-form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media (max-width:560px){ .ledger-form{grid-template-columns:repeat(2,1fr);} }
  .ledger-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .ledger-row-main{flex:1;min-width:0;}
  .ledger-row-note{font-size:14px;font-weight:500;}
  .ledger-row-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .ledger-row-amount{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;flex:0 0 auto;}
  .ledger-row-amount.income{color:var(--leaf);}
  .ledger-row-amount.expense{color:var(--danger);}
  .ledger-del{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;flex:0 0 auto;}
  .np-reactions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .np-react{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .np-react:hover{border-color:var(--leaf);color:var(--leaf);}
  .np-react.active{background:var(--leaf);border-color:var(--leaf);color:#fff;}
  .home-entries{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0;}
  @media (max-width:520px){ .home-entries{grid-template-columns:repeat(2,1fr);} }
  .entry-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 14px;text-align:center;cursor:pointer;transition:.15s;}
  .entry-card:hover{border-color:var(--leaf);transform:translateY(-2px);}
  .entry-icon{font-size:32px;margin-bottom:8px;}
  .entry-label{font-family:'Noto Serif SC',serif;font-weight:700;font-size:15px;}
  .entry-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .instrument-deco{display:flex;justify-content:center;gap:22px;font-size:38px;opacity:.5;margin:50px 0 10px;filter:grayscale(.15);}

  /* ---- 娱乐吧 / 谁是卧底 ---- */
  .game-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
  .game-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 14px;text-align:center;cursor:pointer;transition:.15s;}
  .game-card:hover{border-color:var(--leaf);transform:translateY(-2px);}
  .game-icon{font-size:32px;margin-bottom:8px;}
  .game-name{font-family:'Noto Serif SC',serif;font-weight:700;font-size:15px;}
  .game-desc{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .uc-player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:6px;}
  .uc-player-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;}
  .uc-avatar{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
  .uc-word-card{background:var(--card);border:1px dashed var(--leaf);border-radius:10px;padding:14px 16px;font-size:15px;margin-top:10px;}
  .uc-word-card b{color:var(--leaf);font-size:18px;}
  .uc-vote-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .uc-vote-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .uc-vote-btn:hover{border-color:var(--leaf);color:var(--leaf);}
  .uc-vote-btn.active{background:var(--leaf);border-color:var(--leaf);color:#fff;}
  .uc-reveal-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .uc-reveal-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;}
  .uc-reveal-name{font-weight:700;font-size:13.5px;flex:0 0 auto;min-width:60px;}
  .uc-reveal-role{font-size:12px;color:var(--ink-soft);flex:0 0 auto;min-width:64px;}
  .uc-reveal-role.uc-role-spy{color:var(--danger);font-weight:700;}

  if(g) g.name = newName;
  if(state.credentials && oldId in state.credentials){ state.credentials[newId] = state.credentials[oldId]; delete state.credentials[oldId]; }
  if(state.profiles && oldId in state.profiles){ state.profiles[newId] = state.profiles[oldId]; delete state.profiles[oldId]; }

  });
  (state.notifications||[]).forEach(n=>{
    if(n.to===oldId) n.to = newId;

  });
  (state.posts||[]).forEach(p=>{

/* 把图片压缩成一个不太大的 base64，直接存进数据库，不依赖额外的图片存储服务 */
function fileToResizedDataURL(file, maxDim=760, quality=0.72){
  return new Promise((resolve,reject)=>{
    if(!file) return resolve(null);
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('读取图片失败'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('图片解析失败'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else{ w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- REMOTE STORAGE (Supabase) ---------------- */
async function remoteGet(){
  const { data, error } = await supabaseClient
    .from('checkin')
    .select('data')
    .eq('date', 'main_data')
    .maybeSingle();
  if(error) throw new Error('读取云端数据失败：' + error.message);
  return data ? data.data : null;
}
async function remoteSet(data){
  const { error } = await supabaseClient
    .from('checkin')
    .upsert({ date: 'main_data', data: data }, { onConflict: 'date' });
  if(error) throw new Error('保存到云端失败：' + error.message);
}

/* ---------------- 实时同步（Supabase Realtime）----------------
   之前的问题：想知道对方有没有新消息，只能靠手动点"刷新最新数据"，
   或者等待下一次操作。这里订阅这张表的变化，只要任何人保存了新数据，
   所有打开着网页的人都会在几乎同一瞬间收到推送，不用再手动刷新。
   注意：这需要在 Supabase 后台把 checkin 这张表的 Realtime 打开——
   Supabase 控制台 → Database → Replication，把 checkin 表的开关打开，
   不然下面这个订阅不会收到任何推送（代码本身不会报错，只是收不到）。 */
function applyRemoteData(data){
  if(!data) return;
  state.members = data.members || state.members;
  state.checkins = data.checkins || {};
  state.meetings = data.meetings || [];
  state.posts = data.posts || [];
  state.profiles = data.profiles || {};
  state.guests = data.guests || [];
  state.credentials = data.credentials || {};
  state.messages = data.messages || [];
  state.boards = data.boards || {};
  state.bandBanner = data.bandBanner || null;
  state.notifications = data.notifications || [];
  state.announcement = data.announcement || '';
  state.nameProposals = data.nameProposals || [];
  state.freezeTokens = data.freezeTokens || {};
  state.frozenDays = data.frozenDays || {};
  state.freezeAwardMark = data.freezeAwardMark || {};
  state.teambuilds = data.teambuilds || [];
  state.dayMemories = data.dayMemories || {};
  state.undercoverGame = data.undercoverGame || null;
  state.shooterGame = data.shooterGame || null;
  state.praises = data.praises || [];
  state.ledger = data.ledger || [];
  state.gigs = data.gigs || [];
}

function startRealtimeSync(){
  try{
    supabaseClient
      .channel('band-site-sync')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'checkin', filter: 'date=eq.main_data' }, (payload)=>{
        if(!payload.new || !payload.new.data) return;
        if(saveInFlight){
          // 本地正好有改动在排队保存（比如刚点了取消打卡/代打卡），这时候不能拿服务器的旧快照
          // 覆盖回来，不然会把还没保存成功的改动又悄悄改回原样——这正是"打卡取消不了"的真正原因。
          // 等本地这一轮保存跑完，我们自己的最新结果自然会广播出去，到时候再同步。
          return;
        }
        applyRemoteData(payload.new.data);
        renderNotifBell();
        // 只刷新当前正在看的那一小块界面，不做整页重绘，避免打断正在输入的内容
        if(document.getElementById('postList')) renderPostList();
        if(document.getElementById('chatThread') && state.viewingFriend !== null && state.viewingFriend !== undefined){
          renderChatThread(state.viewingFriend);
        }
      })
      .subscribe();
  }catch(e){
    console.error('实时同步订阅失败（不影响手动刷新）：', e);
  }
}

/* 给一个 promise 加超时保护：网络请求如果一直挂着不返回也不报错，
   等太久就自动判定失败，绝不会让保存队列永远卡在"进行中"出不来 */
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error((label||'操作')+'超时（超过'+(ms/1000)+'秒无响应），请检查网络后重试')), ms))
  ]);
}

async function saveAll(){
  try{

      members: state.members,

      guests: state.guests,
      credentials: state.credentials,
      messages: state.messages,

      undercoverGame: state.undercoverGame,
      shooterGame: state.shooterGame,
      praises: state.praises,

    }), 15000, '保存');
  }catch(e){

    alert('保存失败：' + e.message + '\n请检查网络，或稍后重试一次。');
  }

/* 保存排队器：每次都是整份数据整体上传，短时间内连续操作（比如连发几条消息）
   会触发好几个并发的网络请求，谁先谁后完全看网络状况，慢的那个后到达
   反而会把快的那个覆盖掉——这就是"发几条消息、内容会消失/要很久才出现"的
   根本原因。用这个队列把保存严格排成一个接一个，绝不并发，并且如果保存
   进行中又来了新的改动，只会在当前这次结束后再补发"最新状态"一次，
   不会无限堆积请求。 */
let saveInFlight = false, saveAgainNeeded = false;
async function queueSave(){
  saveAgainNeeded = true;
  if(saveInFlight) return;
  saveInFlight = true;
  while(saveAgainNeeded){
    saveAgainNeeded = false;
    await saveAll();
  }
  saveInFlight = false;
}

    const pwd = document.getElementById('newGuestPwd').value;
    const pwd2 = document.getElementById('newGuestPwd2').value;
    if(!name){ alert('起个名字吧'); return; }
    if(state.members.some(m=>m.name===name) || (state.guests||[]).some(g=>g.name===name)){ alert('这个名字已经被用过了，换一个吧'); return; }
    if(!intro){ alert('麻烦写一下你是谁、谁邀请你来的，方便大家认识你'); return; }
    if(pwd.length<4){ alert('密码至少4位'); return; }
    if(pwd!==pwd2){ alert('两次密码不一致'); return; }
    state.guests = state.guests || [];
    state.guests.push({ name, joinedAt: Date.now(), intro });
    state.credentials = state.credentials || {};
    state.credentials['guest:'+name] = pwd;
    addNotif(ADMIN_INDEX, 'new_guest', 'guest:'+name, null, intro);
    await queueSave();
    saveIdentity('guest:'+name);
    renderRoot();
  };

function pickDailyQuote(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  const idx = ((dayOfYear % DAILY_QUOTES.length) + DAILY_QUOTES.length) % DAILY_QUOTES.length;
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  return { text: DAILY_QUOTES[idx], date: dateStr };
}

function startUndercoverGame(game, undercoverCount){
  const players = [...game.players];
  // 洗牌
  for(let i=players.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [players[i],players[j]] = [players[j],players[i]];
  }
  const pair = UNDERCOVER_WORD_PAIRS[Math.floor(Math.random()*UNDERCOVER_WORD_PAIRS.length)];
  const roles = {};
  players.forEach((pid,idx)=>{ roles[pid] = idx < undercoverCount ? 'undercover' : 'civilian'; });
  game.status = 'playing';
  game.hostId = state.identity;
  game.undercoverCount = undercoverCount;
  game.roles = roles;
  game.words = { civilian: pair[0], undercover: pair[1] };
  game.alive = [...game.players];
  game.round = 1;
  game.votes = {};
  game.lastResult = null;
}

  const mine = state.identity;
  const iPlay = game.alive.some(p=>String(p)===String(mine)) || game.players.some(p=>String(p)===String(mine));
  const myRole = game.roles[mine];
  const myWord = myRole ? game.words[myRole] : null;
  const aliveList = game.alive;

  target.innerHTML = `
    <button class="back-link" id="backToGames">← 返回娱乐吧</button>
    <div class="section-head"><h2>🕵️ 谁是卧底 · 第 ${game.round} 轮</h2></div>
    ${myWord? `<div class="uc-word-card">你的词是：<b>${escapeHtml(myWord)}</b></div>` : (iPlay? '' : `<div class="banner">你没有报名这一局，只能围观，不能投票。</div>`)}
    ${game.lastResult? `<div class="banner">${game.lastResult}</div>` : ''}
    <div class="section-head" style="margin-top:18px;"><h2>还在场上的人</h2></div>
    <div class="uc-player-grid" id="ucAliveGrid"></div>
    ${aliveList.some(p=>String(p)===String(mine)) ? `
      <div class="section-head" style="margin-top:18px;"><h2>投票（选你觉得是卧底的人）</h2></div>

function maybeResolveUndercoverRound(game){
  if(Object.keys(game.votes).length < game.alive.length) return; // 还没投完
  const tally = {};
  Object.values(game.votes).forEach(pid=>{ tally[pid] = (tally[pid]||0) + 1; });
  let maxVotes = 0, top = [];
  Object.entries(tally).forEach(([pid,ct])=>{
    if(ct>maxVotes){ maxVotes = ct; top = [pid]; }
    else if(ct===maxVotes){ top.push(pid); }
  });
  if(top.length!==1){
    game.lastResult = `本轮平票，大家都安全，进入下一轮。`;
  }else{
    const outId = top[0];
    const outPerson = getPersonById(outId);
    const wasUndercover = game.roles[outId] === 'undercover';
    game.alive = game.alive.filter(p=>String(p)!==String(outId));
    game.lastResult = `${escapeHtml(outPerson.name)} 被投出局了，Ta是${wasUndercover? '卧底 🕵️' : '平民 🙂'}。`;
  }
  game.votes = {};
  game.round += 1;
  if(game.alive.length <= 1){
    game.status = 'ended';
  }
}

function startShooterGame(game){
  // 生成本局的障碍物，存进共享数据，保证所有人看到的地图一模一样
  const obstacles = [];
  for(let i=0;i<14;i++){
    const x = 150 + Math.random()*(SHOOTER_W-300);
    const y = 150 + Math.random()*(SHOOTER_H-300);
    const size = 50 + Math.random()*40;
    obstacles.push({ x:x-size/2, y:y-size/2, w:size, h:size });
  }
  game.status = 'playing';
  game.hostId = state.identity;
  game.startedAt = Date.now();
  game.obstacles = obstacles;
  game.lastResult = null;
  game.boss = { name:'毛兽', hp:60, maxHp:60, x:SHOOTER_W/2, y:SHOOTER_H/2, alive:true, respawnAt:0 };
}

const SHOOTER_BOSS_RESPAWN_MS = 30000; // 毛兽被打死后，30秒再刷新一次
const SHOOTER_GATLING_DURATION = 30000; // 加特林奖励持续30秒
let shooterGatlingUntil = 0;
let shooterBackGuardActive = false;
let shooterAutoFireTimer = null;

/* ---- 简单可复现的伪随机（同一个 tick 大家算出来的结果一致，不用联网同步）---- */
function seededRandom(seed){
  const x = Math.sin(seed)*10000;
  return x - Math.floor(x);
}
function getActivePickups(game){
  const elapsed = Date.now() - (game.startedAt||Date.now());
  const cycle = 10000; // 刷新周期从15秒缩短到10秒，因为现在是自动连续开火，弹药消耗快很多
  const tick = Math.floor(elapsed/cycle);
  return SHOOTER_SPAWN_POINTS.map((pt, idx)=>{
    const seed = tick*7 + idx*13 + 1;
    const show = seededRandom(seed) < 0.85; // 出现概率也调高，弹药包更容易刷出来
    if(!show) return null;
    const type = seededRandom(seed+3) < 0.75 ? 'ammo' : 'health'; // 弹药包的比例明显调高
    return { x:pt.x, y:pt.y, type, key: idx+'_'+tick };
  }).filter(Boolean);
}

/* ---- 实时对战：canvas + 摇杆 + 开火键 ---- */
let shooterChannel = null;
let shooterRAF = null;
let shooterKeydownHandler = null;
const shooterRemote = {}; // 其他人（含分身）的实时状态：{ id: {x,y,angle,hp,ammo,alive,kills,name,ts,isBot} }
const shooterBullets = []; // 本机渲染的子弹（含自己打的和别人广播来的）
let shooterMe = null; // 自己的实时状态
let shooterCollected = new Set(); // 本局已经吃过的资源key，避免同一格反复加
let shooterBots = []; // 只有"严格上帝"自己的设备会用到：自己召唤的3个分身
const shooterMines = {}; // 场上所有地雷：{ mineId: {x,y,ownerId} }，只有自己/队友能看见

function joinShooterChannel(onHit, game, onBotHit){
  if(shooterChannel) return;
  shooterChannel = supabaseClient.channel('band-shooter-live', { config:{ broadcast:{ self:false } } });
  shooterChannel.on('broadcast', {event:'state'}, (msg)=>{
    const p = msg.payload;
    const existing = shooterRemote[p.id];
    const fromX = existing && existing.renderX!==undefined ? existing.renderX : p.x;
    const fromY = existing && existing.renderY!==undefined ? existing.renderY : p.y;
    const fromAngle = existing && existing.renderAngle!==undefined ? existing.renderAngle : p.angle;
    shooterRemote[p.id] = Object.assign({}, p, {
      prevX: fromX, prevY: fromY, prevAngle: fromAngle,
      targetX: p.x, targetY: p.y, targetAngle: p.angle,
      renderX: fromX, renderY: fromY, renderAngle: fromAngle,
      recvTs: Date.now()
    });
  });
  shooterChannel.on('broadcast', {event:'shot'}, (msg)=>{
    shooterBullets.push({ x:msg.payload.x, y:msg.payload.y, angle:msg.payload.angle, ownerId:msg.payload.id, remote:true, life:60 });
  });
  shooterChannel.on('broadcast', {event:'hit'}, (msg)=>{
    const targetId = msg.payload.targetId;
    if(String(targetId)===String(state.identity)){ onHit(msg.payload.dmg, msg.payload.from); return; }
    if(typeof targetId==='string' && targetId.indexOf(String(state.identity)+'_bot')===0){ onBotHit(targetId, msg.payload.dmg); }
  });
  // 毛兽血量只有房主的设备说了算，其他人只广播"我打了它一下"，房主扣血后把最新状态广播回来
  shooterChannel.on('broadcast', {event:'bossHit'}, (msg)=>{
    if(String(state.identity) !== String(game.hostId)) return;
    if(!game.boss || !game.boss.alive) return;
    game.boss.hp = Math.max(0, game.boss.hp - msg.payload.dmg);
    if(game.boss.hp <= 0){
      game.boss.alive = false;
      game.boss.respawnAt = Date.now() + SHOOTER_BOSS_RESPAWN_MS;
      shooterChannel.send({ type:'broadcast', event:'gatling', payload:{ targetId: msg.payload.from, until: Date.now()+SHOOTER_GATLING_DURATION } });
    }
    shooterChannel.send({ type:'broadcast', event:'bossState', payload:{ hp:game.boss.hp, alive:game.boss.alive, respawnAt:game.boss.respawnAt } });
  });
  shooterChannel.on('broadcast', {event:'bossState'}, (msg)=>{
    if(!game.boss) game.boss = { name:'毛兽', hp:60, maxHp:60, x:1000, y:600, alive:true, respawnAt:0 };
    Object.assign(game.boss, msg.payload);
  });
  shooterChannel.on('broadcast', {event:'gatling'}, (msg)=>{
    if(String(msg.payload.targetId)===String(state.identity)) shooterGatlingUntil = msg.payload.until;
  });
  // 柜子羊的地雷：放置和触发都靠广播同步，谁能看见由渲染那边按"自己人"过滤
  shooterChannel.on('broadcast', {event:'mine'}, (msg)=>{
    shooterMines[msg.payload.id] = { x:msg.payload.x, y:msg.payload.y, ownerId:msg.payload.ownerId };
  });
  shooterChannel.on('broadcast', {event:'mineTrigger'}, (msg)=>{
    delete shooterMines[msg.payload.id];
  });
  // 杉菜的魅惑：范围内的每个人自己判断在不在圈里，在的话就把自己定住
  shooterChannel.on('broadcast', {event:'charm'}, (msg)=>{
    if(!shooterMe || !shooterMe.alive) return;
    if(game.mode==='team' && game.teams[msg.payload.from] && game.teams[state.identity] && game.teams[msg.payload.from]===game.teams[state.identity]) return;
    if(Math.hypot(shooterMe.x-msg.payload.x, shooterMe.y-msg.payload.y) < msg.payload.radius){
      shooterMe.charmedUntil = Date.now() + msg.payload.duration;
    }
  });
  shooterChannel.subscribe();
}
function leaveShooterChannel(){
  if(shooterChannel){ try{ shooterChannel.unsubscribe(); }catch(e){} shooterChannel = null; }
  Object.keys(shooterRemote).forEach(k=>delete shooterRemote[k]);
  Object.keys(shooterMines).forEach(k=>delete shooterMines[k]);
  shooterBullets.length = 0;
  shooterGatlingUntil = 0;
  shooterBots = [];
}

/* 六个角色各自的技能效果。除了坤坤/小鱼(15秒)是原话给出的数字，
   杉菜(范围140/持续5秒)、包菜(持续5秒)是我自己定的默认值，原话没给具体数字 */
function activateShooterSkill(game, mine){
  if(!shooterMe || !shooterMe.alive) return;
  const now = Date.now();
  if(now < shooterMe.skillReadyAt) return; // 冷却中，按钮上也会显示倒计时
  if(isGuestIdentity(mine) || !SHOOTER_SKILLS[mine]) return; // 游客暂时没有专属技能

  switch(mine){
    case 0: // 坤坤：加防御+加攻速+加移速+无限子弹，15秒
      shooterMe.buffUntil = now + 15000;
      break;
    case 1: // 小鱼：15秒无敌+隐身，别人看不见她，只看得到她的子弹
      shooterMe.invisUntil = now + 15000;
      break;
    case 2: // 杉菜：以自己为圆心魅惑周围敌人，让他们没法行动
      if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'charm', payload:{ from:mine, x:shooterMe.x, y:shooterMe.y, radius:140, duration:5000 } });
      break;
    case 3: // 包菜：接下来一段时间内，打中敌人直接一击致命
      shooterMe.executeUntil = now + 5000;
      break;
    case 4: { // 柜子羊：在脚下埋一颗地雷，同时最多3颗
      const mineCountOfMine = Object.values(shooterMines).filter(m=>String(m.ownerId)===String(mine)).length;
      if(mineCountOfMine >= 3){ alert('地雷已经埋满3颗了，等它们被踩到或者退出重进'); return; }
      const mineId = mine+'_mine_'+now;
      shooterMines[mineId] = { x:shooterMe.x, y:shooterMe.y, ownerId:mine };
      if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'mine', payload:{ id:mineId, x:shooterMe.x, y:shooterMe.y, ownerId:mine } });
      break;
    }
    case 5: // 严格上帝：召唤3个人机分身，帮忙攻击敌人（伤害很弱）
      shooterBots = [0,1,2].map(i=>({ id: mine+'_bot'+i, x: shooterMe.x+(i-1)*30, y: shooterMe.y+30, hp:3, angle:0, lastFire:0 }));
      break;
  }
  shooterMe.skillReadyAt = now + SHOOTER_SKILL_COOLDOWN;
  shooterMe.killsSinceSkill = 0;
}

function renderShooterPlaying(target, game){
  const mine = state.identity;
  const amPlaying = game.players.some(p=>String(p)===String(mine));
  target.innerHTML = `
    <div class="sh-wrap" id="shWrap">
      <div class="sh-rotate-hint" id="shRotateHint">📱 请把手机横过来玩</div>
      <div class="sh-stage" id="shStage">
        <canvas id="shCanvas" width="${SHOOTER_VIEW_W}" height="${SHOOTER_VIEW_H}"></canvas>
        <div class="sh-scoreboard" id="shScoreboard"></div>
        <div class="sh-hud" id="shHud"></div>
        ${amPlaying? `
          <div class="sh-joystick" id="shJoystick"><div class="sh-joystick-knob" id="shJoystickKnob"></div></div>
          ${SHOOTER_SKILLS[mine]? `<div class="sh-skillbtn" id="shSkillBtn">${SHOOTER_SKILLS[mine].icon}<div class="sh-skill-cd" id="shSkillCd"></div></div>` : ''}
        ` : `<div class="sh-spectate-tag">👀 旁观中</div>`}
        <div class="sh-topbtns">
          <button class="sh-exit-btn" id="shFullscreenBtn">⛶全屏</button>
          <button class="sh-exit-btn" id="shExitBtn">退出</button>
        </div>
      </div>
    </div>
  `;
  enableShooterBackGuard();
  document.getElementById('shExitBtn').onclick = ()=>{
    if(!confirm('确定要退出游戏吗？')) return;
    stopShooterLoop();
    state.funGame = null;
    renderFunTab(target);
  };
  document.getElementById('shFullscreenBtn').onclick = ()=>{
    const el = document.getElementById('shWrap');
    if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else alert('这台设备/浏览器不支持网页全屏（iPhone Safari 目前不支持），建议改用"添加到主屏幕"打开会更接近全屏效果。');
  };

  function checkRotate(){
    const hint = document.getElementById('shRotateHint');
    const stage = document.getElementById('shStage');
    if(!hint || !stage) return;
    const portrait = window.innerHeight > window.innerWidth;
    hint.style.display = portrait ? 'flex' : 'none';
    stage.style.display = portrait ? 'none' : 'block';
  }
  checkRotate();
  window.addEventListener('resize', checkRotate);

  // 初始化自己的实时状态
  const spawnPt = SHOOTER_SPAWN_POINTS[game.players.indexOf(mine) % SHOOTER_SPAWN_POINTS.length] || {x:1000,y:600};
  shooterMe = {
    x:spawnPt.x, y:spawnPt.y, angle:0, hp:5, ammo:24, alive:true, kills:0, respawnAt:0,
    skillReadyAt:0, killsSinceSkill:0, buffUntil:0, invisUntil:0, executeUntil:0, charmedUntil:0
  };
  shooterCollected = new Set();
  shooterGatlingUntil = 0;
  shooterBots = [];
  Object.keys(shooterMines).forEach(k=>delete shooterMines[k]);
  if(!game.boss) game.boss = { name:'毛兽', hp:60, maxHp:60, x:1000, y:600, alive:true, respawnAt:0 };

  joinShooterChannel((dmg, fromId)=>{
    if(!shooterMe || !shooterMe.alive) return;
    if(Date.now() < shooterMe.invisUntil) return; // 隐身无敌期间，什么伤害都不受
    let realDmg = dmg;
    if(Date.now() < shooterMe.buffUntil) realDmg = Math.max(1, dmg - 1); // 坤坤技能：加防御，少扣一点血
    shooterMe.hp -= realDmg;
    if(shooterMe.hp<=0){
      shooterMe.alive = false;
      shooterMe.respawnAt = Date.now() + 3000;
    }
  }, game, (botId, dmg)=>{
    const bot = shooterBots.find(b=>b.id===botId);
    if(bot){ bot.hp -= dmg; if(bot.hp<=0) shooterBots = shooterBots.filter(b=>b.id!==botId); }
  });

  // 阻止下拉刷新/缩放等系统手势在游戏区域内触发
  const stageEl = document.getElementById('shStage');
  stageEl.addEventListener('touchmove', ev=>{ ev.preventDefault(); }, { passive:false });

  // 摇杆
  let joyActive = false, joyDX = 0, joyDY = 0;
  if(amPlaying){
    const joy = document.getElementById('shJoystick');
    const knob = document.getElementById('shJoystickKnob');
    function joyMove(clientX, clientY){
      const rect = joy.getBoundingClientRect();
      const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
      let dx = clientX-cx, dy = clientY-cy;
      const dist = Math.min(Math.hypot(dx,dy), rect.width/2);
      const ang = Math.atan2(dy,dx);
      dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
      knob.style.transform = `translate(${dx}px,${dy}px)`;
      joyDX = dx/(rect.width/2); joyDY = dy/(rect.width/2);
    }
    function joyEnd(){ joyActive=false; joyDX=0; joyDY=0; knob.style.transform='translate(0,0)'; }
    joy.addEventListener('pointerdown', ev=>{ joyActive=true; joyMove(ev.clientX, ev.clientY); ev.preventDefault(); });
    window.addEventListener('pointermove', ev=>{ if(joyActive) joyMove(ev.clientX, ev.clientY); });
    window.addEventListener('pointerup', ()=>{ if(joyActive) joyEnd(); });

    // 自动开火：不用按键，角色朝着当前面向的方向持续自动射击；技能/加特林会影响伤害和射速
    function hasGatling(){ return Date.now() < shooterGatlingUntil; }
    function hasBuff(){ return Date.now() < shooterMe.buffUntil; } // 坤坤：加攻速+无限子弹
    function hasExecute(){ return Date.now() < shooterMe.executeUntil; } // 包菜：一击致命
    function isCharmed(){ return Date.now() < shooterMe.charmedUntil; } // 杉菜魅惑：不能开火
    function doFire(){
      if(!shooterMe || !shooterMe.alive || isCharmed()) return;
      if(!hasBuff() && shooterMe.ammo<=0) return;
      if(!hasBuff()) shooterMe.ammo--;
      let dmg = hasGatling() ? 3 : 1;
      if(hasExecute()) dmg = 99;
      const b = { x:shooterMe.x, y:shooterMe.y, angle:shooterMe.angle, ownerId:mine, remote:false, life:60, dmg };
      shooterBullets.push(b);
      if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'shot', payload:{ id:mine, x:b.x, y:b.y, angle:b.angle } });
    }
    function scheduleAutoFire(){
      doFire();
      const interval = (hasGatling()||hasBuff()) ? 120 : 350;
      shooterAutoFireTimer = setTimeout(scheduleAutoFire, interval);
    }
    scheduleAutoFire();

    // 技能按钮
    const skillBtn = document.getElementById('shSkillBtn');
    if(skillBtn){
      skillBtn.onclick = ()=> activateShooterSkill(game, mine);
    }
  }

  const canvas = document.getElementById('shCanvas');
  const ctx = canvas.getContext('2d');
  const imgCache = {};
  function getImg(src){
    if(!imgCache[src]){ const im = new Image(); im.src = src; imgCache[src]=im; }
    return imgCache[src];
  }

  let lastBroadcast = 0;
  let endedTriggered = false;

  function loop(){
    shooterRAF = requestAnimationFrame(loop);
    const now = Date.now();
    const charmed = shooterMe && now < shooterMe.charmedUntil;
    const buffed = shooterMe && now < shooterMe.buffUntil;

    if(amPlaying && shooterMe){
      if(!shooterMe.alive && now >= shooterMe.respawnAt){
        const pt = SHOOTER_SPAWN_POINTS[Math.floor(Math.random()*SHOOTER_SPAWN_POINTS.length)];
        shooterMe.x = pt.x; shooterMe.y = pt.y; shooterMe.hp = 5; shooterMe.alive = true;
        shooterMe.buffUntil = 0; shooterMe.invisUntil = 0; shooterMe.executeUntil = 0; shooterMe.charmedUntil = 0;
      }
      if(shooterMe.alive && !charmed && (joyDX||joyDY)){
        const speed = buffed ? 5.2 : 3.2; // 坤坤技能：加移速
        let nx = shooterMe.x + joyDX*speed, ny = shooterMe.y + joyDY*speed;
        nx = Math.max(16, Math.min(SHOOTER_W-16, nx));
        ny = Math.max(16, Math.min(SHOOTER_H-16, ny));
        const blocked = game.obstacles.some(o=> nx>o.x-16 && nx<o.x+o.w+16 && ny>o.y-16 && ny<o.y+o.h+16);
        if(!blocked){ shooterMe.x = nx; shooterMe.y = ny; }
        shooterMe.angle = Math.atan2(joyDY, joyDX);
      }
      // 捡资源
      if(shooterMe.alive){
        getActivePickups(game).forEach(p=>{
          if(shooterCollected.has(p.key)) return;
          if(Math.hypot(shooterMe.x-p.x, shooterMe.y-p.y) < 24){
            shooterCollected.add(p.key);
            if(p.type==='ammo') shooterMe.ammo = Math.min(40, shooterMe.ammo+12);
            else shooterMe.hp = Math.min(5, shooterMe.hp+2);
          }
        });
      }
      // 柜子羊的地雷：踩到别人埋的（非自己/非队友）直接死
      if(shooterMe.alive){
        for(const [mid, mn] of Object.entries(shooterMines)){
          if(String(mn.ownerId)===String(mine)) continue;
          if(game.mode==='team' && game.teams[mn.ownerId] && game.teams[mine] && game.teams[mn.ownerId]===game.teams[mine]) continue;
          if(Math.hypot(shooterMe.x-mn.x, shooterMe.y-mn.y) < 22){
            shooterMe.hp = 0; shooterMe.alive = false; shooterMe.respawnAt = now + 3000;
            delete shooterMines[mid];
            if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'mineTrigger', payload:{ id:mid } });
            break;
          }
        }
      }
      if(now-lastBroadcast > 100){
        lastBroadcast = now;
        if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'state', payload:{
          id: mine, x:shooterMe.x, y:shooterMe.y, angle:shooterMe.angle, hp:shooterMe.hp, ammo:shooterMe.ammo,
          alive:shooterMe.alive, kills:shooterMe.kills, name:getPersonById(mine).name, ts:now,
          invisible: now<shooterMe.invisUntil
        }});
      }
    }

    // 严格上帝：模拟自己召唤的3个人机分身（只有他自己的设备负责跑这段AI）
    if(shooterBots.length){
      shooterBots.forEach(bot=>{
        let nearest = null, nearestD = Infinity;
        Object.entries(shooterRemote).forEach(([rid,rp])=>{
          if(!rp.alive || rp.isBot) return;
          if(game.mode==='team' && game.teams[rid] && game.teams[mine] && game.teams[rid]===game.teams[mine]) return;
          const d = Math.hypot(bot.x-(rp.renderX??rp.x), bot.y-(rp.renderY??rp.y));
          if(d<nearestD){ nearestD=d; nearest=rp; }
        });
        if(nearest && nearestD < 420){
          const tx = nearest.renderX??nearest.x, ty = nearest.renderY??nearest.y;
          bot.angle = Math.atan2(ty-bot.y, tx-bot.x);
          if(nearestD > 60){ bot.x += Math.cos(bot.angle)*2; bot.y += Math.sin(bot.angle)*2; }
          if(now-bot.lastFire > 700){
            bot.lastFire = now;
            const bb = { x:bot.x, y:bot.y, angle:bot.angle, ownerId:bot.id, remote:false, life:60, dmg:1 };
            shooterBullets.push(bb);
            if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'shot', payload:{ id:bot.id, x:bb.x, y:bb.y, angle:bb.angle } });
          }
        }
        if(now-lastBroadcast > 100 && shooterChannel){
          shooterChannel.send({ type:'broadcast', event:'state', payload:{
            id:bot.id, x:bot.x, y:bot.y, angle:bot.angle, hp:bot.hp, ammo:0, alive:true, kills:0,
            name:'严格上帝的分身', ts:now, isBot:true
          }});
        }
      });
    }

    // 平滑插值：把每个人"上一条广播位置"到"最新广播位置"之间，按时间比例补出中间过程，
    // 不然每0.1秒才更新一次位置，看起来就会一顿一顿地瞬移
    const INTERP_MS = 130; // 略大于广播间隔(100ms)，让插值刚好覆盖到下一条消息抵达
    Object.values(shooterRemote).forEach(rp=>{
      const t = Math.min(1, (now - rp.recvTs) / INTERP_MS);
      rp.renderX = rp.prevX + (rp.targetX - rp.prevX) * t;
      rp.renderY = rp.prevY + (rp.targetY - rp.prevY) * t;
      rp.renderAngle = rp.prevAngle + (rp.targetAngle - rp.prevAngle) * t;
    });

    // 子弹运动 + 命中判定（子弹主人自己判定命中——包括自己召唤的分身打出的子弹）
    for(let i=shooterBullets.length-1;i>=0;i--){
      const b = shooterBullets[i];
      b.x += Math.cos(b.angle)*8; b.y += Math.sin(b.angle)*8; b.life--;
      const outOfBounds = b.x<0||b.x>SHOOTER_W||b.y<0||b.y>SHOOTER_H;
      const hitObstacle = game.obstacles.some(o=> b.x>o.x && b.x<o.x+o.w && b.y>o.y && b.y<o.y+o.h);
      if(outOfBounds || hitObstacle || b.life<=0){ shooterBullets.splice(i,1); continue; }
      const isMine = !b.remote && String(b.ownerId)===String(mine);
      const isMyBot = !b.remote && shooterBots.some(bot=>bot.id===b.ownerId);
      if(isMine || isMyBot){
        let consumed = false;
        for(const [rid, rp] of Object.entries(shooterRemote)){
          if(!rp.alive || String(rid)===String(b.ownerId)) continue;
          if(rp.isBot && String(rid).indexOf(String(mine)+'_bot')===0) continue; // 不打自己的分身
          if(game.mode==='team' && game.teams[rid] && game.teams[mine] && game.teams[rid]===game.teams[mine]) continue;
          if(Math.hypot(b.x-(rp.renderX??rp.x), b.y-(rp.renderY??rp.y)) < 18){
            if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'hit', payload:{ targetId:rid, dmg:b.dmg||1 } });
            if(isMine){
              shooterMe.kills = (shooterMe.kills||0)+1;
              shooterMe.killsSinceSkill = (shooterMe.killsSinceSkill||0)+1;
              if(shooterMe.killsSinceSkill >= SHOOTER_SKILL_KILL_REFRESH){
                shooterMe.skillReadyAt = now; shooterMe.killsSinceSkill = 0;
              }
            }
            shooterBullets.splice(i,1);
            consumed = true;
            break;
          }
        }
        if(!consumed && isMine && game.boss && game.boss.alive && Math.hypot(b.x-game.boss.x, b.y-game.boss.y) < 26){
          if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'bossHit', payload:{ dmg:b.dmg||1, from:mine } });
          shooterBullets.splice(i,1);
        }
      }
    }

    // 房主负责毛兽的复活判定
    if(String(mine)===String(game.hostId) && game.boss && !game.boss.alive && now >= game.boss.respawnAt){
      game.boss.alive = true; game.boss.hp = game.boss.maxHp;
      if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'bossState', payload:{ hp:game.boss.hp, alive:true, respawnAt:0 } });
    }

    // 镜头：跟着自己走；旁观的人镜头固定在地图中心
    const camCenterX = (amPlaying && shooterMe) ? shooterMe.x : SHOOTER_W/2;
    const camCenterY = (amPlaying && shooterMe) ? shooterMe.y : SHOOTER_H/2;
    const camX = Math.max(0, Math.min(SHOOTER_W-SHOOTER_VIEW_W, camCenterX - SHOOTER_VIEW_W/2));
    const camY = Math.max(0, Math.min(SHOOTER_H-SHOOTER_VIEW_H, camCenterY - SHOOTER_VIEW_H/2));
    const inFog = (wx,wy)=>{
      if(!(amPlaying && shooterMe)) return false; // 旁观的人不受雾区限制
      return Math.hypot(wx-shooterMe.x, wy-shooterMe.y) > SHOOTER_FOG_RADIUS;
    };

    // 画面
    ctx.clearRect(0,0,SHOOTER_VIEW_W,SHOOTER_VIEW_H);
    ctx.fillStyle = '#E8EFE0';
    ctx.fillRect(0,0,SHOOTER_VIEW_W,SHOOTER_VIEW_H);
    game.obstacles.forEach(o=>{
      if(inFog(o.x+o.w/2, o.y+o.h/2)) return;
      ctx.fillStyle = '#8A7A5C'; ctx.fillRect(o.x-camX,o.y-camY,o.w,o.h);
    });
    getActivePickups(game).forEach(p=>{
      if(shooterCollected.has(p.key) || inFog(p.x,p.y)) return;
      ctx.font = '22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.type==='ammo'?'🔫':'❤️', p.x-camX, p.y-camY);
    });
    // 柜子羊的地雷：只有自己/队友能看见
    Object.values(shooterMines).forEach(mn=>{
      const canSee = String(mn.ownerId)===String(mine) || (game.mode==='team' && game.teams[mn.ownerId] && game.teams[mine] && game.teams[mn.ownerId]===game.teams[mine]);
      if(!canSee) return;
      ctx.font = '20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('💣', mn.x-camX, mn.y-camY);
    });
    // 毛兽（作为地图上的重要目标，不受雾区遮挡）
    if(game.boss && game.boss.alive){
      ctx.font = '40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🐻', game.boss.x-camX, game.boss.y-camY);
      ctx.fillStyle = '#223328'; ctx.font='11px sans-serif';
      ctx.fillText(game.boss.name||'毛兽', game.boss.x-camX, game.boss.y-30-camY);
      ctx.fillStyle = '#ddd'; ctx.fillRect(game.boss.x-30-camX, game.boss.y+26-camY, 60, 6);
      ctx.fillStyle = '#8B2E1F'; ctx.fillRect(game.boss.x-30-camX, game.boss.y+26-camY, 60*Math.max(0,game.boss.hp)/game.boss.maxHp, 6);
    }else if(game.boss){
      const remainS = Math.max(0, Math.ceil((game.boss.respawnAt-now)/1000));
      ctx.fillStyle = 'rgba(34,51,40,.5)'; ctx.font='13px sans-serif'; ctx.textAlign='center';
      ctx.fillText(`毛兽 ${remainS}秒后刷新`, game.boss.x-camX, game.boss.y-camY);
    }
    shooterBullets.forEach(b=>{
      if(inFog(b.x,b.y)) return;
      ctx.fillStyle = b.dmg>1? '#B4553F' : '#E2A33D'; ctx.beginPath(); ctx.arc(b.x-camX,b.y-camY,b.dmg>1?6:4,0,Math.PI*2); ctx.fill();
    });

    function drawPlayer(pid, st){
      if(!st) return;
      if(st.invisible && String(pid)!==String(mine)) return; // 小鱼技能：别人看不见她（子弹轨迹上面已经照常画了）
      const px = st.renderX!==undefined ? st.renderX : st.x;
      const py = st.renderY!==undefined ? st.renderY : st.y;
      if(inFog(px,py) && String(pid)!==String(mine)) return; // 雾区外的人看不见
      const sx = px-camX, sy = py-camY;
      const teamColor = game.mode==='team' && game.teams[pid] ? SHOOTER_TEAM_COLOR[game.teams[pid]] : null;
      ctx.save();
      ctx.globalAlpha = st.alive===false ? 0.3 : (st.invisible?0.4:1);
      const avatar = shooterAvatarSrc(pid);
      if(avatar && !st.isBot){
        const im = getImg(avatar);
        if(im.complete && im.naturalWidth){
          ctx.save();
          ctx.beginPath(); ctx.arc(sx, sy, 18, 0, Math.PI*2); ctx.clip();
          ctx.drawImage(im, sx-18, sy-18, 36, 36);
          ctx.restore();
        }
      }else{
        ctx.fillStyle = st.isBot ? '#9B7BA6' : (teamColor || '#4C7A5E');
        ctx.beginPath(); ctx.arc(sx, sy, st.isBot?13:18, 0, Math.PI*2); ctx.fill();
      }
      ctx.strokeStyle = teamColor || '#223328'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, st.isBot?13:18, 0, Math.PI*2); ctx.stroke();
      if(String(pid)===String(mine) && now<shooterGatlingUntil){
        ctx.strokeStyle = '#E2A33D'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(sx, sy, 21, 0, Math.PI*2); ctx.stroke();
      }
      if(String(pid)===String(mine) && buffed){
        ctx.strokeStyle = '#4F6D9C'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(sx, sy, 23, 0, Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle = '#223328'; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText(st.isBot? '分身' : getPersonById(pid).name, sx, sy-(st.isBot?20:26));
      // 血条
      const maxHp = st.isBot? 3 : 5;
      ctx.fillStyle = '#ddd'; ctx.fillRect(sx-16, sy+22, 32, 4);
      ctx.fillStyle = '#B4553F'; ctx.fillRect(sx-16, sy+22, 32*Math.max(0,(st.hp||0))/maxHp, 4);
      ctx.restore();
    }
    Object.entries(shooterRemote).forEach(([rid,rp])=>{ if(now-rp.ts < 4000) drawPlayer(rid, rp); });
    if(amPlaying && shooterMe) drawPlayer(mine, shooterMe);
    shooterBots.forEach(bot=> drawPlayer(bot.id, {x:bot.x,y:bot.y,hp:bot.hp,alive:true,isBot:true}));

    // 顶部记分榜：所有真人（不含分身）的血量/子弹/击杀
    const scoreboard = document.getElementById('shScoreboard');
    if(scoreboard){
      const rows = game.players.map(pid=>{
        let st;
        if(String(pid)===String(mine)) st = shooterMe;
        else st = shooterRemote[pid];
        const teamColor = game.mode==='team' && game.teams[pid] ? SHOOTER_TEAM_COLOR[game.teams[pid]] : (isGuestIdentity(pid)?'var(--amber)':getPersonColor(pid));
        const name = getPersonById(pid).name;
        if(!st) return `<div class="sh-sb-item" style="border-color:${teamColor}"><b>${name}</b></div>`;
        return `<div class="sh-sb-item ${st.alive===false?'sh-sb-dead':''}" style="border-color:${teamColor}"><b>${name}</b>❤️${st.hp??'-'} 🔫${st.ammo??'-'} 🏆${st.kills||0}</div>`;
      }).join('');
      scoreboard.innerHTML = rows;
    }

    // HUD
    const hud = document.getElementById('shHud');
    if(hud){
      const remain = Math.max(0, game.duration - (now-game.startedAt));
      const mm = Math.floor(remain/60000), ss = Math.floor((remain%60000)/1000);
      let scoreHtml = '';
      if(amPlaying && shooterMe){
        const tags = [];
        if(now<shooterGatlingUntil) tags.push(`🔥加特林${Math.ceil((shooterGatlingUntil-now)/1000)}s`);
        if(buffed) tags.push(`⚡强化${Math.ceil((shooterMe.buffUntil-now)/1000)}s`);
        if(now<shooterMe.invisUntil) tags.push(`👻隐身${Math.ceil((shooterMe.invisUntil-now)/1000)}s`);
        if(now<shooterMe.executeUntil) tags.push(`💀处决${Math.ceil((shooterMe.executeUntil-now)/1000)}s`);
        if(charmed) tags.push(`💫被魅惑${Math.ceil((shooterMe.charmedUntil-now)/1000)}s`);
        scoreHtml = `❤️${shooterMe.hp} · 🔫${shooterMe.ammo} · 🏆${shooterMe.kills||0}${tags.length? ' · '+tags.join(' · '):''}`;
      }
      hud.innerHTML = `<div class="sh-timer">${mm}:${String(ss).padStart(2,'0')}</div><div class="sh-score">${scoreHtml}</div>`;
      if(remain<=0 && !endedTriggered){
        endedTriggered = true;
        finishShooterGame(game);
      }
    }
    // 技能冷却按钮
    const skillCd = document.getElementById('shSkillCd');
    if(skillCd && shooterMe){
      const remainCd = Math.max(0, shooterMe.skillReadyAt-now);
      if(remainCd>0){
        skillCd.style.display='flex';
        skillCd.textContent = Math.ceil(remainCd/1000);
      }else{
        skillCd.style.display='none';
      }
    }
  }
  loop();
}

function stopShooterLoop(){
  if(shooterRAF){ cancelAnimationFrame(shooterRAF); shooterRAF = null; }
  if(shooterAutoFireTimer){ clearTimeout(shooterAutoFireTimer); shooterAutoFireTimer = null; }
  leaveShooterChannel();
  disableShooterBackGuard();
  shooterMe = null;
}

async function finishShooterGame(game){
  // 结算：把自己知道的击杀数广播/记录一下，房主负责把结果写进共享数据结束这一局
  const myKills = shooterMe ? (shooterMe.kills||0) : 0;
  game.tallies = game.tallies || {};
  game.tallies[state.identity] = myKills;
  if(String(state.identity) === String(game.hostId)){
    setTimeout(async ()=>{
      game.status = 'ended';
      game.lastResult = game.tallies;
      await queueSave();
    }, 1500); // 稍微等一下，让其他人的最后战绩有机会广播过来（这里简化为直接用房主自己记录到的）
  }
}

function renderShooterEnded(target, game){
  stopShooterLoop();
  const tallies = game.lastResult || game.tallies || {};
  const rows = game.players.map(pid=>({ pid, kills: tallies[pid]||0 })).sort((a,b)=>b.kills-a.kills);
  let teamScoreHtml = '';
  if(game.mode==='team'){
    const teamTotals = { red:0, blue:0 };
    rows.forEach(r=>{ const t = game.teams[r.pid]; if(t) teamTotals[t] += r.kills; });
    teamScoreHtml = `<div class="banner">🔴 红队 ${teamTotals.red} 分　🔵 蓝队 ${teamTotals.blue} 分　—　${teamTotals.red===teamTotals.blue? '平局！' : (teamTotals.red>teamTotals.blue?'红队获胜！':'蓝队获胜！')}</div>`;
  }
  target.innerHTML = `
    <button class="back-link" id="backToGames">← 返回娱乐吧</button>
    <div class="section-head"><h2>🔫 枪战对决 · 结算</h2></div>
    ${teamScoreHtml}
    <div class="uc-reveal-list">
      ${rows.map(r=>{
        const p = getPersonById(r.pid);
        const team = game.teams[r.pid];
        return `<div class="uc-reveal-row">
          <div class="uc-avatar" style="background:${team?SHOOTER_TEAM_COLOR[team]:(isGuestIdentity(r.pid)?'var(--amber)':getPersonColor(r.pid))};">${p.name[0]||''}</div>
          <div class="uc-reveal-name">${escapeHtml(p.name)}</div>
          <div class="uc-reveal-role">🏆 ${r.kills} 击杀</div>
        </div>`;
      }).join('')}
    </div>
    <div class="panel-actions" style="margin-top:18px;"><button class="btn btn-primary" id="shNewGameBtn" style="flex:1;">开始新一局</button></div>
  `;
  document.getElementById('backToGames').onclick = ()=>{ state.funGame = null; renderFunTab(target); };
  document.getElementById('shNewGameBtn').onclick = async ()=>{
    state.shooterGame = { status:'lobby', players:[], mode:'solo', teams:{}, hostId:null, startedAt:null, duration:180000, obstacles:[], lastResult:null };
    await queueSave();
    renderShooterGame(target);
  };
}

function renderTripCalendar(){
  const cfg = getTripConfig();
  const {y,m} = MONTHS[state.activeMonth];
  const card = document.getElementById('calCard');
  const firstDow = (new Date(y,m,1).getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const items = state[cfg.key] || [];
  let html = `<div class="cal-month">${MONTHS[state.activeMonth].label} ${y}</div><div class="cal-grid">`;
  DOW.forEach(d=> html += `<div class="cal-dow">周${d}</div>`);
  for(let i=0;i<firstDow;i++) html += `<div class="cal-cell pad"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = dateKey(y,m,d);
    const isToday = sameDate(new Date(y,m,d), TODAY);
    const dayItems = items.filter(mt=>mt.date===key);
    let cls = 'cal-cell' + (isToday?' today':'');
    html += `<div class="${cls}" data-key="${key}"><div class="cal-date">${d}</div>`;
    if(dayItems.length){
      html += `<div style="font-size:10px;color:var(--leaf);margin-top:6px;font-weight:600;">${dayItems.length}场${cfg.label}</div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  card.innerHTML = html;
  card.querySelectorAll('.cal-cell:not(.pad)').forEach(cell=>{
    cell.onclick = ()=> openTripDayPanel(cell.dataset.key);
  });
}

      await queueSave();
      closePanel(); renderTripCalendar(); renderTripListForMonth();
    };
  });
  panel.querySelectorAll('.trip-photo-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('删除这张照片吗？')) return;
      const mt = (state[cfg.key]||[]).find(x=>x.id===b.dataset.mt);
      if(mt) mt.photos = (mt.photos||[]).filter(p=>p.id!==b.dataset.pid);
      await queueSave();
      openTripDayPanel(key);
      renderTripListForMonth();
    };
  });
  panel.querySelectorAll('.trip-photo-input').forEach(inp=>{
    inp.addEventListener('change', async (ev)=>{
      const file = ev.target.files[0];
      if(!file) return;
      try{

        const mt = (state[cfg.key]||[]).find(x=>x.id===inp.dataset.mt);
        if(mt){
          mt.photos = mt.photos || [];

        await queueSave();
        openTripDayPanel(key);

  });

function allWeekdayKeysUpToToday(){
  const keys = [];
  MONTHS.forEach(({y,m})=>{
    if(!isCheckinMonth(m)) return; // 打卡统计只算暑期七八月，其他月份不参与
    const days = new Date(y,m+1,0).getDate();
    for(let d=1; d<=days; d++){
      const dt = new Date(y,m,d);
      if(dt <= TODAY) keys.push(dateKey(y,m,d));
    }
  });
  return keys;
}

function totalCheckinCount(idx){
  const pastKeys = allWeekdayKeysUpToToday();
  let total = 0;
  pastKeys.forEach(k=>{ if(getEntries(k)[idx].checked) total++; });
  return total;
}

/* ---- 冰冻药剂：连续打卡7天自动获得一个，缺卡时自动用来保住连续天数 ---- */
function getFreezeTokenCount(idx){
  return state.freezeTokens[idx] !== undefined ? state.freezeTokens[idx] : 3;
}

/* 取消打卡时如果这天正好是被冰冻药剂保护的，主动解除保护并退还药剂，
   保证"取消"这个动作永远是确定生效的，不会被自动冰冻逻辑悄悄覆盖回去 */
function unfreezeIfNeeded(idx, key, nowChecked){
  if(nowChecked) return;
  state.frozenDays[idx] = state.frozenDays[idx] || [];
  const pos = state.frozenDays[idx].indexOf(key);
  if(pos>=0){
    state.frozenDays[idx].splice(pos,1);
    state.freezeTokens[idx] = getFreezeTokenCount(idx) + 1;
  }
}

function computeStreakInfo(idx){
  const pastKeys = allWeekdayKeysUpToToday(); // 已按日期升序排列，到今天为止
  const todayKey = dateKey(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  state.frozenDays[idx] = state.frozenDays[idx] || [];
  if(state.freezeTokens[idx] === undefined) state.freezeTokens[idx] = 3;
  let changed = false;

  // 真实连续打卡天数（不算冰冻），用来判断要不要发新的冰冻药剂
  let raw = 0, rawBroken = false;
  for(let k=pastKeys.length-1;k>=0;k--){
    const e = getEntries(pastKeys[k])[idx];
    if(!rawBroken){
      if(e.checked) raw++;
      else rawBroken = true;
    }else break;
  }
  const mark = state.freezeAwardMark[idx] || 0;
  if(raw>0 && raw % 7 === 0 && raw > mark){
    state.freezeTokens[idx] = getFreezeTokenCount(idx) + 1;
    state.freezeAwardMark[idx] = raw;
    changed = true;
  }

  // 冰冻保护后的连续天数（用来展示"连续N天"，缺卡时如果还有药剂会自动消耗保住streak）
  let streak = 0, streakBroken = false;
  for(let k=pastKeys.length-1;k>=0;k--){
    if(streakBroken) break;
    const key = pastKeys[k];
    const e = getEntries(key)[idx];
    if(e.checked){
      streak++;
    }else if(key === todayKey){
      // 今天还没"过完"，缺卡也不自动冰冻——不然刚点完"取消打卡"，
      // 下一次渲染立刻又被冰冻药剂保护回去，看起来就像取消不掉一样
      streakBroken = true;
    }else if(state.frozenDays[idx].includes(key)){
      streak++;
    }else if(getFreezeTokenCount(idx) > 0){
      state.frozenDays[idx].push(key);
      state.freezeTokens[idx] = getFreezeTokenCount(idx) - 1;
      changed = true;
      streak++;
    }else{
      streakBroken = true;
    }
  }

  return { streak, tokens: getFreezeTokenCount(idx), changed };
}

/* ---- 打卡徽章：里程碑成就，一旦拿到就永久保留，不会因为后来断卡掉 ---- */
const BADGE_DEFS = [
  { id:'total10',  type:'total',  value:10, icon:'🌱', label:'新手上路' },
  { id:'streak7',  type:'streak', value:7,  icon:'🔥', label:'小有恒心' },
  { id:'streak14', type:'streak', value:14, icon:'⚡', label:'越战越勇' },
  { id:'total50',  type:'total',  value:50, icon:'🎯', label:'百炼成钢' },
  { id:'streak30', type:'streak', value:30, icon:'🌟', label:'坚持达人' },
  { id:'total100', type:'total',  value:100,icon:'🏆', label:'传奇练习生' },
  { id:'streak50', type:'streak', value:50, icon:'👑', label:'练习之王' }
];
function computeMaxStreakEver(idx){
  const keys = allWeekdayKeysUpToToday(); // 升序，从早到今天
  let run = 0, max = 0;
  keys.forEach(k=>{
    const e = getEntries(k)[idx];
    const frozen = (state.frozenDays[idx]||[]).includes(k);
    if(e.checked || frozen){ run++; if(run>max) max = run; }
    else{ run = 0; }
  });
  return max;
}
function getEarnedBadges(idx){
  const maxStreak = computeMaxStreakEver(idx);
  const total = totalCheckinCount(idx);
  return BADGE_DEFS.map(b=>({
    ...b,
    earned: b.type==='streak' ? maxStreak>=b.value : total>=b.value
  }));
}
function renderBadgeWall(idx){
  const badges = getEarnedBadges(idx);
  return `<div class="badge-wall">
    ${badges.map(b=>`<div class="badge-chip ${b.earned?'earned':'locked'}" title="${b.type==='streak'? '最长连续打卡 '+b.value+' 天' : '累计打卡 '+b.value+' 次'}">
      <div class="badge-icon">${b.earned? b.icon : '🔒'}</div>
      <div class="badge-label">${b.label}</div>
    </div>`).join('')}
  </div>`;
}

function renderJournal(){
  const body = document.getElementById('journalBody');
  const pastKeys = allWeekdayKeysUpToToday();
  let html = '';
  let anyChanged = false;
  state.members.forEach((mem,i)=>{
    let total = 0;
    pastKeys.forEach(k=>{ if(getEntries(k)[i].checked) total++; });
    const info = computeStreakInfo(i);
    if(info.changed) anyChanged = true;
    html += `<div class="vine-row">
      <div class="vine-id">
        <div class="vine-name" style="color:${getPersonColor(i)}">${mem.name}</div>
        <div class="vine-inst">${mem.instrument}</div>
        <div class="vine-stats"><b>${total}</b> 次 · 连续 <b>${info.streak}</b> 天 · 🧊×${info.tokens}</div>
      </div>
      <div class="stem-wrap"><div class="stem">`;
    MONTHS.filter(({m})=>isCheckinMonth(m)).forEach(({y,m})=>{
      const days = new Date(y,m+1,0).getDate();
      for(let d=1; d<=days; d++){
        const dt = new Date(y,m,d);
        const key = dateKey(y,m,d);
        if(dt > TODAY){ html += `<div class="leaf future" title="${key}"></div>`; }
        else{
          const e = getEntries(key)[i];
          const frozen = !e.checked && (state.frozenDays[i]||[]).includes(key);
          const proxied = e.checked && e.proxied;
          const cls = e.checked? ('filled' + (proxied?' proxied':'')) : (frozen? 'frozen' : '');
          const bg = e.checked? 'background:'+getPersonColor(i)+';' : '';
          html += `<div class="leaf ${cls}" style="${bg}" title="${key}${e.note?' · '+e.note:''}${frozen?'（用冰冻药剂保护）':''}${proxied?'（管理员代打卡）':''}"></div>`;
        }
      }
    });
    html += `</div></div></div>`;
  });
  body.innerHTML = html;
  if(anyChanged) queueSave(); // 新发放或消耗了冰冻药剂，同步保存
}
