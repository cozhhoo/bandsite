function joinShooterChannel(onHit, game, onBotHit){
  if(shooterChannel) return;
  shooterChannel = supabaseClient.channel('band-shooter-live', { config:{ broadcast:{ self:false } } });
  shooterChannel.on('broadcast', {event:'state'}, (msg)=>{
    const p = msg.payload;
    const existing = shooterRemote[p.id];
    const fromX = existing && existing.renderX!==undefined ? existing.renderX : p.x;
    const fromY = existing && existing.renderY!==undefined ? existing.renderY : p.y;
    const fromAngle = existing && existing.renderAngle!==undefined ? existing.renderAngle : p.angle;
    shooterRemote[p.id] = Object.assign({}, p, {
      prevX: fromX, prevY: fromY, prevAngle: fromAngle,
      targetX: p.x, targetY: p.y, targetAngle: p.angle,
      renderX: fromX, renderY: fromY, renderAngle: fromAngle,
      recvTs: Date.now()
    });
  });
  shooterChannel.on('broadcast', {event:'shot'}, (msg)=>{
    shooterBullets.push({ x:msg.payload.x, y:msg.payload.y, angle:msg.payload.angle, ownerId:msg.payload.id, remote:true, life:60 });
  });
  shooterChannel.on('broadcast', {event:'hit'}, (msg)=>{
    const targetId = msg.payload.targetId;
    if(String(targetId)===String(state.identity)){ onHit(msg.payload.dmg, msg.payload.from); return; }
    if(typeof targetId==='string' && targetId.indexOf(String(state.identity)+'_bot')===0){ onBotHit(targetId, msg.payload.dmg); }
  });
  // 毛兽血量只有房主的设备说了算，其他人只广播"我打了它一下"，房主扣血后把最新状态广播回来
  shooterChannel.on('broadcast', {event:'bossHit'}, (msg)=>{
    if(String(state.identity) !== String(game.hostId)) return;
    if(!game.boss || !game.boss.alive) return;
    game.boss.hp = Math.max(0, game.boss.hp - msg.payload.dmg);
    if(game.boss.hp <= 0){
      game.boss.alive = false;
      game.boss.respawnAt = Date.now() + SHOOTER_BOSS_RESPAWN_MS;
      shooterChannel.send({ type:'broadcast', event:'gatling', payload:{ targetId: msg.payload.from, until: Date.now()+SHOOTER_GATLING_DURATION } });
    }
    shooterChannel.send({ type:'broadcast', event:'bossState', payload:{ hp:game.boss.hp, alive:game.boss.alive, respawnAt:game.boss.respawnAt } });
  });
  shooterChannel.on('broadcast', {event:'bossState'}, (msg)=>{
    if(!game.boss) game.boss = { name:'毛兽', hp:60, maxHp:60, x:1000, y:600, alive:true, respawnAt:0 };
    Object.assign(game.boss, msg.payload);
  });
  shooterChannel.on('broadcast', {event:'gatling'}, (msg)=>{
    if(String(msg.payload.targetId)===String(state.identity)) shooterGatlingUntil = msg.payload.until;
  });
  // 柜子羊的地雷：放置和触发都靠广播同步，谁能看见由渲染那边按"自己人"过滤
  shooterChannel.on('broadcast', {event:'mine'}, (msg)=>{
    shooterMines[msg.payload.id] = { x:msg.payload.x, y:msg.payload.y, ownerId:msg.payload.ownerId };
  });
  shooterChannel.on('broadcast', {event:'mineTrigger'}, (msg)=>{
    delete shooterMines[msg.payload.id];
  });
  // 杉菜的魅惑：范围内的每个人自己判断在不在圈里，在的话就把自己定住
  shooterChannel.on('broadcast', {event:'charm'}, (msg)=>{
    if(!shooterMe || !shooterMe.alive) return;
    if(game.mode==='team' && game.teams[msg.payload.from] && game.teams[state.identity] && game.teams[msg.payload.from]===game.teams[state.identity]) return;
    if(Math.hypot(shooterMe.x-msg.payload.x, shooterMe.y-msg.payload.y) < msg.payload.radius){
      shooterMe.charmedUntil = Date.now() + msg.payload.duration;
    }
  });
  shooterChannel.subscribe();
}
function leaveShooterChannel(){
  if(shooterChannel){ try{ shooterChannel.unsubscribe(); }catch(e){} shooterChannel = null; }
  Object.keys(shooterRemote).forEach(k=>delete shooterRemote[k]);
  Object.keys(shooterMines).forEach(k=>delete shooterMines[k]);
  shooterBullets.length = 0;
  shooterGatlingUntil = 0;
  shooterBots = [];
}

/* ---- 防误触：拦截手机的"边缘滑动返回"手势，改成弹窗确认退出 ---- */
function shooterPopstateHandler(){
  if(!shooterBackGuardActive) return;
  const wantExit = confirm('确定要退出游戏吗？');
  if(wantExit){
    disableShooterBackGuard();
    stopShooterLoop();
    state.funGame = null;
    renderFunTab(document.getElementById('tabContent'));
  }else{
    history.pushState({shooterGuard:true}, '');
  }
}
function enableShooterBackGuard(){
  if(shooterBackGuardActive) return;
  shooterBackGuardActive = true;
  try{ history.pushState({shooterGuard:true}, ''); }catch(e){}
  window.addEventListener('popstate', shooterPopstateHandler);
}
function disableShooterBackGuard(){
  if(!shooterBackGuardActive) return;
  shooterBackGuardActive = false;
  window.removeEventListener('popstate', shooterPopstateHandler);
}

/* 六个角色各自的技能效果。除了坤坤/小鱼(15秒)是原话给出的数字，
   杉菜(范围140/持续5秒)、包菜(持续5秒)是我自己定的默认值，原话没给具体数字 */
function activateShooterSkill(game, mine){
  if(!shooterMe || !shooterMe.alive) return;
  const now = Date.now();
  if(now < shooterMe.skillReadyAt) return; // 冷却中，按钮上也会显示倒计时
  if(isGuestIdentity(mine) || !SHOOTER_SKILLS[mine]) return; // 游客暂时没有专属技能

  switch(mine){
    case 0: // 坤坤：加防御+加攻速+加移速+无限子弹，15秒
      shooterMe.buffUntil = now + 15000;
      break;
    case 1: // 小鱼：15秒无敌+隐身，别人看不见她，只看得到她的子弹
      shooterMe.invisUntil = now + 15000;
      break;
    case 2: // 杉菜：以自己为圆心魅惑周围敌人，让他们没法行动
      if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'charm', payload:{ from:mine, x:shooterMe.x, y:shooterMe.y, radius:140, duration:5000 } });
      break;
    case 3: // 包菜：接下来一段时间内，打中敌人直接一击致命
      shooterMe.executeUntil = now + 5000;
      break;
    case 4: { // 柜子羊：在脚下埋一颗地雷，同时最多3颗
      const mineCountOfMine = Object.values(shooterMines).filter(m=>String(m.ownerId)===String(mine)).length;
      if(mineCountOfMine >= 3){ alert('地雷已经埋满3颗了，等它们被踩到或者退出重进'); return; }
      const mineId = mine+'_mine_'+now;
      shooterMines[mineId] = { x:shooterMe.x, y:shooterMe.y, ownerId:mine };
      if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'mine', payload:{ id:mineId, x:shooterMe.x, y:shooterMe.y, ownerId:mine } });
      break;
    }
    case 5: // 严格上帝：召唤3个人机分身，帮忙攻击敌人（伤害很弱）
      shooterBots = [0,1,2].map(i=>({ id: mine+'_bot'+i, x: shooterMe.x+(i-1)*30, y: shooterMe.y+30, hp:3, angle:0, lastFire:0 }));
      break;
  }
  shooterMe.skillReadyAt = now + SHOOTER_SKILL_COOLDOWN;
  shooterMe.killsSinceSkill = 0;
}

function renderShooterPlaying(target, game){
  const mine = state.identity;
  const amPlaying = game.players.some(p=>String(p)===String(mine));
  target.innerHTML = `
    <div class="sh-wrap" id="shWrap">
      <div class="sh-rotate-hint" id="shRotateHint">📱 请把手机横过来玩</div>
      <div class="sh-stage" id="shStage">
        <canvas id="shCanvas" width="${SHOOTER_VIEW_W}" height="${SHOOTER_VIEW_H}"></canvas>
        <div class="sh-scoreboard" id="shScoreboard"></div>
        <div class="sh-hud" id="shHud"></div>
        ${amPlaying? `
          <div class="sh-joystick" id="shJoystick"><div class="sh-joystick-knob" id="shJoystickKnob"></div></div>
          ${SHOOTER_SKILLS[mine]? `<div class="sh-skillbtn" id="shSkillBtn">${SHOOTER_SKILLS[mine].icon}<div class="sh-skill-cd" id="shSkillCd"></div></div>` : ''}
        ` : `<div class="sh-spectate-tag">👀 旁观中</div>`}
        <div class="sh-topbtns">
          <button class="sh-exit-btn" id="shFullscreenBtn">⛶全屏</button>
          <button class="sh-exit-btn" id="shExitBtn">退出</button>
        </div>
      </div>
    </div>
  `;
  enableShooterBackGuard();
  document.getElementById('shExitBtn').onclick = ()=>{
    if(!confirm('确定要退出游戏吗？')) return;
    stopShooterLoop();
    state.funGame = null;
    renderFunTab(target);
  };
  document.getElementById('shFullscreenBtn').onclick = ()=>{
    const el = document.getElementById('shWrap');
    if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else alert('这台设备/浏览器不支持网页全屏（iPhone Safari 目前不支持），建议改用"添加到主屏幕"打开会更接近全屏效果。');
  };

  function checkRotate(){
    const hint = document.getElementById('shRotateHint');
    const stage = document.getElementById('shStage');
    if(!hint || !stage) return;
    const portrait = window.innerHeight > window.innerWidth;
    hint.style.display = portrait ? 'flex' : 'none';
    stage.style.display = portrait ? 'none' : 'block';
  }
  checkRotate();
  window.addEventListener('resize', checkRotate);

  // 初始化自己的实时状态
  const spawnPt = SHOOTER_SPAWN_POINTS[game.players.indexOf(mine) % SHOOTER_SPAWN_POINTS.length] || {x:1000,y:600};
  shooterMe = {
    x:spawnPt.x, y:spawnPt.y, angle:0, hp:5, ammo:24, alive:true, kills:0, respawnAt:0,
    skillReadyAt:0, killsSinceSkill:0, buffUntil:0, invisUntil:0, executeUntil:0, charmedUntil:0
  };
  shooterCollected = new Set();
  shooterGatlingUntil = 0;
  shooterBots = [];
  Object.keys(shooterMines).forEach(k=>delete shooterMines[k]);
  if(!game.boss) game.boss = { name:'毛兽', hp:60, maxHp:60, x:1000, y:600, alive:true, respawnAt:0 };

  joinShooterChannel((dmg, fromId)=>{
    if(!shooterMe || !shooterMe.alive) return;
    if(Date.now() < shooterMe.invisUntil) return; // 隐身无敌期间，什么伤害都不受
    let realDmg = dmg;
    if(Date.now() < shooterMe.buffUntil) realDmg = Math.max(1, dmg - 1); // 坤坤技能：加防御，少扣一点血
    shooterMe.hp -= realDmg;
    if(shooterMe.hp<=0){
      shooterMe.alive = false;
      shooterMe.respawnAt = Date.now() + 3000;
    }
  }, game, (botId, dmg)=>{
    const bot = shooterBots.find(b=>b.id===botId);
    if(bot){ bot.hp -= dmg; if(bot.hp<=0) shooterBots = shooterBots.filter(b=>b.id!==botId); }
  });

  // 阻止下拉刷新/缩放等系统手势在游戏区域内触发
  const stageEl = document.getElementById('shStage');
  stageEl.addEventListener('touchmove', ev=>{ ev.preventDefault(); }, { passive:false });

  // 摇杆
  let joyActive = false, joyDX = 0, joyDY = 0;
  if(amPlaying){
    const joy = document.getElementById('shJoystick');
    const knob = document.getElementById('shJoystickKnob');
    function joyMove(clientX, clientY){
      const rect = joy.getBoundingClientRect();
      const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
      let dx = clientX-cx, dy = clientY-cy;
      const dist = Math.min(Math.hypot(dx,dy), rect.width/2);
      const ang = Math.atan2(dy,dx);
      dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
      knob.style.transform = `translate(${dx}px,${dy}px)`;
      joyDX = dx/(rect.width/2); joyDY = dy/(rect.width/2);
    }
    function joyEnd(){ joyActive=false; joyDX=0; joyDY=0; knob.style.transform='translate(0,0)'; }
    joy.addEventListener('pointerdown', ev=>{ joyActive=true; joyMove(ev.clientX, ev.clientY); ev.preventDefault(); });
    window.addEventListener('pointermove', ev=>{ if(joyActive) joyMove(ev.clientX, ev.clientY); });
    window.addEventListener('pointerup', ()=>{ if(joyActive) joyEnd(); });

    // 自动开火：不用按键，角色朝着当前面向的方向持续自动射击；技能/加特林会影响伤害和射速
    function hasGatling(){ return Date.now() < shooterGatlingUntil; }
    function hasBuff(){ return Date.now() < shooterMe.buffUntil; } // 坤坤：加攻速+无限子弹
    function hasExecute(){ return Date.now() < shooterMe.executeUntil; } // 包菜：一击致命
    function isCharmed(){ return Date.now() < shooterMe.charmedUntil; } // 杉菜魅惑：不能开火
    function doFire(){
      if(!shooterMe || !shooterMe.alive || isCharmed()) return;
      if(!hasBuff() && shooterMe.ammo<=0) return;
      if(!hasBuff()) shooterMe.ammo--;
      let dmg = hasGatling() ? 3 : 1;
      if(hasExecute()) dmg = 99;
      const b = { x:shooterMe.x, y:shooterMe.y, angle:shooterMe.angle, ownerId:mine, remote:false, life:60, dmg };
      shooterBullets.push(b);
      if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'shot', payload:{ id:mine, x:b.x, y:b.y, angle:b.angle } });
    }
    function scheduleAutoFire(){
      doFire();
      const interval = (hasGatling()||hasBuff()) ? 120 : 350;
      shooterAutoFireTimer = setTimeout(scheduleAutoFire, interval);
    }
    scheduleAutoFire();

    // 技能按钮
    const skillBtn = document.getElementById('shSkillBtn');
    if(skillBtn){
      skillBtn.onclick = ()=> activateShooterSkill(game, mine);
    }
  }

  const canvas = document.getElementById('shCanvas');
  const ctx = canvas.getContext('2d');
  const imgCache = {};
  function getImg(src){
    if(!imgCache[src]){ const im = new Image(); im.src = src; imgCache[src]=im; }
    return imgCache[src];
  }

  let lastBroadcast = 0;
  let endedTriggered = false;

  function loop(){
    shooterRAF = requestAnimationFrame(loop);
    const now = Date.now();
    const charmed = shooterMe && now < shooterMe.charmedUntil;
    const buffed = shooterMe && now < shooterMe.buffUntil;

    if(amPlaying && shooterMe){
      if(!shooterMe.alive && now >= shooterMe.respawnAt){
        const pt = SHOOTER_SPAWN_POINTS[Math.floor(Math.random()*SHOOTER_SPAWN_POINTS.length)];
        shooterMe.x = pt.x; shooterMe.y = pt.y; shooterMe.hp = 5; shooterMe.alive = true;
        shooterMe.buffUntil = 0; shooterMe.invisUntil = 0; shooterMe.executeUntil = 0; shooterMe.charmedUntil = 0;
      }
      if(shooterMe.alive && !charmed && (joyDX||joyDY)){
        const speed = buffed ? 5.2 : 3.2; // 坤坤技能：加移速
        let nx = shooterMe.x + joyDX*speed, ny = shooterMe.y + joyDY*speed;
        nx = Math.max(16, Math.min(SHOOTER_W-16, nx));
        ny = Math.max(16, Math.min(SHOOTER_H-16, ny));
        const blocked = game.obstacles.some(o=> nx>o.x-16 && nx<o.x+o.w+16 && ny>o.y-16 && ny<o.y+o.h+16);
        if(!blocked){ shooterMe.x = nx; shooterMe.y = ny; }
        shooterMe.angle = Math.atan2(joyDY, joyDX);
      }
      // 捡资源
      if(shooterMe.alive){
        getActivePickups(game).forEach(p=>{
          if(shooterCollected.has(p.key)) return;
          if(Math.hypot(shooterMe.x-p.x, shooterMe.y-p.y) < 24){
            shooterCollected.add(p.key);
            if(p.type==='ammo') shooterMe.ammo = Math.min(40, shooterMe.ammo+12);
            else shooterMe.hp = Math.min(5, shooterMe.hp+2);
          }
        });
      }
      // 柜子羊的地雷：踩到别人埋的（非自己/非队友）直接死
      if(shooterMe.alive){
        for(const [mid, mn] of Object.entries(shooterMines)){
          if(String(mn.ownerId)===String(mine)) continue;
          if(game.mode==='team' && game.teams[mn.ownerId] && game.teams[mine] && game.teams[mn.ownerId]===game.teams[mine]) continue;
          if(Math.hypot(shooterMe.x-mn.x, shooterMe.y-mn.y) < 22){
            shooterMe.hp = 0; shooterMe.alive = false; shooterMe.respawnAt = now + 3000;
            delete shooterMines[mid];
            if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'mineTrigger', payload:{ id:mid } });
            break;
          }
        }
      }
      if(now-lastBroadcast > 100){
        lastBroadcast = now;
        if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'state', payload:{
          id: mine, x:shooterMe.x, y:shooterMe.y, angle:shooterMe.angle, hp:shooterMe.hp, ammo:shooterMe.ammo,
          alive:shooterMe.alive, kills:shooterMe.kills, name:getPersonById(mine).name, ts:now,
          invisible: now<shooterMe.invisUntil
        }});
      }
    }

    // 严格上帝：模拟自己召唤的3个人机分身（只有他自己的设备负责跑这段AI）
    if(shooterBots.length){
      shooterBots.forEach(bot=>{
        let nearest = null, nearestD = Infinity;
        Object.entries(shooterRemote).forEach(([rid,rp])=>{
          if(!rp.alive || rp.isBot) return;
          if(game.mode==='team' && game.teams[rid] && game.teams[mine] && game.teams[rid]===game.teams[mine]) return;
          const d = Math.hypot(bot.x-(rp.renderX??rp.x), bot.y-(rp.renderY??rp.y));
          if(d<nearestD){ nearestD=d; nearest=rp; }
        });
        if(nearest && nearestD < 420){
          const tx = nearest.renderX??nearest.x, ty = nearest.renderY??nearest.y;
          bot.angle = Math.atan2(ty-bot.y, tx-bot.x);
          if(nearestD > 60){ bot.x += Math.cos(bot.angle)*2; bot.y += Math.sin(bot.angle)*2; }
          if(now-bot.lastFire > 700){
            bot.lastFire = now;
            const bb = { x:bot.x, y:bot.y, angle:bot.angle, ownerId:bot.id, remote:false, life:60, dmg:1 };
            shooterBullets.push(bb);
            if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'shot', payload:{ id:bot.id, x:bb.x, y:bb.y, angle:bb.angle } });
          }
        }
        if(now-lastBroadcast > 100 && shooterChannel){
          shooterChannel.send({ type:'broadcast', event:'state', payload:{
            id:bot.id, x:bot.x, y:bot.y, angle:bot.angle, hp:bot.hp, ammo:0, alive:true, kills:0,
            name:'严格上帝的分身', ts:now, isBot:true
          }});
        }
      });
    }

    // 平滑插值：把每个人"上一条广播位置"到"最新广播位置"之间，按时间比例补出中间过程，
    // 不然每0.1秒才更新一次位置，看起来就会一顿一顿地瞬移
    const INTERP_MS = 130; // 略大于广播间隔(100ms)，让插值刚好覆盖到下一条消息抵达
    Object.values(shooterRemote).forEach(rp=>{
      const t = Math.min(1, (now - rp.recvTs) / INTERP_MS);
      rp.renderX = rp.prevX + (rp.targetX - rp.prevX) * t;
      rp.renderY = rp.prevY + (rp.targetY - rp.prevY) * t;
      rp.renderAngle = rp.prevAngle + (rp.targetAngle - rp.prevAngle) * t;
    });

    // 子弹运动 + 命中判定（子弹主人自己判定命中——包括自己召唤的分身打出的子弹）
    for(let i=shooterBullets.length-1;i>=0;i--){
      const b = shooterBullets[i];
      b.x += Math.cos(b.angle)*8; b.y += Math.sin(b.angle)*8; b.life--;
      const outOfBounds = b.x<0||b.x>SHOOTER_W||b.y<0||b.y>SHOOTER_H;
      const hitObstacle = game.obstacles.some(o=> b.x>o.x && b.x<o.x+o.w && b.y>o.y && b.y<o.y+o.h);
      if(outOfBounds || hitObstacle || b.life<=0){ shooterBullets.splice(i,1); continue; }
      const isMine = !b.remote && String(b.ownerId)===String(mine);
      const isMyBot = !b.remote && shooterBots.some(bot=>bot.id===b.ownerId);
      if(isMine || isMyBot){
        let consumed = false;
        for(const [rid, rp] of Object.entries(shooterRemote)){
          if(!rp.alive || String(rid)===String(b.ownerId)) continue;
          if(rp.isBot && String(rid).indexOf(String(mine)+'_bot')===0) continue; // 不打自己的分身
          if(game.mode==='team' && game.teams[rid] && game.teams[mine] && game.teams[rid]===game.teams[mine]) continue;
          if(Math.hypot(b.x-(rp.renderX??rp.x), b.y-(rp.renderY??rp.y)) < 18){
            if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'hit', payload:{ targetId:rid, dmg:b.dmg||1 } });
            if(isMine){
              shooterMe.kills = (shooterMe.kills||0)+1;
              shooterMe.killsSinceSkill = (shooterMe.killsSinceSkill||0)+1;
              if(shooterMe.killsSinceSkill >= SHOOTER_SKILL_KILL_REFRESH){
                shooterMe.skillReadyAt = now; shooterMe.killsSinceSkill = 0;
              }
            }
            shooterBullets.splice(i,1);
            consumed = true;
            break;
          }
        }
        if(!consumed && isMine && game.boss && game.boss.alive && Math.hypot(b.x-game.boss.x, b.y-game.boss.y) < 26){
          if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'bossHit', payload:{ dmg:b.dmg||1, from:mine } });
          shooterBullets.splice(i,1);
        }
      }
    }

    // 房主负责毛兽的复活判定
    if(String(mine)===String(game.hostId) && game.boss && !game.boss.alive && now >= game.boss.respawnAt){
      game.boss.alive = true; game.boss.hp = game.boss.maxHp;
      if(shooterChannel) shooterChannel.send({ type:'broadcast', event:'bossState', payload:{ hp:game.boss.hp, alive:true, respawnAt:0 } });
    }

    // 镜头：跟着自己走；旁观的人镜头固定在地图中心
    const camCenterX = (amPlaying && shooterMe) ? shooterMe.x : SHOOTER_W/2;
    const camCenterY = (amPlaying && shooterMe) ? shooterMe.y : SHOOTER_H/2;
    const camX = Math.max(0, Math.min(SHOOTER_W-SHOOTER_VIEW_W, camCenterX - SHOOTER_VIEW_W/2));
    const camY = Math.max(0, Math.min(SHOOTER_H-SHOOTER_VIEW_H, camCenterY - SHOOTER_VIEW_H/2));
    const inFog = (wx,wy)=>{
      if(!(amPlaying && shooterMe)) return false; // 旁观的人不受雾区限制
      return Math.hypot(wx-shooterMe.x, wy-shooterMe.y) > SHOOTER_FOG_RADIUS;
    };

    // 画面
    ctx.clearRect(0,0,SHOOTER_VIEW_W,SHOOTER_VIEW_H);
    ctx.fillStyle = '#E8EFE0';
    ctx.fillRect(0,0,SHOOTER_VIEW_W,SHOOTER_VIEW_H);
    game.obstacles.forEach(o=>{
      if(inFog(o.x+o.w/2, o.y+o.h/2)) return;
      ctx.fillStyle = '#8A7A5C'; ctx.fillRect(o.x-camX,o.y-camY,o.w,o.h);
    });
    getActivePickups(game).forEach(p=>{
      if(shooterCollected.has(p.key) || inFog(p.x,p.y)) return;
      ctx.font = '22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.type==='ammo'?'🔫':'❤️', p.x-camX, p.y-camY);
    });
    // 柜子羊的地雷：只有自己/队友能看见
    Object.values(shooterMines).forEach(mn=>{
      const canSee = String(mn.ownerId)===String(mine) || (game.mode==='team' && game.teams[mn.ownerId] && game.teams[mine] && game.teams[mn.ownerId]===game.teams[mine]);
      if(!canSee) return;
      ctx.font = '20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('💣', mn.x-camX, mn.y-camY);
    });
    // 毛兽（作为地图上的重要目标，不受雾区遮挡）
    if(game.boss && game.boss.alive){
      ctx.font = '40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🐻', game.boss.x-camX, game.boss.y-camY);
      ctx.fillStyle = '#223328'; ctx.font='11px sans-serif';
      ctx.fillText(game.boss.name||'毛兽', game.boss.x-camX, game.boss.y-30-camY);
      ctx.fillStyle = '#ddd'; ctx.fillRect(game.boss.x-30-camX, game.boss.y+26-camY, 60, 6);
      ctx.fillStyle = '#8B2E1F'; ctx.fillRect(game.boss.x-30-camX, game.boss.y+26-camY, 60*Math.max(0,game.boss.hp)/game.boss.maxHp, 6);
    }else if(game.boss){
      const remainS = Math.max(0, Math.ceil((game.boss.respawnAt-now)/1000));
      ctx.fillStyle = 'rgba(34,51,40,.5)'; ctx.font='13px sans-serif'; ctx.textAlign='center';
      ctx.fillText(`毛兽 ${remainS}秒后刷新`, game.boss.x-camX, game.boss.y-camY);
    }
    shooterBullets.forEach(b=>{
      if(inFog(b.x,b.y)) return;
      ctx.fillStyle = b.dmg>1? '#B4553F' : '#E2A33D'; ctx.beginPath(); ctx.arc(b.x-camX,b.y-camY,b.dmg>1?6:4,0,Math.PI*2); ctx.fill();
    });

    function drawPlayer(pid, st){
      if(!st) return;
      if(st.invisible && String(pid)!==String(mine)) return; // 小鱼技能：别人看不见她（子弹轨迹上面已经照常画了）
      const px = st.renderX!==undefined ? st.renderX : st.x;
      const py = st.renderY!==undefined ? st.renderY : st.y;
      if(inFog(px,py) && String(pid)!==String(mine)) return; // 雾区外的人看不见
      const sx = px-camX, sy = py-camY;
      const teamColor = game.mode==='team' && game.teams[pid] ? SHOOTER_TEAM_COLOR[game.teams[pid]] : null;
      ctx.save();
      ctx.globalAlpha = st.alive===false ? 0.3 : (st.invisible?0.4:1);
      const avatar = shooterAvatarSrc(pid);
      if(avatar && !st.isBot){
        const im = getImg(avatar);
        if(im.complete && im.naturalWidth){
          ctx.save();
          ctx.beginPath(); ctx.arc(sx, sy, 18, 0, Math.PI*2); ctx.clip();
          ctx.drawImage(im, sx-18, sy-18, 36, 36);
          ctx.restore();
        }
      }else{
        ctx.fillStyle = st.isBot ? '#9B7BA6' : (teamColor || '#4C7A5E');
        ctx.beginPath(); ctx.arc(sx, sy, st.isBot?13:18, 0, Math.PI*2); ctx.fill();
      }
      ctx.strokeStyle = teamColor || '#223328'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, st.isBot?13:18, 0, Math.PI*2); ctx.stroke();
      if(String(pid)===String(mine) && now<shooterGatlingUntil){
        ctx.strokeStyle = '#E2A33D'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(sx, sy, 21, 0, Math.PI*2); ctx.stroke();
      }
      if(String(pid)===String(mine) && buffed){
        ctx.strokeStyle = '#4F6D9C'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(sx, sy, 23, 0, Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle = '#223328'; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText(st.isBot? '分身' : getPersonById(pid).name, sx, sy-(st.isBot?20:26));
      // 血条
      const maxHp = st.isBot? 3 : 5;
      ctx.fillStyle = '#ddd'; ctx.fillRect(sx-16, sy+22, 32, 4);
      ctx.fillStyle = '#B4553F'; ctx.fillRect(sx-16, sy+22, 32*Math.max(0,(st.hp||0))/maxHp, 4);
      ctx.restore();
    }
    Object.entries(shooterRemote).forEach(([rid,rp])=>{ if(now-rp.ts < 4000) drawPlayer(rid, rp); });
    if(amPlaying && shooterMe) drawPlayer(mine, shooterMe);
    shooterBots.forEach(bot=> drawPlayer(bot.id, {x:bot.x,y:bot.y,hp:bot.hp,alive:true,isBot:true}));

    // 顶部记分榜：所有真人（不含分身）的血量/子弹/击杀
    const scoreboard = document.getElementById('shScoreboard');
    if(scoreboard){
      const rows = game.players.map(pid=>{
        let st;
        if(String(pid)===String(mine)) st = shooterMe;
        else st = shooterRemote[pid];
        const teamColor = game.mode==='team' && game.teams[pid] ? SHOOTER_TEAM_COLOR[game.teams[pid]] : (isGuestIdentity(pid)?'var(--amber)':getPersonColor(pid));
        const name = getPersonById(pid).name;
        if(!st) return `<div class="sh-sb-item" style="border-color:${teamColor}"><b>${name}</b></div>`;
        return `<div class="sh-sb-item ${st.alive===false?'sh-sb-dead':''}" style="border-color:${teamColor}"><b>${name}</b>❤️${st.hp??'-'} 🔫${st.ammo??'-'} 🏆${st.kills||0}</div>`;
      }).join('');
      scoreboard.innerHTML = rows;
    }

    // HUD
    const hud = document.getElementById('shHud');
    if(hud){
      const remain = Math.max(0, game.duration - (now-game.startedAt));
      const mm = Math.floor(remain/60000), ss = Math.floor((remain%60000)/1000);
      let scoreHtml = '';
      if(amPlaying && shooterMe){
        const tags = [];
        if(now<shooterGatlingUntil) tags.push(`🔥加特林${Math.ceil((shooterGatlingUntil-now)/1000)}s`);
        if(buffed) tags.push(`⚡强化${Math.ceil((shooterMe.buffUntil-now)/1000)}s`);
        if(now<shooterMe.invisUntil) tags.push(`👻隐身${Math.ceil((shooterMe.invisUntil-now)/1000)}s`);
        if(now<shooterMe.executeUntil) tags.push(`💀处决${Math.ceil((shooterMe.executeUntil-now)/1000)}s`);
        if(charmed) tags.push(`💫被魅惑${Math.ceil((shooterMe.charmedUntil-now)/1000)}s`);
        scoreHtml = `❤️${shooterMe.hp} · 🔫${shooterMe.ammo} · 🏆${shooterMe.kills||0}${tags.length? ' · '+tags.join(' · '):''}`;
      }
      hud.innerHTML = `<div class="sh-timer">${mm}:${String(ss).padStart(2,'0')}</div><div class="sh-score">${scoreHtml}</div>`;
      if(remain<=0 && !endedTriggered){
        endedTriggered = true;
        finishShooterGame(game);
      }
    }
    // 技能冷却按钮
    const skillCd = document.getElementById('shSkillCd');
    if(skillCd && shooterMe){
      const remainCd = Math.max(0, shooterMe.skillReadyAt-now);
      if(remainCd>0){
        skillCd.style.display='flex';
        skillCd.textContent = Math.ceil(remainCd/1000);
      }else{
        skillCd.style.display='none';
      }
    }
  }
  loop();
}

function stopShooterLoop(){
  if(shooterRAF){ cancelAnimationFrame(shooterRAF); shooterRAF = null; }
  if(shooterAutoFireTimer){ clearTimeout(shooterAutoFireTimer); shooterAutoFireTimer = null; }
  leaveShooterChannel();
  disableShooterBackGuard();
  shooterMe = null;
}

async function finishShooterGame(game){
  // 结算：把自己知道的击杀数广播/记录一下，房主负责把结果写进共享数据结束这一局
  const myKills = shooterMe ? (shooterMe.kills||0) : 0;
  game.tallies = game.tallies || {};
  game.tallies[state.identity] = myKills;
  if(String(state.identity) === String(game.hostId)){
    setTimeout(async ()=>{
      game.status = 'ended';
      game.lastResult = game.tallies;
      await queueSave();
    }, 1500); // 稍微等一下，让其他人的最后战绩有机会广播过来（这里简化为直接用房主自己记录到的）
  }
}

function renderShooterEnded(target, game){
  stopShooterLoop();
  const tallies = game.lastResult || game.tallies || {};
  const rows = game.players.map(pid=>({ pid, kills: tallies[pid]||0 })).sort((a,b)=>b.kills-a.kills);
  let teamScoreHtml = '';
  if(game.mode==='team'){
    const teamTotals = { red:0, blue:0 };
    rows.forEach(r=>{ const t = game.teams[r.pid]; if(t) teamTotals[t] += r.kills; });
    teamScoreHtml = `<div class="banner">🔴 红队 ${teamTotals.red} 分　🔵 蓝队 ${teamTotals.blue} 分　—　${teamTotals.red===teamTotals.blue? '平局！' : (teamTotals.red>teamTotals.blue?'红队获胜！':'蓝队获胜！')}</div>`;
  }
  target.innerHTML = `
    <button class="back-link" id="backToGames">← 返回娱乐吧</button>
    <div class="section-head"><h2>🔫 枪战对决 · 结算</h2></div>
    ${teamScoreHtml}
    <div class="uc-reveal-list">
      ${rows.map(r=>{
        const p = getPersonById(r.pid);
        const team = game.teams[r.pid];
        return `<div class="uc-reveal-row">
          <div class="uc-avatar" style="background:${team?SHOOTER_TEAM_COLOR[team]:(isGuestIdentity(r.pid)?'var(--amber)':getPersonColor(r.pid))};">${p.name[0]||''}</div>
          <div class="uc-reveal-name">${escapeHtml(p.name)}</div>
          <div class="uc-reveal-role">🏆 ${r.kills} 击杀</div>
        </div>`;
      }).join('')}
    </div>
    <div class="panel-actions" style="margin-top:18px;"><button class="btn btn-primary" id="shNewGameBtn" style="flex:1;">开始新一局</button></div>
  `;
  document.getElementById('backToGames').onclick = ()=>{ state.funGame = null; renderFunTab(target); };
  document.getElementById('shNewGameBtn').onclick = async ()=>{
    state.shooterGame = { status:'lobby', players:[], mode:'solo', teams:{}, hostId:null, startedAt:null, duration:180000, obstacles:[], lastResult:null };
    await queueSave();
    renderShooterGame(target);
  };
}

/* ---- 行程：排练 / 团建 共用的日历 + 列表（谁能管理由 getTripConfig() 决定）---- */
function renderTripCalendar(){
  const cfg = getTripConfig();
  const {y,m} = MONTHS[state.activeMonth];
  const card = document.getElementById('calCard');
  const firstDow = (new Date(y,m,1).getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const items = state[cfg.key] || [];
  let html = `<div class="cal-month">${MONTHS[state.activeMonth].label} ${y}</div><div class="cal-grid">`;
  DOW.forEach(d=> html += `<div class="cal-dow">周${d}</div>`);
  for(let i=0;i<firstDow;i++) html += `<div class="cal-cell pad"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = dateKey(y,m,d);
    const isToday = sameDate(new Date(y,m,d), TODAY);
    const dayItems = items.filter(mt=>mt.date===key);
    let cls = 'cal-cell' + (isToday?' today':'');
    html += `<div class="${cls}" data-key="${key}"><div class="cal-date">${d}</div>`;
    if(dayItems.length){
      html += `<div style="font-size:10px;color:var(--leaf);margin-top:6px;font-weight:600;">${dayItems.length}场${cfg.label}</div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  card.innerHTML = html;
  card.querySelectorAll('.cal-cell:not(.pad)').forEach(cell=>{
    cell.onclick = ()=> openTripDayPanel(cell.dataset.key);
  });
}

function renderTripListForMonth(){
  const cfg = getTripConfig();
  const list = document.getElementById('meetingList');
  const {y,m} = MONTHS[state.activeMonth];
  const prefix = `${y}-${pad(m+1)}`;
  const items = (state[cfg.key]||[]).filter(mt=>mt.date.startsWith(prefix)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  if(items.length===0){ list.innerHTML = `<div class="empty-hint">这个月还没有安排${cfg.label}</div>`; return; }
  list.innerHTML = items.map(mt=>`
    <div class="meeting-card">
      <div class="meeting-date">${mt.date.slice(5)}${mt.time? '<br>'+mt.time : ''}</div>
      <div class="meeting-body">
        <div class="meeting-title">${escapeHtml(mt.title)}</div>
        ${mt.summary? `<div class="meeting-summary">${escapeHtml(mt.summary)}</div>` : ''}
        ${(mt.photos&&mt.photos.length)? `<div class="meeting-photo-count">📷 ${mt.photos.length}</div>` : ''}
      </div>
      ${cfg.canManage()? `<button class="icon-btn meeting-del" data-id="${mt.id}">删除</button>` : ''}
    </div>
  `).join('');
  list.querySelectorAll('.meeting-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm(`确定删除这场${cfg.label}吗？`)) return;
      state[cfg.key] = (state[cfg.key]||[]).filter(m=>m.id!==b.dataset.id);
      await queueSave();
      renderTripCalendar(); renderTripListForMonth();
    };
  });
}

function openTripDayPanel(key){
  const cfg = getTripConfig();
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const dayItems = (state[cfg.key]||[]).filter(mt=>mt.date===key);
  let html = `<h2>${key}</h2><div class="sub">当天的${cfg.label}</div>`;
  if(dayItems.length===0){
    html += `<div class="empty-hint">这天还没有安排${cfg.label}</div>`;
  }else{
    html += dayItems.map(mt=>{
      const photos = mt.photos || [];
      return `<div class="meeting-card" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;gap:12px;align-items:flex-start;">
          <div class="meeting-body">
            <div class="meeting-title">${mt.time? `<span style="color:var(--leaf);">${mt.time}</span> · `:''}${escapeHtml(mt.title)}</div>
            ${mt.summary? `<div class="meeting-summary">${escapeHtml(mt.summary)}</div>` : ''}
          </div>
          ${cfg.canManage()? `<button class="icon-btn meeting-del-inline" data-id="${mt.id}">删除</button>` : ''}
        </div>
        ${photos.length? `<div class="trip-photo-grid">${photos.map(p=>{
          const author = getPersonById(p.authorIdx);
          const canDelP = String(p.authorIdx)===String(state.identity) || isAdmin();
          return `<div class="trip-photo-item">
            <img src="${p.src}">
            <div class="trip-photo-meta">${escapeHtml(author.name)}${canDelP? ` · <button type="button" class="trip-photo-del" data-mt="${mt.id}" data-pid="${p.id}">删除</button>`:''}</div>
          </div>`;
        }).join('')}</div>` : ''}
        <div class="trip-photo-add-row">
          <label class="btn btn-ghost" style="cursor:pointer;width:auto;padding:6px 12px;font-size:12px;">+ 添加照片<input type="file" accept="image/*" class="trip-photo-input" data-mt="${mt.id}" style="display:none;"></label>
        </div>
      </div>`;
    }).join('');
  }
  html += `<div class="panel-actions">
    <button class="btn btn-ghost" id="cancelBtn">关闭</button>
    ${cfg.canManage()? `<button class="btn btn-primary" id="addHereBtn">+ 在这天添加${cfg.label}</button>` : ''}
  </div>`;
  panel.innerHTML = html;
  overlay.classList.add('show');
  document.getElementById('cancelBtn').onclick = closePanel;
  panel.querySelectorAll('.meeting-del-inline').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm(`确定删除这场${cfg.label}吗？`)) return;
      state[cfg.key] = (state[cfg.key]||[]).filter(m=>m.id!==b.dataset.id);
      await queueSave();
      closePanel(); renderTripCalendar(); renderTripListForMonth();
    };
  });
  panel.querySelectorAll('.trip-photo-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('删除这张照片吗？')) return;
      const mt = (state[cfg.key]||[]).find(x=>x.id===b.dataset.mt);
      if(mt) mt.photos = (mt.photos||[]).filter(p=>p.id!==b.dataset.pid);
      await queueSave();
      openTripDayPanel(key);
      renderTripListForMonth();
    };
  });
  panel.querySelectorAll('.trip-photo-input').forEach(inp=>{
    inp.addEventListener('change', async (ev)=>{
      const file = ev.target.files[0];
      if(!file) return;
      try{
        const src = await prepareImage(file, 'trips', 700, 0.7);
        const mt = (state[cfg.key]||[]).find(x=>x.id===inp.dataset.mt);
        if(mt){
          mt.photos = mt.photos || [];
          mt.photos.push({ id:'tp_'+Date.now(), src, authorIdx: state.identity, ts: Date.now() });
        }
        await queueSave();
        openTripDayPanel(key);
        renderTripListForMonth();
      }catch(err){ alert('图片处理失败：' + err.message); }
    });
  });
  if(cfg.canManage()){
    document.getElementById('addHereBtn').onclick = ()=> openTripForm(key);
  }
}

function openTripForm(presetDate){
  const cfg = getTripConfig();
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');

function allWeekdayKeysUpToToday(){
  const keys = [];
  MONTHS.forEach(({y,m})=>{
    if(!isCheckinMonth(m)) return; // 打卡统计只算暑期七八月，其他月份不参与
    const days = new Date(y,m+1,0).getDate();
    for(let d=1; d<=days; d++){
      const dt = new Date(y,m,d);
      if(dt <= TODAY) keys.push(dateKey(y,m,d));
    }
  });
  return keys;
}

function totalCheckinCount(idx){
  const pastKeys = allWeekdayKeysUpToToday();
  let total = 0;
  pastKeys.forEach(k=>{ if(getEntries(k)[idx].checked) total++; });
  return total;
}

/* ---- 冰冻药剂：连续打卡7天自动获得一个，缺卡时自动用来保住连续天数 ---- */
function getFreezeTokenCount(idx){
  return state.freezeTokens[idx] !== undefined ? state.freezeTokens[idx] : 3;
}

/* 取消打卡时如果这天正好是被冰冻药剂保护的，主动解除保护并退还药剂，
   保证"取消"这个动作永远是确定生效的，不会被自动冰冻逻辑悄悄覆盖回去 */
function unfreezeIfNeeded(idx, key, nowChecked){
  if(nowChecked) return;
  state.frozenDays[idx] = state.frozenDays[idx] || [];
  const pos = state.frozenDays[idx].indexOf(key);
  if(pos>=0){
    state.frozenDays[idx].splice(pos,1);
    state.freezeTokens[idx] = getFreezeTokenCount(idx) + 1;
  }
}

function computeStreakInfo(idx){
  const pastKeys = allWeekdayKeysUpToToday(); // 已按日期升序排列，到今天为止
  const todayKey = dateKey(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  state.frozenDays[idx] = state.frozenDays[idx] || [];
  if(state.freezeTokens[idx] === undefined) state.freezeTokens[idx] = 3;
  let changed = false;

  // 真实连续打卡天数（不算冰冻），用来判断要不要发新的冰冻药剂
  let raw = 0, rawBroken = false;
  for(let k=pastKeys.length-1;k>=0;k--){
    const e = getEntries(pastKeys[k])[idx];
    if(!rawBroken){
      if(e.checked) raw++;
      else rawBroken = true;
    }else break;
  }
  const mark = state.freezeAwardMark[idx] || 0;
  if(raw>0 && raw % 7 === 0 && raw > mark){
    state.freezeTokens[idx] = getFreezeTokenCount(idx) + 1;
    state.freezeAwardMark[idx] = raw;
    changed = true;
  }

  // 冰冻保护后的连续天数（用来展示"连续N天"，缺卡时如果还有药剂会自动消耗保住streak）
  let streak = 0, streakBroken = false;
  for(let k=pastKeys.length-1;k>=0;k--){
    if(streakBroken) break;
    const key = pastKeys[k];
    const e = getEntries(key)[idx];
    if(e.checked){
      streak++;
    }else if(key === todayKey){
      // 今天还没"过完"，缺卡也不自动冰冻——不然刚点完"取消打卡"，
      // 下一次渲染立刻又被冰冻药剂保护回去，看起来就像取消不掉一样
      streakBroken = true;
    }else if(state.frozenDays[idx].includes(key)){
      streak++;
    }else if(getFreezeTokenCount(idx) > 0){
      state.frozenDays[idx].push(key);
      state.freezeTokens[idx] = getFreezeTokenCount(idx) - 1;
      changed = true;
      streak++;
    }else{
      streakBroken = true;
    }
  }

  return { streak, tokens: getFreezeTokenCount(idx), changed };
}

/* ---- 打卡徽章：里程碑成就，一旦拿到就永久保留，不会因为后来断卡掉 ---- */
const BADGE_DEFS = [
  { id:'total10',  type:'total',  value:10, icon:'🌱', label:'新手上路' },
  { id:'streak7',  type:'streak', value:7,  icon:'🔥', label:'小有恒心' },
  { id:'streak14', type:'streak', value:14, icon:'⚡', label:'越战越勇' },
  { id:'total50',  type:'total',  value:50, icon:'🎯', label:'百炼成钢' },
  { id:'streak30', type:'streak', value:30, icon:'🌟', label:'坚持达人' },
  { id:'total100', type:'total',  value:100,icon:'🏆', label:'传奇练习生' },
  { id:'streak50', type:'streak', value:50, icon:'👑', label:'练习之王' }
];
function computeMaxStreakEver(idx){
  const keys = allWeekdayKeysUpToToday(); // 升序，从早到今天
  let run = 0, max = 0;
  keys.forEach(k=>{
    const e = getEntries(k)[idx];
    const frozen = (state.frozenDays[idx]||[]).includes(k);
    if(e.checked || frozen){ run++; if(run>max) max = run; }
    else{ run = 0; }
  });
  return max;
}
function getEarnedBadges(idx){
  const maxStreak = computeMaxStreakEver(idx);
  const total = totalCheckinCount(idx);
  return BADGE_DEFS.map(b=>({
    ...b,
    earned: b.type==='streak' ? maxStreak>=b.value : total>=b.value
  }));
}
function renderBadgeWall(idx){
  const badges = getEarnedBadges(idx);
  return `<div class="badge-wall">
    ${badges.map(b=>`<div class="badge-chip ${b.earned?'earned':'locked'}" title="${b.type==='streak'? '最长连续打卡 '+b.value+' 天' : '累计打卡 '+b.value+' 次'}">
      <div class="badge-icon">${b.earned? b.icon : '🔒'}</div>
      <div class="badge-label">${b.label}</div>
    </div>`).join('')}
  </div>`;
}

function renderJournal(){
  const body = document.getElementById('journalBody');
  const pastKeys = allWeekdayKeysUpToToday();
  let html = '';
  let anyChanged = false;
  state.members.forEach((mem,i)=>{
    let total = 0;
    pastKeys.forEach(k=>{ if(getEntries(k)[i].checked) total++; });
    const info = computeStreakInfo(i);
    if(info.changed) anyChanged = true;
    html += `<div class="vine-row">
      <div class="vine-id">
        <div class="vine-name" style="color:${getPersonColor(i)}">${mem.name}</div>
        <div class="vine-inst">${mem.instrument}</div>
        <div class="vine-stats"><b>${total}</b> 次 · 连续 <b>${info.streak}</b> 天 · 🧊×${info.tokens}</div>
      </div>
      <div class="stem-wrap"><div class="stem">`;
    MONTHS.filter(({m})=>isCheckinMonth(m)).forEach(({y,m})=>{
      const days = new Date(y,m+1,0).getDate();
      for(let d=1; d<=days; d++){
        const dt = new Date(y,m,d);
        const key = dateKey(y,m,d);
        if(dt > TODAY){ html += `<div class="leaf future" title="${key}"></div>`; }
        else{
          const e = getEntries(key)[i];
          const frozen = !e.checked && (state.frozenDays[i]||[]).includes(key);
          const proxied = e.checked && e.proxied;
          const cls = e.checked? ('filled' + (proxied?' proxied':'')) : (frozen? 'frozen' : '');
          const bg = e.checked? 'background:'+getPersonColor(i)+';' : '';
          html += `<div class="leaf ${cls}" style="${bg}" title="${key}${e.note?' · '+e.note:''}${frozen?'（用冰冻药剂保护）':''}${proxied?'（管理员代打卡）':''}"></div>`;
        }
      }
    });
    html += `</div></div></div>`;
  });
  body.innerHTML = html;
  if(anyChanged) queueSave(); // 新发放或消耗了冰冻药剂，同步保存
}

/* ---------------- 夸夸墙：给队友写一句具体的夸奖 ---------------- */
function renderPraiseWall(body){
  const mine = state.identity;
  const list = [...(state.praises||[])].sort((a,b)=>b.ts-a.ts);
  const others = allPeople().filter(p=>String(p.id)!==String(mine));
  // 统计每个人收到多少夸奖
  const counts = {};
  (state.praises||[]).forEach(p=>{ counts[p.toId] = (counts[p.toId]||0)+1; });
  const ranking = allPeople().map(p=>({...p, count: counts[p.id]||0}))
    .filter(p=>p.count>0).sort((a,b)=>b.count-a.count).slice(0,3);

  body.innerHTML = `
    <div class="banner">🌟 给队友写一句具体的夸奖吧——越具体越好，比如"今天那段solo炸了"比"你很棒"有力量得多。</div>
    ${ranking.length? `<div class="praise-podium">${ranking.map((p,i)=>`
      <div class="praise-podium-item">
        <div class="praise-podium-medal">${['🥇','🥈','🥉'][i]}</div>
        <div class="praise-podium-name">${escapeHtml(p.name)}</div>
        <div class="praise-podium-count">收到 ${p.count} 条</div>
      </div>`).join('')}</div>` : ''}
    <div class="composer">
      <div class="cfg-field"><label>想夸谁</label>
        <select id="praiseTo">
          ${others.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
        </select>
      </div>
      <textarea id="praiseText" placeholder="具体夸一句…（比如：今天排练你那段鼓点稳得离谱）" style="margin-top:10px;"></textarea>
      <div class="composer-row" style="justify-content:flex-end;">
        <button class="btn btn-primary" id="praiseSend" style="width:auto;padding:8px 20px;">送出夸奖</button>
      </div>
    </div>
    <div id="praiseList"></div>
  `;
  if(others.length===0){
    document.getElementById('praiseSend').disabled = true;
  }
  document.getElementById('praiseSend').onclick = async ()=>{
    const toId = document.getElementById('praiseTo').value;
    const text = document.getElementById('praiseText').value.trim();
    if(!text){ alert('写一句具体的夸奖吧'); return; }
    state.praises = state.praises || [];
    const realToId = isNaN(Number(toId)) ? toId : Number(toId);
    state.praises.unshift({ id:'pr_'+Date.now(), toId: realToId, fromId: mine, text, ts: Date.now(), likes:[] });
    addNotif(realToId, 'praise', mine, null, text.slice(0,30));
    await queueSave();
    renderPraiseWall(body);
    renderNotifBell();
  };

  const praiseList = document.getElementById('praiseList');
  if(list.length===0){ praiseList.innerHTML = `<div class="empty-hint">还没有人夸过队友，来当第一个吧</div>`; return; }
  praiseList.innerHTML = list.map(p=>{
    const from = getPersonById(p.fromId), to = getPersonById(p.toId);
    const liked = (p.likes||[]).some(x=>String(x)===String(mine));
    const canDel = String(p.fromId)===String(mine) || isAdmin();
    return `<div class="praise-card">
      <div class="praise-head">
        <span class="praise-from">${escapeHtml(from.name)}</span>
        <span class="praise-arrow">夸了</span>
        <span class="praise-to">${escapeHtml(to.name)}</span>
        <span class="praise-time">${fmtTime(p.ts)}</span>
      </div>
      <div class="praise-text">${escapeHtml(p.text)}</div>
      <div class="praise-actions">
        <button type="button" class="praise-like ${liked?'liked':''}" data-id="${p.id}">${liked?'👏':'👏'} ${(p.likes||[]).length||''} 附议</button>
        ${canDel? `<button type="button" class="praise-del" data-id="${p.id}">删除</button>`:''}
      </div>
    </div>`;
  }).join('');
  praiseList.querySelectorAll('.praise-like').forEach(b=>{
    b.onclick = async ()=>{
      const p = state.praises.find(x=>x.id===b.dataset.id);
      if(!p) return;
      p.likes = p.likes || [];
      const i = p.likes.findIndex(x=>String(x)===String(mine));
      if(i>=0) p.likes.splice(i,1); else p.likes.push(mine);
      await queueSave();
      renderPraiseWall(body);
    };
  });
  praiseList.querySelectorAll('.praise-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('删除这条夸奖吗？')) return;
      state.praises = state.praises.filter(x=>x.id!==b.dataset.id);
      await queueSave();
      renderPraiseWall(body);
    };
  });
}

/* 把整份数据下载成一个 json 文件存起来。数据库里只有一份数据、没有历史版本，
   万一哪次误操作或保存出错就找不回来了，定期导出一次是最省事的保险。 */
function exportAllData(){
  try{
    const payload = {
      exportedAt: new Date().toISOString(),
      members: state.members, checkins: state.checkins, meetings: state.meetings,
      posts: state.posts, profiles: state.profiles, guests: state.guests,
      credentials: state.credentials, messages: state.messages, boards: state.boards,
      bandBanner: state.bandBanner, notifications: state.notifications,
      announcement: state.announcement, nameProposals: state.nameProposals,
      freezeTokens: state.freezeTokens, frozenDays: state.frozenDays,
      freezeAwardMark: state.freezeAwardMark, teambuilds: state.teambuilds,
      dayMemories: state.dayMemories, praises: state.praises, ledger: state.ledger,
      gigs: state.gigs, songs: state.songs, roles: state.roles
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date();
    a.download = `皮菇文化备份_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    maintLog('✅ 备份文件已开始下载，建议存到网盘或者发到群里留档。');
  }catch(e){
    maintLog('❌ 导出失败：' + e.message);
  }
}

/* 把早期直接存在数据库里的 base64 老照片，批量搬到 Supabase Storage，
   只保留一个短网址。这样那份共享数据会瘦身很多，所有人打开网站都会更快。 */
async function migrateOldPhotos(){
  if(!confirm('要把早期存在数据库里的老照片搬到图片存储吗？\n照片多的话可能要几分钟，中途请不要关页面。')) return;
  const box = document.getElementById('maintenanceLog');
  if(box) box.innerHTML = '';
  maintLog('开始扫描…');
  let moved = 0, failed = 0, scanned = 0;

  async function move(dataUrl, folder){
    scanned++;
    const url = await uploadImage(dataUrl, folder);
    if(url && url !== dataUrl){ moved++; return url; }
    failed++; return dataUrl;
  }
  const isOld = (v)=> typeof v==='string' && v.startsWith('data:');

  try{
    // 头像
    for(const key of Object.keys(state.profiles||{})){
      const p = state.profiles[key];
      if(p && isOld(p.avatar)) p.avatar = await move(p.avatar, 'avatars');
    }
    // 首页封面
    if(isOld(state.bandBanner)) state.bandBanner = await move(state.bandBanner, 'banner');
    // 帖子配图
    for(const p of (state.posts||[])){
      if(isOld(p.photo)) p.photo = await move(p.photo, 'posts');
    }
    // 展示墙贴图 + 涂鸦
    for(const key of Object.keys(state.boards||{})){
      const b = state.boards[key];
      if(!b) continue;
      for(const el of (b.elements||[])){
        if(el.type==='image' && isOld(el.src)) el.src = await move(el.src, 'boards');
      }
      if(isOld(b.doodle)) b.doodle = await move(b.doodle, 'boards');
    }
    // 共同回忆照片
    for(const key of Object.keys(state.dayMemories||{})){
      for(const ph of (state.dayMemories[key]||[])){
        if(isOld(ph.src)) ph.src = await move(ph.src, 'memories');
      }
    }
    // 行程照片（排练 + 团建）
    for(const arr of [state.meetings||[], state.teambuilds||[]]){
      for(const mt of arr){
        for(const ph of (mt.photos||[])){
          if(isOld(ph.src)) ph.src = await move(ph.src, 'trips');
        }
      }
    }

    if(scanned===0){ maintLog('没有找到需要迁移的老照片，说明早就都是新方案了 👍'); return; }
    maintLog(`扫描到 ${scanned} 张老照片，成功搬走 ${moved} 张${failed? `，失败 ${failed} 张（这些会保持原样，不影响使用）`:''}。`);
    if(moved>0){
      await queueSave();
      maintLog('✅ 已保存。刷新页面后应该会明显变快。');
    }
  }catch(e){
    maintLog('❌ 迁移中断：' + e.message + '（已搬走的部分不会丢，可以再点一次继续）');
  }
}

  const past = list.filter(g=>g.status==='done' || g.status==='cancelled');

  function gigCard(g){
    const att = g.attendance || {};
    const yes = state.members.filter((m,i)=>att[i]==='yes');
    const no = state.members.filter((m,i)=>att[i]==='no');
    const myAtt = att[mine];
    const canRSVP = !isGuestIdentity(mine) && g.status!=='done' && g.status!=='cancelled';
    return `<div class="gig-card gig-${g.status}">
      <div class="gig-head">
        <span class="gig-status gig-status-${g.status}">${GIG_STATUS[g.status]||g.status}</span>
        <span class="gig-title">${escapeHtml(g.title)}</span>
        ${canEdit? `<button type="button" class="gig-del" data-id="${g.id}">删除</button>`:''}
      </div>
      <div class="gig-meta">
        <span>📅 ${g.date}${g.time? ' '+g.time:''}</span>
        ${g.venue? `<span>📍 ${escapeHtml(g.venue)}</span>`:''}
        ${g.fee? `<span>💰 ${escapeHtml(String(g.fee))}</span>`:''}
        ${g.contact? `<span>☎️ ${escapeHtml(g.contact)}</span>`:''}
      </div>
      ${g.note? `<div class="gig-note">${escapeHtml(g.note)}</div>`:''}
      <div class="gig-attend">
        <span class="gig-attend-label">到场：</span>
        <span class="gig-attend-yes">✅ ${yes.length? yes.map(m=>escapeHtml(m.name)).join('、') : '暂无'}</span>
        ${no.length? `<span class="gig-attend-no">❌ ${no.map(m=>escapeHtml(m.name)).join('、')}</span>`:''}
      </div>
      ${canRSVP? `<div class="gig-rsvp">
        <button type="button" class="gig-rsvp-btn ${myAtt==='yes'?'active':''}" data-id="${g.id}" data-v="yes">我能到</button>
        <button type="button" class="gig-rsvp-btn ${myAtt==='no'?'active':''}" data-id="${g.id}" data-v="no">我去不了</button>
      </div>`:''}
      ${canEdit? `<div class="gig-status-row">
        ${Object.entries(GIG_STATUS).map(([k,v])=>`<button type="button" class="gig-set-status ${g.status===k?'active':''}" data-id="${g.id}" data-s="${k}">${v}</button>`).join('')}
      </div>`:''}
    </div>`;
  }

  body.innerHTML = `
    ${canEdit? `
      <div class="composer">
        <div class="ledger-form">
          <div class="cfg-field"><label>演出名称</label><input type="text" id="ggTitle" placeholder="比如：校庆晚会"></div>
          <div class="cfg-field"><label>日期</label><input type="date" id="ggDate"></div>
          <div class="cfg-field"><label>时间</label><input type="time" id="ggTime" value="19:00"></div>
          <div class="cfg-field"><label>报酬</label><input type="text" id="ggFee" placeholder="比如：2000元 / 无"></div>
        </div>
        <div class="ledger-form" style="margin-top:10px;">
          <div class="cfg-field" style="grid-column:span 2;"><label>地点</label><input type="text" id="ggVenue" placeholder="演出场地"></div>
          <div class="cfg-field" style="grid-column:span 2;"><label>对接人/联系方式</label><input type="text" id="ggContact" placeholder="主办方联系人"></div>
        </div>
        <div class="cfg-field" style="margin-top:10px;"><label>备注</label><input type="text" id="ggNote" placeholder="曲目要求、几点到场、需不需要自带设备…"></div>
        <div class="composer-row" style="justify-content:flex-end;">
          <button class="btn btn-primary" id="ggAdd" style="width:auto;padding:8px 20px;">添加通告</button>
        </div>
      </div>
    ` : `<div class="banner">🎤 演出通告由杉菜统一对接和管理，大家可以查看详情，并点"我能到 / 我去不了"报一下自己的情况。</div>`}
    <div class="section-head"><h2>即将到来</h2></div>
    <div id="gigUpcoming">${upcoming.length? upcoming.map(gigCard).join('') : '<div class="empty-hint">暂时没有待办的演出通告</div>'}</div>
    ${past.length? `<div class="section-head"><h2>已结束</h2></div><div id="gigPast">${past.map(gigCard).join('')}</div>` : ''}
  `;

  if(canEdit){
    const d = new Date();
    document.getElementById('ggDate').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    document.getElementById('ggAdd').onclick = async ()=>{
      const title = document.getElementById('ggTitle').value.trim();
      const date = document.getElementById('ggDate').value;
      if(!title || !date){ alert('演出名称和日期不能为空'); return; }
      state.gigs = state.gigs || [];
      state.gigs.push({
        id:'gg_'+Date.now(), title, date,
        time: document.getElementById('ggTime').value,
        venue: document.getElementById('ggVenue').value.trim(),
        fee: document.getElementById('ggFee').value.trim(),
        contact: document.getElementById('ggContact').value.trim(),
        note: document.getElementById('ggNote').value.trim(),
        status:'pending', attendance:{}, ts: Date.now()
      });
      allPeople().forEach(p=>{ addNotif(p.id, 'new_gig', mine, null, title.slice(0,20)); });
      await queueSave();
      renderGigBoard(body);
      renderNotifBell();
    };
  }
  body.querySelectorAll('.gig-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('删除这条演出通告吗？')) return;
      state.gigs = state.gigs.filter(x=>x.id!==b.dataset.id);
      await queueSave();
      renderGigBoard(body);
    };
  });
  body.querySelectorAll('.gig-rsvp-btn').forEach(b=>{
    b.onclick = async ()=>{
      const g = state.gigs.find(x=>x.id===b.dataset.id);
      if(!g) return;
      g.attendance = g.attendance || {};
      if(g.attendance[mine]===b.dataset.v) delete g.attendance[mine];
      else g.attendance[mine] = b.dataset.v;
      await queueSave();
      renderGigBoard(body);
    };
  });
  body.querySelectorAll('.gig-set-status').forEach(b=>{
    b.onclick = async ()=>{
      const g = state.gigs.find(x=>x.id===b.dataset.id);
      if(!g) return;
      g.status = b.dataset.s;
      await queueSave();
      renderGigBoard(body);
    };
  });
}

/* ---------------- 乐队小账本：只有坤坤能记账，其他人只能看 ---------------- */
const LEDGER_CATEGORIES = ['演出费','器材','交通','录音棚','宣传','餐饮','其他'];

function renderLedger(body){
  const canEdit = canManageLedger();
  const list = [...(state.ledger||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||'') || b.ts-a.ts);
  const income = list.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0);
  const expense = list.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0);
  const balance = income - expense;
  const perHead = state.members.length ? balance/state.members.length : 0;
  const fmtMoney = (n)=> (Math.round(n*100)/100).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});

  body.innerHTML = `
    <div class="ledger-summary">
      <div class="ledger-stat"><div class="ledger-stat-label">总收入</div><div class="ledger-stat-num income">+${fmtMoney(income)}</div></div>
      <div class="ledger-stat"><div class="ledger-stat-label">总支出</div><div class="ledger-stat-num expense">−${fmtMoney(expense)}</div></div>
      <div class="ledger-stat"><div class="ledger-stat-label">结余</div><div class="ledger-stat-num ${balance>=0?'income':'expense'}">${fmtMoney(balance)}</div></div>
      <div class="ledger-stat"><div class="ledger-stat-label">${state.members.length}人均分</div><div class="ledger-stat-num">${fmtMoney(perHead)}</div></div>
    </div>
    ${canEdit? `
      <div class="composer">
        <div class="ledger-form">
          <div class="cfg-field"><label>类型</label>
            <select id="lgType"><option value="income">收入</option><option value="expense">支出</option></select>
          </div>
          <div class="cfg-field"><label>金额</label><input type="number" id="lgAmount" placeholder="0.00" step="0.01" min="0"></div>
          <div class="cfg-field"><label>日期</label><input type="date" id="lgDate"></div>
          <div class="cfg-field"><label>分类</label>
            <select id="lgCategory">${LEDGER_CATEGORIES.map(x=>`<option value="${x}">${x}</option>`).join('')}</select>
          </div>
        </div>
        <div class="cfg-field" style="margin-top:10px;"><label>说明</label><input type="text" id="lgNote" placeholder="比如：校庆演出报酬 / 换了一套鼓皮"></div>
        <div class="composer-row" style="justify-content:flex-end;">
          <button class="btn btn-primary" id="lgAdd" style="width:auto;padding:8px 20px;">记一笔</button>
        </div>
      </div>
    ` : `<div class="banner">💰 账本由坤坤统一管理，其他人可以查看每一笔明细，但不能增删改。</div>`}
    <div id="ledgerList"></div>
  `;

  if(canEdit){
    const d = new Date();
    document.getElementById('lgDate').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    document.getElementById('lgAdd').onclick = async ()=>{
      const amount = Number(document.getElementById('lgAmount').value);
      const date = document.getElementById('lgDate').value;
      const note = document.getElementById('lgNote').value.trim();
      if(!amount || amount<=0){ alert('填一个大于0的金额'); return; }
      if(!date){ alert('选一下日期'); return; }
      state.ledger = state.ledger || [];
      state.ledger.unshift({
        id:'lg_'+Date.now(),
        type: document.getElementById('lgType').value,
        amount, date, note,
        category: document.getElementById('lgCategory').value,
        byId: state.identity, ts: Date.now()
      });
      await queueSave();
      renderLedger(body);
    };
  }

  const ledgerList = document.getElementById('ledgerList');
  if(list.length===0){ ledgerList.innerHTML = `<div class="empty-hint">还没有任何记录</div>`; return; }
  ledgerList.innerHTML = list.map(x=>`
    <div class="ledger-row">
      <div class="ledger-row-main">
        <div class="ledger-row-note">${escapeHtml(x.note||x.category||'（无说明）')}</div>
        <div class="ledger-row-meta">${x.date} · ${escapeHtml(x.category||'')}</div>
      </div>
      <div class="ledger-row-amount ${x.type==='income'?'income':'expense'}">${x.type==='income'?'+':'−'}${fmtMoney(Number(x.amount||0))}</div>
      ${canEdit? `<button type="button" class="ledger-del" data-id="${x.id}">删除</button>`:''}
    </div>
  `).join('');
  ledgerList.querySelectorAll('.ledger-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('删除这一笔记录吗？')) return;
      state.ledger = state.ledger.filter(x=>x.id!==b.dataset.id);
      await queueSave();
      renderLedger(body);
    };
  });
}

/* ---------------- 限时活动：征集团体名字 ---------------- */
function renderNameContest(body){
  const list = [...(state.nameProposals||[])].sort((a,b)=>{
    const scoreA = (a.reactions.like||[]).length - (a.reactions.meh||[]).length;
    const scoreB = (b.reactions.like||[]).length - (b.reactions.meh||[]).length;
    return scoreB - scoreA || b.ts - a.ts;
  });
  body.innerHTML = `
    <div class="banner" style="margin-bottom:16px;">🎤 限时活动：给我们的乐队征集一个新团体名字！随便提名字、说理由，大家可以点"喜欢／考虑一下／觉得一般"来投票。</div>
    <div class="composer">
      <input type="text" id="npName" placeholder="提议的名字" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);margin-bottom:8px;">
      <textarea id="npReason" placeholder="为什么想叫这个名字？" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);min-height:64px;"></textarea>
      <div class="composer-row" style="justify-content:flex-end;margin-top:8px;">
        <button class="btn btn-primary" id="npAdd" style="width:auto;padding:8px 20px;">提交提议</button>
      </div>
    </div>
    <div id="npList"></div>
  `;
  document.getElementById('npAdd').onclick = async ()=>{
    const name = document.getElementById('npName').value.trim();
    const reason = document.getElementById('npReason').value.trim();
    if(!name){ alert('至少写个名字吧'); return; }
    state.nameProposals = state.nameProposals || [];
    state.nameProposals.push({ id:'np_'+Date.now(), name, reason, authorIdx: state.identity, ts: Date.now(), reactions:{like:[],consider:[],meh:[]} });
    await queueSave();
    renderNameContest(body);
  };
  const npList = document.getElementById('npList');
  if(list.length===0){ npList.innerHTML = `<div class="empty-hint">还没有人提议名字，第一个来吧</div>`; return; }
  npList.innerHTML = list.map(np=>{
    const author = getPersonById(np.authorIdx);
    const myReaction = ['like','consider','meh'].find(k=> (np.reactions[k]||[]).includes(state.identity)) || null;
    return `<div class="post-card">
      <div class="post-head">
        <div class="post-avatar">${(author.name||'')[0]||''}</div>
        <div>
          <div class="post-author">${escapeHtml(author.name)}</div>
          <div class="post-time">${fmtTime(np.ts)}</div>
        </div>
      </div>
      <div class="post-author" style="font-size:18px;">${escapeHtml(np.name)}</div>
      ${np.reason? `<div class="post-text" style="margin-top:4px;">${escapeHtml(np.reason)}</div>` : ''}
      <div class="np-reactions">
        <button type="button" class="np-react ${myReaction==='like'?'active':''}" data-np="${np.id}" data-r="like">👍 喜欢 (${(np.reactions.like||[]).length})</button>
        <button type="button" class="np-react ${myReaction==='consider'?'active':''}" data-np="${np.id}" data-r="consider">🤔 考虑一下 (${(np.reactions.consider||[]).length})</button>
        <button type="button" class="np-react ${myReaction==='meh'?'active':''}" data-np="${np.id}" data-r="meh">😐 觉得一般 (${(np.reactions.meh||[]).length})</button>
      </div>
    </div>`;
  }).join('');
  npList.querySelectorAll('.np-react').forEach(btn=>{
    btn.onclick = async ()=>{
      const np = state.nameProposals.find(x=>x.id===btn.dataset.np);
      if(!np) return;
      const r = btn.dataset.r;
      ['like','consider','meh'].forEach(k=>{
        np.reactions[k] = (np.reactions[k]||[]).filter(id=>String(id)!==String(state.identity));
      });
      const already = btn.classList.contains('active');
      if(!already){ np.reactions[r] = np.reactions[r]||[]; np.reactions[r].push(state.identity); }
      await queueSave();
      renderNameContest(body);
    };
  });
}

function renderComposer(){
  const c = document.getElementById('composer');
  c.innerHTML = `
    <textarea id="postText" placeholder="分享点什么……今天排练怎么样？"></textarea>
    <div class="composer-row">
      <label class="btn btn-ghost" style="cursor:pointer;">选择照片<input type="file" accept="image/*" id="postPhoto" style="display:none;"></label>
      <span id="photoFileName" style="font-size:12px;color:var(--ink-soft);"></span>
    </div>
    <img id="photoPreview" class="photo-preview" style="display:none;">
    <div class="composer-row">
      <select id="shareType">
        <option value="">不分享电影/音乐</option>
        <option value="movie">分享一部电影</option>
        <option value="music">分享一首音乐</option>
      </select>
    </div>
    <div class="share-fields" id="shareFields" style="display:none;">
      <input type="text" id="shareName" placeholder="名称">
      <input type="text" id="shareLink" placeholder="链接（选填）">
    </div>
    <div class="composer-row" style="justify-content:flex-end;">
      <button class="btn btn-primary" id="postBtn" style="width:auto;padding:8px 20px;">发布</button>
    </div>
  `;
  let pendingPhoto = null;
  document.getElementById('postPhoto').addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    document.getElementById('photoFileName').textContent = file.name;
    try{
      pendingPhoto = await prepareImage(file, 'posts', 760, 0.72);
      const prev = document.getElementById('photoPreview');
      prev.src = pendingPhoto; prev.style.display = 'block';
    }catch(err){ alert('图片处理失败：' + err.message); }
  });
  document.getElementById('shareType').addEventListener('change', (ev)=>{
    document.getElementById('shareFields').style.display = ev.target.value? 'flex' : 'none';
  });
  document.getElementById('postBtn').onclick = async ()=>{
    const text = document.getElementById('postText').value.trim();
    const shareType = document.getElementById('shareType').value;
    const shareName = document.getElementById('shareName').value.trim();
    const shareLink = document.getElementById('shareLink').value.trim();
    if(!text && !pendingPhoto && !shareType){ alert('写点文字、传张照片，或分享一个电影/音乐再发布吧'); return; }
    if(shareType && !shareName){ alert('分享电影/音乐的话，名称不能为空'); return; }
    const post = {
      id: 'p_'+Date.now(),
      authorIdx: state.identity,
      text,
      photo: pendingPhoto,
      share: shareType? { type: shareType, name: shareName, link: shareLink } : null,
      likes: [],
      comments: [],
      ts: Date.now()
    };
    state.posts = state.posts || [];
    state.posts.unshift(post);
    // 给除了发帖人以外的所有人发一条"有新帖子"的提醒
    allPeople().forEach(p=>{ addNotif(p.id, 'new_post', state.identity, post.id); });
    await queueSave();
    renderComposer();
    renderPostList();
    renderNotifBell();
  };
}

function renderPostList(){
  const list = document.getElementById('postList');
  const posts = (state.posts||[]).slice().sort((a,b)=>b.ts-a.ts);
  if(posts.length===0){ list.innerHTML = `<div class="empty-hint">还没有人发帖，来发第一条吧</div>`; return; }
  list.innerHTML = posts.map(p=>renderPostCard(p)).join('');
  list.querySelectorAll('.post-like').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.id;
      const post = state.posts.find(x=>x.id===id);
      if(!post) return;
      post.likes = post.likes || [];
      const idx = post.likes.indexOf(state.identity);
      if(idx>=0){
        post.likes.splice(idx,1);
      }else{
        post.likes.push(state.identity);
        addNotif(post.authorIdx, 'like', state.identity, post.id);
      }
      await queueSave();
      renderPostList();
    };
  });
  list.querySelectorAll('.post-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('确定删除这条内容吗？')) return;
      state.posts = state.posts.filter(x=>x.id!==b.dataset.id);
      await queueSave();
      renderPostList();
    };
  });
  list.querySelectorAll('.comment-add').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.id;
      const input = list.querySelector(`.comment-input input[data-id="${id}"]`);
      const text = input.value.trim();
      if(!text) return;
      const post = state.posts.find(x=>x.id===id);
      post.comments = post.comments || [];
      post.comments.push({ id:'cm_'+Date.now()+Math.random().toString(36).slice(2,5), authorIdx: state.identity, text, ts: Date.now() });
      addNotif(post.authorIdx, 'comment', state.identity, post.id, text.slice(0,30));
      const replyTarget = input.dataset.replyTarget;
      if(replyTarget!==undefined && replyTarget!=='' && String(replyTarget)!==String(post.authorIdx)){
        addNotif(replyTarget, 'reply', state.identity, post.id, text.slice(0,30));
      }
      await queueSave();
      renderPostList();
    };
  });
  list.querySelectorAll('.comment-reply-btn').forEach(b=>{
    b.onclick = ()=>{
      const input = list.querySelector(`.comment-input input[data-id="${b.dataset.post}"]`);
      if(!input) return;
      input.value = `回复${b.dataset.name}：`;
      input.dataset.replyTarget = b.dataset.target;
      input.focus();
    };
  });
  list.querySelectorAll('.comment-del-btn').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('删除这条评论吗？')) return;
      const post = state.posts.find(x=>x.id===b.dataset.post);
      if(!post) return;
      post.comments.splice(+b.dataset.ci, 1);
      await queueSave();
      renderPostList();
    };
  });
}

function renderPostCard(p){
  const author = getPersonById(p.authorIdx);
  const canDel = (String(p.authorIdx)===String(state.identity)) || isAdmin();
  const liked = (p.likes||[]).includes(state.identity);
  const avatar = (state.profiles[p.authorIdx]||{}).avatar;
  let shareHtml = '';
  if(p.share){
    const label = p.share.type==='movie' ? '🎬 分享了一部电影' : '🎵 分享了一首音乐';
    shareHtml = `<div class="post-share">${label}：<b>${escapeHtml(p.share.name)}</b>${p.share.link? ` · <a href="${escapeHtml(p.share.link)}" target="_blank" rel="noopener">查看链接</a>` : ''}</div>`;
  }
  return `<div class="post-card">
    <div class="post-head">
      <div class="post-avatar">${avatar? `<img src="${avatar}">` : (author.name[0]||'')}</div>
      <div>
        <div class="post-author">${author.name} <span style="font-weight:400;color:var(--ink-soft);font-size:12px;">· ${author.instrument}</span></div>
        <div class="post-time">${fmtTime(p.ts)}</div>
      </div>
    </div>
    ${p.text? `<div class="post-text">${escapeHtml(p.text)}</div>` : ''}
    ${p.photo? `<img class="post-photo" src="${p.photo}">` : ''}
    ${shareHtml}
    <div class="post-actions">
      <button class="post-like ${liked?'liked':''}" data-id="${p.id}">${liked?'❤':'♡'} ${(p.likes||[]).length||''}</button>
      ${canDel? `<button class="post-del" data-id="${p.id}">删除</button>` : ''}
    </div>
    ${(p.likes||[]).length>0 ? `<div class="post-liked-by">❤ ${ (p.likes||[]).map(lid=>escapeHtml(getPersonById(lid).name)).join('、') } 点了赞</div>` : ''}
    <div class="comments">
      ${(p.comments||[]).map((c,ci)=>{
        const cAuthor = getPersonById(c.authorIdx);
        const canDelC = (String(c.authorIdx)===String(state.identity)) || isAdmin();
        return `<div class="comment-row">
          <div><b>${escapeHtml(cAuthor.name||'')}：</b>${escapeHtml(c.text)}</div>

            ${canDelC? `<button type="button" class="comment-del-btn" data-post="${p.id}" data-ci="${ci}">删除</button>` : ''}
          </div>
        </div>`;
      }).join('')}
      <div class="comment-input">
        <input type="text" placeholder="写条评论…" data-id="${p.id}">
        <button class="icon-btn comment-add" data-id="${p.id}">发送</button>
      </div>
    </div>
  </div>`;
}
